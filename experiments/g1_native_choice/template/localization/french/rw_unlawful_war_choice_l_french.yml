l_french:
 rw_uw_defy_option:0 "Défier l’interdiction de mon suzerain"
 rw_uw_defy_warning:0 "Je choisis de passer outre l’interdiction de cette guerre par mon suzerain. Je ne peux pas invoquer en même temps un hameçon pour obtenir son autorisation. Toutes les autres conditions de déclaration restent applicables."
 rw_uw.royal_title:0 "Un vassal défie ma paix"
 rw_uw.royal_desc:0 "[scope:rw_uw_attacker.GetTitledFirstName] a déclaré une guerre de revendication contre [scope:rw_uw_defender.GetTitledFirstName] en choisissant explicitement de défier mon interdiction. Tous deux restent mes vassaux directs. Je peux ignorer ce défi, exprimer ma désapprobation ou exiger la fin des hostilités. Ce rapport ne constitue pas un constat de crime."
 rw_uw.ignore:0 "D’autres affaires me retiennent."
 rw_uw.censure:0 "Faire connaître ma désapprobation."
 rw_uw.demand:0 "Exiger la fin de ces hostilités."
 rw_uw.censure_effect:0 "Mon opinion de l’attaquant baisse de 10 pendant deux ans. Aucun titre, crime ou résultat de guerre ne change."
 rw_uw.demand_effect:0 "L’attaquant reçoit ma demande et peut en accuser réception ou la refuser ouvertement. Cela ne force pas la paix."
 rw_uw.demand_title:0 "Mon suzerain exige la fin de la guerre"
 rw_uw.demand_desc:0 "[scope:rw_uw_issuer.GetTitledFirstName] exige que je mette fin à ma guerre de revendication contre [scope:rw_uw_defender.GetTitledFirstName]. La conduite ou le règlement de la guerre reste ma décision, selon les règles habituelles."
 rw_uw.acknowledge:0 "J’ai reçu la demande."
 rw_uw.refuse:0 "Je refuse cette ingérence."
 rw_uw.acknowledge_effect:0 "Accuser réception seulement. Je ne promets pas la paix, ne concède pas la guerre et n’avoue aucun crime."
 rw_uw.refuse_effect:0 "L’opinion de mon suzerain envers moi baisse de 15 pendant deux ans. Aucun crime ou châtiment automatique n’est ajouté."
 rw_uw.censure_title:0 "Mon suzerain condamne mon défi"
 rw_uw.censure_notice:0 "[scope:rw_uw_issuer.GetTitledFirstName] désapprouve expressément ma décision de défier son interdiction. La guerre continue selon ses règles habituelles."
 rw_uw.answer_title:0 "Une réponse à ma demande"
 rw_uw.acknowledged_notice:0 "[scope:rw_uw_attacker.GetTitledFirstName] accuse réception de ma demande. Ce n’est pas une promesse de mettre fin à la guerre."
 rw_uw.refused_notice:0 "[scope:rw_uw_attacker.GetTitledFirstName] refuse ouvertement ma demande. Aucun châtiment n’est imposé automatiquement."
 rw_uw.close:0 "Fermer"
 rw_uw_censured_opinion:0 "A défié ma paix"
 rw_uw_refused_stop_opinion:0 "A refusé ma demande de cesser les hostilités"
