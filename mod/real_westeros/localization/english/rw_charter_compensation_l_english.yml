l_english:
 rw_charter_compensation.title:0 "Public compensation in place of the charter"
 rw_charter_compensation.parties:0 "Title: [rw_lr_title.GetName]. Crown: [rw_lr_authority.GetName]. House: [rw_lr_house.GetName]. The named personal payer is [rw_cq_payer.GetShortUIName]; the named personal recipient is [rw_cq_payee.GetShortUIName]. This public offer concerns release of this exact institutional charter only."
 rw_charter_compensation.price25:0 "Current terms: the named sovereign pays 25 personal gold to the named house head, in exchange for release of this charter."
 rw_charter_compensation.price50:0 "Current terms: the named sovereign pays 50 personal gold to the named house head, in exchange for release of this charter."
 rw_charter_compensation.offered:0 "Only the other current representative may accept these exact latest terms or counter. The original seven-day dialogue and original charter deadline both apply. Neither a counter nor reading renews either. No money is reserved or paid yet; free charter exits remain available."
 rw_charter_compensation.paid:0 "This exact public agreement records the agreed personal payment and release of the charter together. No land, title right, house treasury, inherited debt, legal pardon or other remedy is created or erased. The original charter and land facts remain in the archive; the recorded monetary parties are not replaced by successors."
 rw_charter_compensation.closed:0 "A current representative closed these unpaid talks. No money or charter release followed from closing the offer. The charter follows its own existing state and deadline."
 rw_charter_compensation.inactive:0 "This offer no longer permits payment: its window, charter version, active charter state or named representatives have changed. It is not inherited consent, a debt or an agreement. Current representatives may explicitly propose fresh terms after a real role or charter-version change; old panels remain inert."
 rw_charter_compensation.unfunded:0 "The named sovereign currently lacks the agreed personal gold. No negative-balance fallback, borrowing or house-bank payment is authorized. Nothing is charged and the charter is not released."
 rw_charter_compensation.limits:0 "These are public financial terms under the land register’s existing reader policy. Personal gold moves only after both named current representatives agree; no native AGOT banking, claim, title, war, house sanction or unrelated promise is modified. Expiry/refusal gives no payment or inherited duty. Registry retention and original charter deadlines are never extended."
 rw_charter_compensation.unavailable:0 "No exact current public financial terms are available for this charter and viewer. Missing or stale metadata creates no consent or payment."
 rw_charter_compensation.offer25:0 "Publicly offer 25 personal gold for release of this exact charter; ask the current house head."
 rw_charter_compensation.request50:0 "Publicly propose release of this exact charter for 50 personal gold from the current sovereign."
 rw_charter_compensation.accept:0 "Accept these exact terms: pay the agreed personal gold and release this charter once."
 rw_charter_compensation.counter50:0 "Counter 50 gold for release; do not pay or release yet."
 rw_charter_compensation.counter25:0 "Counter 25 gold for release; do not pay or release yet."
 rw_charter_compensation.close:0 "Close these talks without payment or charter release."
 rw_charter_compensation.leave:0 "Leave these terms unchanged for now."
 rw_charter_compensation.review:0 "Review the public compensation terms for this charter."
 rw_charter_compensation.charter_released:0 "This charter was released through a recorded public compensation agreement between its then-current representatives. Consult that agreement for the exact amount and named monetary parties. This is no title grant, pardon or inherited personal debt."
