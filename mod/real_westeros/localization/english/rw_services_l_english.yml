l_english:
 rw_offer_endorsement_interaction:0 "Offer Public Endorsement (Experimental)"
 rw_offer_endorsement_interaction_desc:0 "Offer to speak publicly in support of this ruler for 50 gold. They may counter with 25. Acceptance transfers the agreed gold and grants them 50 prestige immediately. Offer expires after 30 days; one offer per year. Not engine-tested."
 rw_services.0001.t:0 "A Voice in Your Favour"
 rw_services.0001.desc:0 "[rw_service_provider.GetTitledFirstName] offers to speak in support of my standing. The price is 50 gold, for an immediate gain of 50 prestige. I may accept, offer 25 gold, or decline."
 rw_services.0002.t:0 "A Lower Price"
 rw_services.0002.desc:0 "[rw_service_client.GetTitledFirstName] offers 25 gold for my public endorsement. If I agree, I receive 25 gold and they gain 50 prestige immediately. I may instead maintain my 50-gold price, or end the discussion."
 rw_services.accept_50:0 "Pay 50 gold for the endorsement."
 rw_services.counter_25:0 "Offer 25 gold instead."
 rw_services.accept_25:0 "Accept 25 gold and give the endorsement."
 rw_services.requote_50:0 "Maintain the price of 50 gold."
 rw_services.refuse:0 "End the negotiation."
 rw_services.lapsed:0 "This proposal is no longer valid."
 rw_offer_deferred_endorsement_interaction:0 "Promise a Future Endorsement (Experimental)"
 rw_offer_deferred_endorsement_interaction_desc:0 "Negotiate an endorsement to be delivered after seven days and before the negotiated fourteen- or thirty-day deadline from acceptance. Payment of the agreed 25 or 50 gold occurs only if the service is performed. The provider can wait or break the promise. Not engine-tested."
 rw_services.0001.deferred_desc:0 "[rw_service_provider.GetTitledFirstName] asks 50 gold for a future endorsement. No gold or prestige changes now. If accepted, the provider may perform after seven days and before the delivery deadline below, receiving payment then. They may also wait or break the promise. I can counter at 25 gold."
 rw_services.0002.deferred_desc:0 "[rw_service_client.GetTitledFirstName] offers 25 gold for my future endorsement. Accepting creates an obligation to perform after seven days and before the delivery deadline below; payment occurs only upon performance. I remain free to wait or break this promise."
 rw_services.promise_50:0 "Agree: 50 gold only upon future performance."
 rw_services.promise_25:0 "Promise to perform later for 25 gold."
