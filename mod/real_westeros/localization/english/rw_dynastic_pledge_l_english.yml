l_english:
 rw_offer_dynastic_endowment_interaction:0 "Propose a legacy endowment"
 rw_offer_dynastic_endowment_interaction_desc:0 "Propose a legacy contribution between our houses, fixed at 50, 100, 200 or 400 gold according to the original contributor’s rank. Future heads may personally recognise the accepted undertaking before contributing from their own treasury."
 rw_review_dynastic_endowments_interaction:0 "Consult our houses’ legacy promises"
 rw_review_dynastic_endowments_interaction_desc:0 "Read promises known to me as an original signatory or current house head. Merely consulting them makes no commitment."
 rw_dynastic_pledge.title:0 "A promise between houses"
 rw_dynastic_pledge.history:0 "[rw_dp_original_payer.GetTitledFirstName] proposed the contribution shown below to [rw_dp_original_payee.GetTitledFirstName], after the original benefactor’s death. Current house heads decide whether to recognise the accepted undertaking and contribute from their own treasury."
 rw_dynastic_pledge.offered:0 "The original heads have seven days to agree. No money is taken and an unanswered or obsolete proposal ends without blame."
 rw_dynastic_pledge.active:0 "The accepted promise lasts twenty-five years. Performance requires the original benefactor’s death, personal recognition by both current heads and sufficient funds for the agreed amount."
 rw_dynastic_pledge.paid:0 "[rw_dp_paid_payer.GetTitledFirstName] voluntarily paid the agreed contribution to [rw_dp_paid_payee.GetTitledFirstName]. The receipt names the people who actually paid and received it."
 rw_dynastic_pledge.renounced:0 "A named representative explicitly renounced this promise. The pact does not assign the predecessor’s fault to an heir or modify any native debt."
 rw_dynastic_pledge.released:0 "The beneficiary’s representative released the other house from this promise. No bank debt, title or claim was changed."
 rw_dynastic_pledge.closed:0 "This proposal or promise is closed, expired or no longer actionable. Its history creates no payment or inherited personal guilt."
 rw_dynastic_pledge.unavailable:0 "The situation has changed or this private record is no longer accessible. Consult it again before making a decision."
 rw_dynastic_pledge.accept:0 "Accept this promise between our houses"
 rw_dynastic_pledge.decline:0 "Withdraw or decline this proposal"
 rw_dynastic_pledge.recognize:0 "Personally recognise our house’s promise"
 rw_dynastic_pledge.pay:0 "Honour the promise with 50 of my own gold"
 rw_dynastic_pledge.renounce:0 "Decline to carry this promise forward"
 rw_dynastic_pledge.release:0 "Release the other house from this promise"
 rw_dynastic_pledge.refresh:0 "Consult the current situation again"
 rw_dynastic_pledge.leave:0 "Leave the matter for now"
