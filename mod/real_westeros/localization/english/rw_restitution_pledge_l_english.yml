l_english:
 rw_restitution_pledge.title:0 "A Personal Promise of Restitution"
 rw_restitution_renounced_opinion:0 "Renounced a personal restitution promise"
 rw_restitution_pledge.propose:0 "Offer my personal promise to return this title within thirty days, without payment."
 rw_restitution_pledge.review:0 "Review our separate restitution promise."
 rw_restitution_pledge.discussion_closed:0 "The discussion has closed or lost its conditions. A separately accepted personal promise has its own outcome and deadline. Closing this discussion does not release or renounce that promise and adds no refusal penalty."
 rw_restitution_pledge.identity:0 "[rw_rs_holder.GetShortUIName] offered [rw_rs_requester.GetShortUIName] a personal undertaking to return [rw_rs_title.GetName]. This is separate from merely examining the request."
 rw_restitution_pledge.days_14:0 "Proposed or accepted delivery period: fourteen days from acceptance of these terms."
 rw_restitution_pledge.days_30:0 "Proposed or accepted delivery period: thirty days from acceptance of these terms."
 rw_restitution_pledge.offered:0 "The current responder may accept these exact terms, counter with the other period or close the offer. Counteroffers switch the responder. The original seven-day offer window and the original discussion deadline both still apply; neither is renewed. No promise exists until acceptance."
 rw_restitution_pledge.offer_closed:0 "One party closed the unaccepted offer. No promise, transfer, payment or penalty follows."
 rw_restitution_pledge.offer_lapsed:0 "The offer expired or its original discussion, parties, ownership or source no longer permit acceptance. No personal promise was accepted."
 rw_restitution_pledge.promised:0 "Both parties accepted this personal promise. Its agreed delivery period runs from acceptance, independently of the discussion window. It transfers no title and guarantees no native eligibility. The holder must use ordinary native grant actions; the beneficiary may freely release the promise."
 rw_restitution_pledge.renounced:0 "The captured holder explicitly renounced the accepted promise while still holding the title. No automatic sanction follows. For seven days the beneficiary may acknowledge this or choose a bounded personal reaction while current conditions permit."
 rw_restitution_pledge.released:0 "The beneficiary freely released the accepted promise. No payment, title transfer or new penalty follows."
 rw_restitution_pledge.unresolved:0 "The deadline elapsed without a recorded beneficiary confirmation. This does not prove deliberate breach or when and how the title moved. No automatic punishment follows. The beneficiary may release this promise or, if now holding the title, record satisfaction."
 rw_restitution_pledge.invalidated:0 "An observed death or loss of the title to a third party ended this pending personal promise neutrally. No successor inherits consent, guilt or an obligation to transfer land."
 rw_restitution_pledge.acknowledged:0 "While holding this exact title, the beneficiary confirmed satisfaction before the promise deadline. This records that personal statement and present ownership, not the cause or route of acquisition."
 rw_restitution_pledge.acknowledged_late:0 "After the promise deadline, the beneficiary confirmed satisfaction while holding this title. The confirmation is late; this does not establish that acquisition was late or caused by the promise."
 rw_restitution_pledge.boundaries:0 "No title, gold, prestige, claim, pardon or legal right is created by these choices. Native grant selection, restrictions and confirmation remain separate. Current ownership alone never completes the promise automatically. Silence and an unresolved deadline add no penalty. Personal terms and replies remain between the original two parties."
 rw_restitution_pledge.unavailable:0 "This private promise, its current terms or my identity as an original participant is no longer valid. No decision or transfer follows."
 rw_restitution_pledge.accept:0 "Accept this exact personal restitution promise and its delivery period."
 rw_restitution_pledge.counter:0 "Counter with the other delivery period: fourteen instead of thirty days, or thirty instead of fourteen."
 rw_restitution_pledge.close_offer:0 "Close this offer without accepting a promise."
 rw_restitution_pledge.acknowledge:0 "I now hold this title and confirm satisfaction; this certifies no acquisition route."
 rw_restitution_pledge.renounce:0 "Explicitly renounce my accepted promise while I still hold the title."
 rw_restitution_pledge.release:0 "Release the other party from this personal promise without penalty."
 rw_restitution_pledge.resent:0 "Resent this explicit renunciation — my opinion −15 for two years if absent, without stacking or renewal."
 rw_restitution_pledge.accept_renunciation:0 "Acknowledge the renunciation without adding a penalty."
 rw_restitution_pledge.resented_history:0 "The beneficiary chose to resent the renunciation. That historical response neither renews an opinion modifier nor proves a crime."
 rw_restitution_pledge.response_history:0 "The beneficiary acknowledged the renunciation without adding a penalty."
