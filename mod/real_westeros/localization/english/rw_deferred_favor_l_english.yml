l_english:
 rw_offer_deferred_favor_endorsement_interaction:0 "Promise Support for a Future Favor"
 rw_offer_deferred_favor_endorsement_interaction_desc:0 "Negotiate a deferred endorsement for a native favor or 25 gold. Acceptance promises performance after seven days and before thirty, without transferring anything now. The original client may withdraw before performance."
 rw_deferred_favor.immediate_timing:0 "Immediate terms: agreement performs the endorsement and selected consideration now, not later."
 rw_deferred_favor.timing:0 "Deferred terms: agreement creates a personal promise, not an immediate exchange. The provider may perform after seven days and before thirty days from acceptance. Only then is the agreed favor or 25 gold exchanged for 50 client prestige, after fresh eligibility checks. The client may withdraw before performance; no funds or favors are reserved."
 rw_deferred_favor.promised:0 "The personal promise is accepted and its original delivery period is still open. The provider decides whether to perform, renounce or leave it pending. The original client may withdraw the future consideration. Reading never extends the deadline."
 rw_deferred_favor.renounced:0 "The original provider explicitly renounced the accepted promise. No service, favor or money follows; this statement creates no automatic crime, penalty or inherited obligation."
 rw_deferred_favor.withdrawn:0 "The original client withdrew before performance. No consideration or prestige is exchanged. Existing native hooks remain untouched and no debt or automatic blame is created."
 rw_deferred_favor.unresolved:0 "The delivery window ended without recorded performance, or this promise is no longer active. This is unresolved, not proof of deliberate breach. No automatic service, consideration, sanction or inherited duty follows."
 rw_deferred_favor.accept:0 "Accept these exact deferred terms, without exchanging favor, gold or prestige now."
 rw_deferred_favor.perform:0 "Perform now: apply the accepted favor or 25-gold consideration and grant the client 50 prestige."
 rw_deferred_favor.renounce:0 "Explicitly renounce my promise without performing it."
 rw_deferred_favor.withdraw:0 "Withdraw my future consideration before performance; exchange nothing."
 rw_deferred_favor.consideration_unavailable:0 "The accepted consideration cannot currently be provided: the required client funds or native favor eligibility are missing. Nothing is taken. Waiting does not extend the deadline; renunciation or client withdrawal remains separate."
