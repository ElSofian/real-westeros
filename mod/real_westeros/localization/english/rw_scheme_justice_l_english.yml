l_english:
 rw_scheme_justice.open:0 "Examine the current judicial situation."
 rw_scheme_justice.title:0 "Observation and present judicial grounds"
 rw_scheme_justice.intro:0 "This examination concerns only the participant identified in my private observation. It reports the present situation, not the legal situation at the time of discovery.\n\n"
 rw_scheme_justice.own_custody:0 "This person is currently my prisoner. This does not establish why they were arrested or that this plot has already been punished.\n\n"
 rw_scheme_justice.other_custody:0 "This person is currently imprisoned by someone else. My observation does not authorize transferring their custody.\n\n"
 rw_scheme_justice.free:0 "This person is not currently imprisoned. They may have been imprisoned or punished earlier.\n\n"
 rw_scheme_justice.unknown_custody:0 "Current custody could not be established.\n\n"
 rw_scheme_justice.reason:0 "I currently have a native imprisonment reason against this person. It may concern another act; this examination cannot link it to the recorded plot or guarantee that an arrest is possible.\n\n"
 rw_scheme_justice.no_reason:0 "I currently have no native imprisonment reason against this person. This does not establish innocence, a pardon, or whether a reason was previously consumed.\n\n"
 rw_scheme_justice.unknown_reason:0 "Current imprisonment grounds could not be established.\n\n"
 rw_scheme_justice.limits:0 "Any arrest must use the normal imprisonment interaction, with its own conditions, risks and possible resistance. This examination neither imposes nor repeats a penalty. Voluntary payment, refusal or silence changes none of these judicial grounds."
 rw_scheme_justice.not_living:0 "This observation can still be read, but no current judicial examination is offered for its deceased or invalid participant. No relative or heir is substituted."
 rw_scheme_justice.unavailable:0 "This private observation is no longer accessible. No judicial grounds are inferred."
 rw_scheme_justice.close:0 "Close the examination."
