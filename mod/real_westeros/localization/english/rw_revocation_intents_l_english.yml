l_english:
 rw_consider_title_revocation_interaction:0 "Consider revoking a specific title"
 rw_consider_title_revocation_interaction_desc:0 "Select a title to review an intention based on one of my private observations. Selection alone issues no intention and revokes nothing."
 rw_review_revocation_intents_interaction:0 "Review my title-revocation intentions"
 rw_review_revocation_intents_interaction_desc:0 "Read my private pending and past intentions. The selected character receives nothing."
 rw_revocation_intents.title:0 "An intention concerning a title"
 rw_revocation_intents.confirm_terms:0 "I am considering [rw_ri_title.GetName], currently held by [rw_ri_subject.GetShortUIName], in connection with my private observation #[SCOPE.GetValue('rw_scheme_evidence_serial')|0]. Recording this intention costs nothing and lasts thirty days. It revokes nothing and does not establish a legal judgment. A native transfer of this exact title from this person to me may later be recorded as corresponding to it; this does not prove why the native action occurred."
 rw_revocation_intents.confirm:0 "Record this intention for thirty days."
 rw_revocation_intents.inspect_basis:0 "Reread the underlying private observation before deciding."
 rw_revocation_intents.identity:0 "This entry concerns [rw_ri_title.GetName] and [rw_ri_subject.GetShortUIName], based on my private observation #[SCOPE.GetValue('rw_ri_basis_serial')|0]."
 rw_revocation_intents.pending:0 "The original thirty-day window remains open. I may withdraw or examine native revocation terms if my current authority, custody and the title still permit it. Nothing has been revoked by this intention."
 rw_revocation_intents.withdrawn:0 "I withdrew this intention. Later transfers cannot execute or reactivate it."
 rw_revocation_intents.expired:0 "The original thirty-day window has expired. This intention cannot be linked to a later transfer. No title or punishment is changed."
 rw_revocation_intents.observed:0 "A matching transfer was observed in the native revocation context and linked to this intention. This records correspondence, not proof that this particular plot was punished lawfully."
 rw_revocation_intents.boundaries:0 "Opening terms sends nothing and does not preselect the title: choose the intended title in the ordinary native window and confirm there separately. Native restrictions, costs, refusal and consequences remain authoritative. This private entry creates no ancestral entitlement, pardon or inherited guilt."
 rw_revocation_intents.open_native:0 "Examine native revocation terms."
 rw_revocation_intents.withdraw:0 "Withdraw this intention without a penalty."
 rw_revocation_intents.leave:0 "Leave the situation unchanged."
 rw_revocation_intents.unavailable:0 "The observation, custody, title or existing intention has changed. No new intention or transfer is recorded."
 rw_revocation_intents.provenance_link:0 "This observation corresponds to my recorded intention based on private observation #[SCOPE.GetValue('rw_ri_basis_serial')|0]. That was my declared basis, not a native finding that this offense caused the transfer."
