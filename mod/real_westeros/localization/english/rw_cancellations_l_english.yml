l_english:
 rw_request_release_endorsement_interaction:0 "Request Release from My Promise"
 rw_request_release_endorsement_interaction_desc:0 "Ask the client to release you from the current deferred endorsement. Only their explicit acceptance cancels it. The request lasts seven days and does not suspend performance or extend the original deadline. No money, prestige or opinion changes on release."
 rw_offer_release_endorsement_interaction:0 "Offer to Release This Promise"
 rw_offer_release_endorsement_interaction_desc:0 "Offer to release the provider from their deferred endorsement to you. Only their explicit acceptance cancels it. The request lasts seven days and does not suspend performance or extend the original deadline. No money, prestige or opinion changes on release."
 rw_cancellations.0001.t:0 "A Promise We Could End Together"
 rw_cancellations.0001.desc:0 "[rw_cancel_proposer.GetTitledFirstName] proposes ending the deferred endorsement from [rw_service_provider.GetTitledFirstName] to [rw_service_client.GetTitledFirstName] by mutual consent. I can agree, refuse or leave this unanswered. Only agreement releases both parties. No gold, prestige or opinion is gained or lost. The request expires after seven days; the promise remains active until then and its original deadline does not change."
 rw_cancellations.accept:0 "Agree: release both parties without payment or penalty."
 rw_cancellations.reject:0 "Refuse: keep the original promise."
 rw_cancellations.ignore:0 "Leave this unanswered; no consent is given."
 rw_cancellations.lapsed:0 "This request no longer permits a decision."
 rw_cancellations.0002.t:0 "A Promise Released by Agreement"
 rw_cancellations.released:0 "[rw_service_provider.GetTitledFirstName] and [rw_service_client.GetTitledFirstName] agreed to end this deferred endorsement. No service was delivered, payment taken, reward granted or breach recorded by this release. Older, separate affairs remain unchanged."
 rw_cancellations.unavailable:0 "This notice no longer refers to a current, matching record. It neither grants consent nor changes any promise or recorded breach."
 rw_cancellations.acknowledge:0 "Noted."
 rw_cancellations.0003.t:0 "A Deferred Promise Is Recorded"
 rw_cancellations.promise_received:0 "[rw_service_provider.GetTitledFirstName] has promised me a future endorsement under our agreed price. No payment or prestige has changed hands. I can keep the agreement or propose ending it by mutual consent. The provider may still perform or break it under the original terms; my proposal alone changes nothing."
 rw_cancellations.propose:0 "Propose ending this promise by mutual consent."
 rw_cancellations.keep:0 "Keep the agreement as it stands."
