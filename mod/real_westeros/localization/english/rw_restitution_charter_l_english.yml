l_english:
 rw_restitution_charter.title:0 "A crown restitution charter"
 rw_restitution_charter.introduction:0 "Title: [rw_lr_title.GetName]. Crown: [rw_lr_authority.GetName]. House: [rw_lr_house.GetName]. The current sovereign can propose a public five-year undertaking, on behalf of this recorded crown, to pursue return of this exact title to the recorded former house when the crown personally holds it. Its current house head must explicitly accept within seven days. No title, claim, payment or legal right is created."
 rw_restitution_charter.terms:0 "Title: [rw_lr_title.GetName]. Crown: [rw_lr_authority.GetName]. House: [rw_lr_house.GetName]. This charter concerns only the title, crown and former house in this exact public land entry. It is an institutional political undertaking, not a personal oath silently passed to an heir. Original proposal and acceptance remain distinct from a successor’s explicit recognition."
 rw_restitution_charter.offered:0 "The original seven-day proposal window is open. Only the captured original house head can accept while both captured representatives still hold their roles. A changed office does not inherit pending personal consent. Current representatives can close a stale proposal neutrally."
 rw_restitution_charter.active:0 "The charter was accepted and its original five-year period remains open. The current sovereign may maintain or repudiate it; the current house head may release it, or record satisfaction while the exact house really holds the exact title. No title operation is automatic."
 rw_restitution_charter.unassumed:0 "This current sovereign has not explicitly recognized this charter. They may choose to take it up or repudiate it; reading or gaining the crown is not a personal promise or guilt. Recognition never restarts the original deadline."
 rw_restitution_charter.satisfied:0 "The current house head explicitly recorded satisfaction while a living member of the exact house held this exact title. That ownership and statement do not prove the crown granted it or that the charter caused recovery. No land, reward or immunity was issued by this record."
 rw_restitution_charter.renounced:0 "The then-current sovereign explicitly repudiated the charter. This records an institutional decision, not inherited personal guilt or an automatic native crime, sanction or forfeiture."
 rw_restitution_charter.released:0 "The then-current house head explicitly released the charter on behalf of the recorded house. No native title, claim, opinion or other dispute was changed."
 rw_restitution_charter.closed:0 "The unaccepted proposal was closed by a current representative. No accepted undertaking, personal blame or title right follows."
 rw_restitution_charter.expired:0 "The original proposal or accepted period has elapsed. Silence and missing recovery do not establish deliberate breach, fulfillment or guilt; the record and original archive retention are not renewed."
 rw_restitution_charter.limits:0 "Native grant, inheritance, election, conquest and AGOT rules remain authoritative. This charter forces no transfer or seizure and creates no house-wide land ban or title claim. Native title actions remain separate. Public access and storage follow the existing land registry, whose fixed retention is never extended; lost roles/references disable actions."
 rw_restitution_charter.unavailable:0 "This exact charter or its current roles/revision are unavailable. Missing historical data grants no consent or inherited authority."
 rw_restitution_charter.propose:0 "Propose this public five-year crown undertaking; ask the current house head to accept."
 rw_restitution_charter.accept:0 "Accept these exact institutional terms for the recorded house."
 rw_restitution_charter.assume:0 "Explicitly take up this existing charter as current sovereign, preserving its deadline."
 rw_restitution_charter.renounce:0 "Repudiate this charter as current sovereign, without transferring land."
 rw_restitution_charter.release:0 "Release this charter as current head of the recorded house."
 rw_restitution_charter.satisfy:0 "Record satisfaction: my exact house currently holds this exact title; claim no cause."
 rw_restitution_charter.close:0 "Close this unaccepted proposal without blame or new rights."
 rw_restitution_charter.leave:0 "Leave this charter unchanged."
 rw_restitution_charter.review:0 "Review the public crown restitution charter for this entry."
