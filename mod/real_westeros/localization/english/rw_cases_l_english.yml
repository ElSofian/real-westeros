l_english:
 rw_cases.refer:0 "Disclose this breach to our common overlord; let them decide."
 rw_cases.0001.t:0 "A Promise Brought Before Me"
 rw_cases.0001.refusal_desc:0 "[rw_service_client.GetTitledFirstName] reports that [rw_service_provider.GetTitledFirstName] expressly refused an agreed endorsement. The recorded agreement and refusal support this narrow account; no payment was taken. This does not itself establish a crime. As their common overlord I may leave the dispute alone, reprimand the provider, or invite a voluntary apology."
 rw_cases.0001.deadline_desc:0 "[rw_service_client.GetTitledFirstName] reports that [rw_service_provider.GetTitledFirstName] let an agreed endorsement deadline pass while the parties were eligible and payment was possible. No payment was taken. This records nonperformance, not intent or a crime. I may leave the dispute alone, reprimand the provider, or invite a voluntary apology."
 rw_cases.decline:0 "I will not intervene in this dispute."
 rw_cases.admonish:0 "Reprimand the provider; lower my personal opinion by 10 for two years."
 rw_cases.invite_repair:0 "Invite a public apology, without compelling it."
 rw_cases.lapsed:0 "The conditions for this decision no longer apply."
 rw_cases.0002.t:0 "An Invitation to Make Amends"
 rw_cases.0002.desc:0 "[rw_case_mediator.GetTitledFirstName] invites me to apologise to [rw_service_client.GetTitledFirstName] for the recorded breach. A public apology costs 25 prestige and improves both their opinions of me by 5 for two years. It does not deliver the original service, take payment or erase the breach. I may refuse; no further penalty follows automatically."
 rw_cases.apologise:0 "Apologise publicly at a cost of 25 prestige."
 rw_cases.refuse_repair:0 "Decline the proposed apology."
 rw_cases.0003.t:0 "The Dispute Concludes"
 rw_cases.result_declined:0 "[rw_case_mediator.GetTitledFirstName] chose not to intervene in the endorsement dispute. No sanction or transfer was imposed."
 rw_cases.result_admonished:0 "[rw_case_mediator.GetTitledFirstName] reprimanded [rw_service_provider.GetTitledFirstName]. The overlord’s personal opinion of the provider falls by 10 for two years. No crime, title loss or payment is created."
 rw_cases.result_repaired:0 "[rw_service_provider.GetTitledFirstName] accepted the invitation to apologise, spending 25 prestige. The client and mediator gain 5 opinion of the provider for two years. The original breach remains recorded; no endorsement payment is taken."
 rw_cases.result_repair_declined:0 "[rw_service_provider.GetTitledFirstName] declined the proposed apology. The case closes without an automatic further penalty."
 rw_cases.result_expired:0 "This case has expired, lost its conditions, or been superseded. No new sanction or transfer is imposed by this notice."
 rw_cases.acknowledge:0 "The decision is noted."
 rw_case_admonished_opinion:0 "Disapproved of a broken promise"
 rw_case_apology_opinion:0 "Accepted a voluntary apology"
 rw_review_political_cases_interaction:0 "Review Known Political Cases"
 rw_review_political_cases_interaction_desc:0 "Read the separate case records associated with this provider that you already know as provider, client or mediator. Closed records are retained for five years while the provider lives. Reading makes no decision and reveals no unrelated cases."
 rw_cases.archive_title:0 "A Recorded Political Affair"
 rw_cases.archive_ruler:0 "This record concerns [rw_service_provider.GetTitledFirstName] and [rw_service_client.GetTitledFirstName]. The disclosed service-breach case is awaiting [rw_case_mediator.GetTitledFirstName]’s decision. Reading this record does not authorise a sanction or extend its deadline."
 rw_cases.archive_repair:0 "This record concerns [rw_service_provider.GetTitledFirstName] and [rw_service_client.GetTitledFirstName]. [rw_case_mediator.GetTitledFirstName] has proposed voluntary repair; the provider has not yet responded. Reading does not perform the service or force an apology."
