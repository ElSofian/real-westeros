l_english:
 rw_offer_favor_endorsement_interaction:0 "Offer Support for a Favor"
 rw_offer_favor_endorsement_interaction_desc:0 "Offer an immediate endorsement for a native favor, with a possible 25-gold counteroffer. The recipient must explicitly agree. This shares the existing yearly support-offer cooldown."
 rw_review_favor_endorsement_interaction:0 "Review Latest Favor-backed Support"
 rw_review_favor_endorsement_interaction_desc:0 "Target the original provider to read the latest offer you know as provider or client. Reading renews nothing and grants no favor, prestige or payment."
 rw_favor_service.title:0 "Support and Consideration"
 rw_favor_service.parties:0 "[rw_fv_provider.GetTitledFirstName] offers an immediate endorsement to [rw_fv_client.GetTitledFirstName]. Only the responder to the latest terms may agree. The original thirty-day window is not renewed by counteroffers; support offers share a one-year cooldown from initiation."
 rw_favor_service.favor_terms:0 "Consideration: the provider receives a native favor over the client; the client receives 50 prestige for the endorsement. No gold is exchanged under these terms. The favor’s use, duration and restrictions follow CK3/AGOT rules. An already detected hook is never replaced or renewed by this exchange."
 rw_favor_service.gold_terms:0 "Alternative consideration: the client pays the provider 25 gold and receives 50 prestige. This branch grants no new favor. The provider must accept the exact current counteroffer while the client can still pay."
 rw_favor_service.offered:0 "These terms remain open. The client can agree to the favor or counter with 25 gold. The provider can agree to the gold or ask again for a favor. Either may close the offer without payment or blame. Replies take one day; they do not renew the original window."
 rw_favor_service.favor_unavailable:0 "A detected existing hook or the native rules now block this favor. No hook is replaced or refreshed. A gold counteroffer or closing may remain available."
 rw_favor_service.unfunded:0 "The client cannot currently pay 25 gold. Gold terms cannot be accepted until the funds are available; closing or eligible favor terms remain separate choices."
 rw_favor_service.fulfilled:0 "The endorsement exchange has concluded under the recorded terms. It cannot be performed again from this offer. A recorded favor agreement does not guarantee that the native favor is still active or unused later."
 rw_favor_service.closed:0 "An original party closed this offer. No favor, gold, prestige, automatic penalty or new debt follows from closing."
 rw_favor_service.inactive:0 "This offer expired or the parties are no longer available. No service is performed automatically and no obligation is inherited. Closing the exact old offer does not affect a newer one."
 rw_favor_service.boundaries:0 "Accepting performs this immediate service; it is not a promise for later. Using the favor for another action remains subject to native rules and requires a separate choice. Reading, countering and silence grant nothing. This view retains only the provider’s latest offer, not a full service history."
 rw_favor_service.unavailable:0 "This offer or my identity as an original participant is no longer current. No exchange follows."
 rw_favor_service.accept_favor:0 "Agree: give the provider a native favor and receive the endorsement (+50 prestige)."
 rw_favor_service.counter_gold:0 "Counter: pay 25 gold instead of granting a favor; wait for the provider’s agreement."
 rw_favor_service.accept_gold:0 "Agree to the client’s 25-gold counteroffer and perform the endorsement."
 rw_favor_service.restate:0 "Ask again for a native favor instead of gold; wait for the client’s agreement."
 rw_favor_service.close:0 "Close this offer without performing the exchange."
 rw_favor_service.leave:0 "Leave without making another decision."
