l_english:
 rw_arm_house_forfeiture_interaction:0 "Order confiscations against this house"
 rw_arm_house_forfeiture_interaction_desc:0 "Activate the confiscation campaign under this house’s existing Crown decree. It ends with the original decree; each revocation retains its ordinary conditions, costs and possible resistance."
 rw_disarm_house_forfeiture_interaction:0 "Stop this house’s confiscation campaign"
 rw_disarm_house_forfeiture_interaction_desc:0 "Withdraw the standing order and my personal confiscation orders against this same house, without erasing the political decree, returning titles or cancelling native actions already sent."
 rw_read_house_forfeiture_interaction:0 "Read my Crown’s confiscation order"
 rw_read_house_forfeiture_interaction_desc:0 "Read the public order concerning this house in my current sovereign’s realm. This does not reveal the private evidence behind the decree."
 rw_institutional_forfeiture.title:0 "A Crown confiscation campaign"
 rw_institutional_forfeiture.identity:0 "This order concerns House [rw_hs_house.GetName] under [rw_hs_authority.GetName]."
 rw_institutional_forfeiture.armed:0 "Confiscations are ordered until the original political decree expires. The decree belongs to the Crown and can outlive its issuer. Eligible lieges in this realm may seek revocation of the house’s current titles, whether acquired by grant, inheritance, election or conquest. Each act remains a separate revocation that can be refused or resisted. This is not a guarantee that the house will hold no land."
 rw_institutional_forfeiture.inactive:0 "The campaign is withdrawn, expired or currently inapplicable under this authority. No previous confiscation is undone by that state."
 rw_institutional_forfeiture.boundaries:0 "This creates no crime or personal revocation reason against relatives. Wars, succession, elections, conquests, protected institutions and ordinary revocation rules remain authoritative. The corresponding standing and personal confiscation orders must end before a ducal return through our restitution paths."
 rw_institutional_forfeiture.unavailable:0 "The order or my current access to this authority has changed."
 rw_institutional_forfeiture.close:0 "Close"
