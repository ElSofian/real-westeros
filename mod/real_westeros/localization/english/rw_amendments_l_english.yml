l_english:
 rw_provider_price_amendment_interaction:0 "Amend or review the promised endorsement price"
 rw_client_price_amendment_interaction:0 "Request or review an endorsement price amendment"
 rw_amendments.interaction_desc:0 "Propose reducing a due deferred endorsement from 50 to 25 gold, or review the current request. Only the other party can accept; the original delivery deadline keeps running and no payment occurs now."
 rw_amendments.title:0 "Revising a promise together"
 rw_amendments.terms:0 "[rw_amend_proposer.GetTitledFirstName] proposes to [rw_amend_responder.GetTitledFirstName] that [rw_service_provider.GetTitledFirstName] receive 25 instead of 50 gold from [rw_service_client.GetTitledFirstName] if the promised endorsement is performed. The other party must explicitly accept within seven days and before the original delivery deadline. Until then the agreed price remains 50 and performance, breach or timeout can still occur. Accepting changes only price: no gold, prestige, extension, new service or pardon. The original delivery clause below remains unchanged. Refusal, withdrawal and silence add no penalty."
 rw_amendments.opportunity:0 "My deferred endorsement is now due. If its agreed price is 50 gold, I may ask the provider to reduce it to 25. They may refuse or ignore the request. Nothing is paid now and the original deadline continues."
 rw_amendments.propose:0 "Propose reducing the price from 50 to 25 gold."
 rw_amendments.accept:0 "Accept the price of 25 gold; keep the original deadline."
 rw_amendments.refuse:0 "Refuse this amendment; retain the agreed price."
 rw_amendments.withdraw:0 "Withdraw my amendment request."
 rw_amendments.leave:0 "Leave the situation unchanged."
 rw_amendments.accepted:0 "Both parties agreed to 25 gold on future performance. Nothing has been paid or performed by this amendment, and the original delivery deadline was not restarted. The provider may perform, wait or break the promise under the current terms."
 rw_amendments.unavailable:0 "The parties, request, terms or deadline have changed. No amendment, payment or deadline extension is applied."
