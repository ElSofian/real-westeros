l_english:
 rw_house_terms.title:0 "Terms for a house’s rehabilitation"
 rw_house_terms.offer:0 "Offer financial terms for this rehabilitation."
 rw_house_terms.review:0 "Review the financial terms of rehabilitation."
 rw_house_terms.conditions:0 "The current sovereign of [rw_house_authority.GetName] offers to close this political censure of [rw_house_target.GetName]. The personal contribution below is fixed for this thirty-day offer. Acceptance requires the same authorised parties and sufficient funds."
 rw_house_terms.unaffordable:0 "My current treasury is below the agreed contribution."
 rw_house_terms.accept:0 "Pay the agreed contribution and obtain this political rehabilitation."
 rw_house_terms.refuse:0 "Refuse these financial terms."
 rw_house_terms.pending:0 "The current house head may review, accept, refuse or leave unanswered the proposed personal contribution within thirty days."
 rw_house_terms.refused:0 "The petitioner refused the financial terms. No gold was taken and no penalty was added; this censure and its original expiry remain."
 rw_house_terms.invalidated:0 "The financial offer became void after a change of parties or eligibility. Nothing was paid. A recorded invalid offer cannot be revived; a new request follows the applicable cooldown and current roles."
 rw_house_terms.unanswered:0 "The financial offer expired unanswered. Nothing was paid, no penalty was added and the original censure term was not renewed."
 rw_house_terms.settled:0 "The petitioner paid the agreed contribution to the named sovereign. This political censure is closed."
