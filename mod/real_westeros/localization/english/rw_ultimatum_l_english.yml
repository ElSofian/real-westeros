l_english:
 rw_ut.title:0 "An ultimatum"
 rw_ut.demand_desc:0 "[rw_scheme_observer.GetTitledFirstName] demands that I publicly express regret for our broken trust within seven days, or face a possible arrest request. Doing so costs me 25 Prestige and closes this demand; it is neither a confession nor immunity from justice. I may refuse or remain silent."
 rw_ut.unavailable_desc:0 "This demand is no longer open to an answer."
 rw_ut.apologise:0 "Express my regret publicly."
 rw_ut.reject:0 "I reject this demand."
 rw_ut.silent:0 "Leave the demand unanswered."
 rw_ut.review_title:0 "The fate of my ultimatum"
 rw_ut.complied_desc:0 "[rw_ja_target.GetTitledFirstName] has publicly expressed regret. My ultimatum is closed. This settles neither guilt nor any other judicial matter."
 rw_ut.withdrawn_desc:0 "I have withdrawn this ultimatum. No arrest request was made through it."
 rw_ut.requested_desc:0 "I have attempted to request the arrest of [rw_ja_target.GetTitledFirstName]. This does not establish that an arrest took place; refusal and resistance remain possible."
 rw_ut.expired_desc:0 "The time allowed for following up this ultimatum has passed. It can no longer lead to an arrest request through this demand."
 rw_ut.rejected_desc:0 "[rw_ja_target.GetTitledFirstName] has rejected my ultimatum. I can withdraw it or attempt to request an arrest if I still have the authority and grounds. A refusal creates no new offense."
 rw_ut.timeout_desc:0 "No answer from [rw_ja_target.GetTitledFirstName] reached me within seven days. I may abandon the ultimatum or attempt to request an arrest if it remains possible. Silence is not a confession."
 rw_ut.waiting_desc:0 "I am allowing [rw_ja_target.GetTitledFirstName] seven days to answer my demand. I can still withdraw my ultimatum. Other judicial matters remain separate."
 rw_ut.escalate:0 "Attempt to request an arrest."
 rw_ut.withdraw:0 "Withdraw this ultimatum."
 rw_ut.leave:0 "Leave this matter for now."
 rw_ut.issue:0 "Demand public regret within seven days, or consider arrest."
 rw_ut.review:0 "Review my ultimatum."
 rw_ut.withdrawn_title:0 "An ultimatum withdrawn"
 rw_ut.withdrawn_notice:0 "[rw_scheme_observer.GetTitledFirstName] has withdrawn the ultimatum addressed to me. This does not settle any other judicial matter."
 rw_ut.apology_effect:0 "Publicly expressing regret costs me 25 Prestige and closes this demand. It is not a confession or immunity from justice."
 rw_ut.rejection_effect:0 "I reject this demand. The sender may withdraw it or attempt to request an arrest if still entitled to do so."
