l_english:
 rw_native_sentence.title:0 "Consider a prisoner’s sentence"
 rw_native_sentence.reasoned_desc:0 "I currently have a recognized reason to execute [rw_jp_target.GetTitledFirstName]. That reason does not by itself establish guilt in the observed plot. I may order the sentence under the rules and consequences that apply, or leave the matter alone."
 rw_native_sentence.arbitrary_desc:0 "I have no currently recognized reason to execute [rw_jp_target.GetTitledFirstName]. I may nevertheless attempt to order the sentence if my authority permits it, accepting the consequences of an arbitrary act. I can also refrain."
 rw_native_sentence.unavailable:0 "The person, custody, grounds or present circumstances no longer match this decision. I must reconsider the situation before attempting a sentence."
 rw_native_sentence.reasoned:0 "Attempt the sentence on the recognized grounds."
 rw_native_sentence.arbitrary:0 "Attempt the sentence without a recognized reason."
 rw_native_sentence.leave:0 "Leave this matter for now."
 rw_native_sentence.open:0 "Consider ordering a sentence."
 rw_native_sentence.receipt:0 "Read my recorded sentence attempt."
 rw_native_sentence.receipt_title:0 "A recorded sentence attempt"
 rw_native_sentence.receipt_intro:0 "An attempt to order a sentence against [rw_jp_target.GetTitledFirstName] is recorded in my account."
 rw_native_sentence.receipt_reasoned:0 "A recognized execution reason was present when I made this decision."
 rw_native_sentence.receipt_arbitrary:0 "No recognized execution reason was present when I made this decision."
 rw_native_sentence.receipt_limits:0 "This records the attempt and its grounds at that time. It does not establish that the sentence was carried out, that a later death resulted from it, or that the prisoner was guilty of this plot."
