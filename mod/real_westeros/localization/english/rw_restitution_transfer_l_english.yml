 rw_restitution_transfer.observed:0 "While this exact accepted promise was still open, a native title-gain callback reported the title passing directly from the captured holder to the beneficiary. This note records that context and its observation date. It does not identify a voluntary grant, prove the promise caused the acquisition, guarantee present ownership or confirm satisfaction. No payment, reward or sanction follows."
