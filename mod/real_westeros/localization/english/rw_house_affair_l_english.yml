l_english:
 rw_review_house_affairs_interaction:0 "Review affairs of my house and crown"
 rw_review_house_affairs_interaction_desc:0 "Read the political house affairs known to my character. The selected character receives no disclosure."
 rw_house_censured_opinion:0 "My house was disgraced"
 rw_house_restored_opinion:0 "A house restored to my favor"
 rw_house_affairs.consider:0 "Consider placing this house in political disfavor."
 rw_house_affairs.censure_title:0 "A house out of favor"
 rw_house_affairs.censure_terms:0 "I can place [rw_house_target.GetName] in political disfavor with [rw_house_authority.GetName] for fifty years, at a cost of 50 prestige. Its current head will resent me for five years if this resentment is not already present. This decision does not make relatives guilty, remove noble status or forbid landholding. A future sovereign may lift it; the house’s future head may petition for restoration. I am deciding the crown’s favor, not imposing a new criminal sentence."
 rw_house_affairs.censure:0 "Declare the house out of favor — 50 prestige."
 rw_house_affairs.record_title:0 "An affair of house and crown"
 rw_house_affairs.active:0 "[rw_house_target.GetName] remains in political disfavor with the authority of [rw_house_authority.GetName]. The original term is fifty years; later petitions do not renew it. A current head may ask the present sovereign for restoration. The crown may agree, refuse, leave the request unanswered or withdraw the censure. This standing grants no immunity and changes no native title rights."
 rw_house_affairs.restored:0 "The petition for [rw_house_target.GetName] was accepted. Its political standing with [rw_house_authority.GetName] is restored. Recognition is not a grant of ancestral lands, a criminal pardon or removal of another authority’s decree."
 rw_house_affairs.withdrawn:0 "The sovereign withdrew this political censure of [rw_house_target.GetName]. Other affairs, native penalties and title ownership remain separate."
 rw_house_affairs.expired:0 "The original political censure of [rw_house_target.GetName] has expired. This record does not establish a prior landholding ban or grant any title."
 rw_house_affairs.petition:0 "Petition for restoration of the house’s political standing."
 rw_house_affairs.answer:0 "Examine the current petition."
 rw_house_affairs.withdraw:0 "Withdraw this political censure."
 rw_house_affairs.petition_title:0 "A house asks for restoration"
 rw_house_affairs.petition_terms:0 "The current head of [rw_house_target.GetName] asks to end this political censure. Acceptance closes only this affair and grants +10 sovereign opinion of the petitioner for two years if that goodwill is absent; it neither stacks nor renews existing goodwill. Refusal or silence adds no sanction. This decision promises no land and grants no criminal immunity."
 rw_house_affairs.restore:0 "Restore this house to the crown’s favor."
 rw_house_affairs.refuse:0 "Refuse this petition."
 rw_house_affairs.leave_unchanged:0 "Leave the situation unchanged."
 rw_house_affairs.unavailable:0 "The record or my authority to make this choice has changed. No new decision is taken."
 rw_house_affairs.last_refused:0 "The latest petition was refused. It created no further penalty; the original term remains unchanged."
 rw_house_affairs.last_unanswered:0 "The latest petition received no decision within its thirty-day window. It created no further penalty; a new petition follows the house’s normal waiting period."
