l_english:
 rw_scheme_response.open:0 "Consider My Political Response"
 rw_scheme_response.read:0 "Read the Recorded Political Response"
 rw_scheme_response.owner_title:0 "An Exposed Participant: My Response"
 rw_scheme_response.owner_desc:0 "[rw_scheme_participant.GetTitledFirstName] was identified in a murder plot against me. I can leave this political matter aside or, if they are my direct vassal or courtier and neither of us is imprisoned, request a voluntary contribution of 25 gold. The request tells that person I know of their involvement. They may pay, refuse, contest or remain silent. Payment closes this request only: no criminal immunity is promised and existing legal consequences remain. My response window ends 30 days after the observation. In exchange, I grant +5 opinion for two years if that same benefit is not already active; later payments neither stack nor renew it."
 rw_scheme_response.forego:0 "Leave this political request aside, without payment or legal pardon."
 rw_scheme_response.request:0 "Privately request a voluntary contribution of 25 gold."
 rw_scheme_response.later:0 "Consider it later; keep the original deadline."
 rw_scheme_response.participant_title:0 "A Private Request for Amends"
 rw_scheme_response.participant_desc:0 "[rw_scheme_observer.GetTitledFirstName] refers to my exposed participation in a murder plot against them and requests 25 gold. Payment is voluntary and closes only this political request; it buys no criminal immunity, cancels no native sanction and is not an admission. I may refuse, contest or remain silent without a new automatic penalty. The deadline remains 30 days from the original observation, not from this request. The requestor grants +5 opinion for two years if this same benefit is not already active; an existing benefit is neither stacked nor renewed."
 rw_scheme_response.pay:0 "Agree: pay 25 gold to close this request, without admission or immunity."
 rw_scheme_response.refuse:0 "Refuse the contribution."
 rw_scheme_response.contest:0 "Contest the demand; preserve my denial alongside the recorded observation."
 rw_scheme_response.ignore:0 "Give no answer; silence is not consent or admission."
 rw_scheme_response.acknowledge:0 "Noted."
 rw_scheme_response.unavailable:0 "This response no longer meets its conditions. No new payment, punishment or consent follows."
 rw_scheme_response.history_title:0 "A Political Response, Recorded"
 rw_scheme_response.paid:0 "The exposed participant agreed to a contribution of 25 gold, transferred once to the targeted ruler. This closes the political request without an admission, criminal pardon or change to the discovery record. Existing legal consequences remain separate. The agreed goodwill is +5 opinion for two years when no identical benefit is already active; an existing benefit is neither stacked nor renewed."
 rw_scheme_response.foregone:0 "The targeted ruler chose not to pursue this political contribution. No payment, extra penalty or legal pardon was granted; the original observation remains recorded."
 rw_scheme_response.refused:0 "The exposed participant refused the contribution. No payment, debt, extra crime or automatic penalty followed. The native observation remains unchanged."
 rw_scheme_response.contested:0 "The exposed participant contested the demand. This denial is recorded alongside the original observation; it neither erases that observation nor establishes a new crime. No payment or additional penalty followed."
 rw_scheme_response.expired:0 "No agreement was completed before the original response deadline. Silence or expiry is not consent, refusal or an admission; it creates no debt or new penalty. Recorded facts remain unchanged."
 rw_scheme_response.offered:0 "A private request for a voluntary contribution of 25 gold awaits the participant’s reply within the original response window. Browsing does not decide, pay or extend the deadline."
 rw_scheme_response.open_state:0 "The targeted ruler has not yet chosen a political response. Browsing does not send a demand, infer agreement or extend the original deadline."
 rw_scheme_response.notice_title:0 "A Reply to My Political Request"
 rw_scheme_response.notice_desc:0 "An exposed participant has answered your private request. Consult your own journal to read the recorded reply. No new legal judgment has been made."
 rw_review_received_scheme_request_interaction:0 "Review Political Contributions Requested of Me"
 rw_review_received_scheme_request_interaction_desc:0 "Reopen still-valid requests this ruler explicitly sent you about your exposed participation. This gives no access to their private discovery journal or other participants’ records. Conditions and the original deadline are checked again."
 rw_scheme_response.withdraw:0 "Withdraw the unpaid request; take no gold."
 rw_scheme_response.withdraw_desc:0 "My request for a voluntary contribution of 25 gold remains unanswered. I can withdraw it before payment, even if my authority has changed. Withdrawal creates no payment, debt, admission or immunity and does not change the recorded discovery."
 rw_scheme_response.withdrawn:0 "The targeted ruler withdrew the request before any payment. No gold, debt, extra penalty or legal pardon followed; the original discovery remains recorded."
 rw_scheme_response.withdraw_notice_title:0 "A Political Request Withdrawn"
 rw_scheme_response.withdraw_notice_desc:0 "The private contribution requested of you has been withdrawn. No payment is due under this request; existing legal matters remain separate."
 rw_scheme_reparation_opinion:0 "Voluntary amends received"
