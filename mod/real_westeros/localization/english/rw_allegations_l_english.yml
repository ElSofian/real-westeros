l_english:
 rw_raise_affront_allegation_interaction:0 "Raise an Affront Allegation (Experimental)"
 rw_raise_affront_allegation_interaction_desc:0 "Allege that this ruler affronted your house. This asserts no proven offense and applies no penalty. They may acknowledge, contest or ignore it. You may then withdraw or disclose their response to a separate common overlord. Thirty-day case deadline; ninety-day initiation cooldown. Not engine-tested."
 rw_allegations.0001.t:0 "An Affront Alleged"
 rw_allegations.0001.desc:0 "[rw_service_client.GetTitledFirstName] alleges that I affronted their house. No independent evidence has established what occurred. I may acknowledge the allegation, contest it or leave it unanswered. My reply will be recorded as a statement, not a crime or a verdict. Our common overlord has not yet been informed."
 rw_allegations.admit:0 "Acknowledge the alleged remarks."
 rw_allegations.contest:0 "Contest this account."
 rw_allegations.ignore:0 "Leave it unanswered; silence proves nothing."
 rw_allegations.0002.t:0 "A Reply to the Allegation"
 rw_allegations.reply_admitted:0 "[rw_service_provider.GetTitledFirstName] acknowledged the alleged remarks. This establishes that an acknowledgment was made, not a native crime or an independent verdict. The claimant may withdraw or disclose this statement to [rw_case_mediator.GetTitledFirstName]."
 rw_allegations.reply_contested:0 "[rw_service_provider.GetTitledFirstName] contested the account. The underlying allegation remains unverified; denial does not establish that it was false either. The claimant may withdraw or disclose this disputed account to [rw_case_mediator.GetTitledFirstName]."
 rw_allegations.refer:0 "Disclose this statement and ask our common overlord to mediate."
 rw_allegations.withdraw:0 "Withdraw the matter without a penalty."
 rw_allegations.ruler_admitted_desc:0 "[rw_service_client.GetTitledFirstName] alleges an affront by [rw_service_provider.GetTitledFirstName], who acknowledged the remarks. That statement is recorded, but no native crime or independent verdict is established. I may decline intervention, express personal disapproval or invite voluntary reconciliation."
 rw_allegations.ruler_contested_desc:0 "[rw_service_client.GetTitledFirstName] alleges an affront by [rw_service_provider.GetTitledFirstName], who contests the account. There is no independent corroboration. I may decline intervention or invite a voluntary conciliatory gesture; this disputed allegation alone does not authorise the reprimand option."
 rw_allegations.repair_desc:0 "[rw_case_mediator.GetTitledFirstName] proposes a voluntary conciliatory gesture towards [rw_service_client.GetTitledFirstName]. It costs 25 prestige and improves both their opinions by 5 for two years. Accepting does not admit the allegation, erase a statement, establish a crime or settle a service payment. I may refuse without an automatic additional penalty."
 rw_allegations.archive_respondent:0 "This is an unverified allegation by [rw_service_client.GetTitledFirstName] against [rw_service_provider.GetTitledFirstName]. It awaits a response. Silence is not corroboration, and the planned mediator has not been informed."
 rw_allegations.archive_claimant:0 "This allegation has received a recorded response. The claimant is deciding whether to withdraw or disclose it; the planned mediator has not yet been informed. No native crime or penalty follows from this stage."
 rw_allegations.result_withdrawn:0 "The claimant withdrew this matter without a penalty. The record preserves what was alleged and how it was answered; withdrawal is neither an admission nor proof of innocence."
 rw_allegations.read_statement:0 "Read the recorded allegation and reply."
 rw_allegations.statement_title:0 "The Recorded Statements"
 rw_allegations.statement_admitted:0 "[rw_service_client.GetTitledFirstName] alleged an affront against [rw_service_provider.GetTitledFirstName], who acknowledged the remarks. This records the acknowledgment, not independent proof or a native crime. The statement is retained even if the dispute is later withdrawn or reconciled."
 rw_allegations.statement_contested:0 "[rw_service_client.GetTitledFirstName] alleged an affront against [rw_service_provider.GetTitledFirstName], who contested the account. The allegation remains disputed, not proven true or false. Withdrawal or a conciliatory gesture does not change this recorded reply."
 rw_allegations.statement_unanswered:0 "[rw_service_client.GetTitledFirstName] alleged an affront against [rw_service_provider.GetTitledFirstName]. No reply was recorded. Silence does not establish the allegation, even after its deadline passes."
 rw_allegations.statement_unavailable:0 "This record is no longer accessible. No conclusion about the allegation can be drawn from its absence."
