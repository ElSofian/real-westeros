l_english:
 rw_uw_defy_option:0 "Defy my liege’s prohibition"
 rw_uw_defy_warning:0 "I choose to disregard my liege’s ban on this war. I cannot also invoke a hook for permission. All other conditions of the declaration still apply."
 rw_uw.royal_title:0 "A vassal challenges my peace"
 rw_uw.royal_desc:0 "[scope:rw_uw_attacker.GetTitledFirstName] declared a claim war against [scope:rw_uw_defender.GetTitledFirstName] while explicitly choosing to defy my prohibition. Both remain my direct vassals. I can overlook this challenge, voice my disapproval, or demand an end to hostilities. This report is not a finding of a native crime."
 rw_uw.ignore:0 "I have other matters to attend to."
 rw_uw.censure:0 "Make my disapproval known."
 rw_uw.demand:0 "Demand an end to these hostilities."
 rw_uw.censure_effect:0 "My opinion of the attacker falls by 10 for two years. No title, crime or war outcome changes."
 rw_uw.demand_effect:0 "The attacker receives my demand and can acknowledge it or openly refuse. This does not force peace."
 rw_uw.demand_title:0 "My liege demands an end to the war"
 rw_uw.demand_desc:0 "[scope:rw_uw_issuer.GetTitledFirstName] demands that I end my claim war against [scope:rw_uw_defender.GetTitledFirstName]. The decision on how to conduct or settle the war remains mine, subject to the normal rules of war."
 rw_uw.acknowledge:0 "I have received the demand."
 rw_uw.refuse:0 "I reject this interference."
 rw_uw.acknowledge_effect:0 "Acknowledge receipt only. I do not promise peace, concede the war or admit a crime."
 rw_uw.refuse_effect:0 "My liege’s opinion of me falls by 15 for two years. This adds no crime or automatic punishment."
 rw_uw.censure_title:0 "My liege condemns my defiance"
 rw_uw.censure_notice:0 "[scope:rw_uw_issuer.GetTitledFirstName] expressly disapproves of my decision to challenge the prohibition. The war continues under its normal rules."
 rw_uw.answer_title:0 "A reply to my demand"
 rw_uw.acknowledged_notice:0 "[scope:rw_uw_attacker.GetTitledFirstName] acknowledges receiving my demand. This is not a promise to end the war."
 rw_uw.refused_notice:0 "[scope:rw_uw_attacker.GetTitledFirstName] openly refuses my demand. No punishment is imposed automatically."
 rw_uw.close:0 "Close"
 rw_uw_censured_opinion:0 "Defied my peace"
 rw_uw_refused_stop_opinion:0 "Refused my demand to stop hostilities"
 rw_uw.native_intervene:0 "Seek a negotiated end to this war."
 rw_uw.native_intervene_effect:0 "If the native conditions still allow it, I will request negotiations to stop this war. My vassal may refuse or ask for a concession. This does not guarantee peace."
 rw_uw.native_blocked_title:0 "The intervention could not be requested"
 rw_uw.native_blocked_notice:0 "The conditions for intervening in this particular war are no longer met. No negotiation, payment or peace has been imposed by this request."
 rw_dl.permission_required:0 "The record associated with this declaration reports that permission was required. It does not prove an offence or the use of a hook."
 rw_dl.native_exception:0 "The record associated with this declaration reports a recognized exception to the prohibition. It does not identify an offence."
 rw_dl.no_ban:0 "No applicable prohibition by the liege was recorded for this declaration. Other restrictions on war may still apply."
 rw_dl.inconsistent:0 "The recorded information is contradictory. It cannot establish whether the declaration was unlawful."
