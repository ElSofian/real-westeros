l_english:
 rw_multi_actions.title:0 "A shared agreement"
 rw_multi_actions.terms:0 "[rw_ba_payer.GetTitledFirstName] promises gold and public support to [rw_ba_payee.GetTitledFirstName], who promises to release the charter concerning [rw_ba_title.GetNameNoTier]. All three clauses are agreed together, but each act remains voluntary and is recorded separately."
 rw_multi_actions.price25:0 "The promised sum is 25 gold. Public support grants its recipient 50 Prestige."
 rw_multi_actions.price50:0 "The promised sum is 50 gold. Public support grants its recipient 50 Prestige."
 rw_multi_actions.negotiating:0 "This proposal lasts seven days. Acceptance commits both parties to this exact agreement; it does not perform any of its actions."
 rw_multi_actions.declined:0 "This proposal is closed. No agreement was signed."
 rw_multi_actions.active:0 "The parties have thirty days from acceptance to carry out their own clauses, in either order. A broken promise does not create a legal offense."
 rw_multi_actions.overdue:0 "The time for performance has passed. Already completed acts remain; unperformed clauses can no longer be carried out through this agreement."
 rw_multi_actions.fulfilled:0 "All three actions have been recorded as completed."
 rw_multi_actions.partial:0 "This agreement ended without all three actions being completed. Completed acts are preserved; there is no automatic refund or punishment."
 rw_multi_actions.gold_label:0 "Gold:"
 rw_multi_actions.support_label:0 "Public support:"
 rw_multi_actions.release_label:0 "Charter release:"
 rw_multi_actions.done:0 "Completed."
 rw_multi_actions.attempted:0 "Attempt recorded; result not confirmed."
 rw_multi_actions.pending:0 "Still pending."
 rw_multi_actions.refused:0 "Explicitly refused by the responsible party."
 rw_multi_actions.expired:0 "Deadline passed without performance."
 rw_multi_actions.unavailable:0 "No longer possible in this agreement; no personal fault is inferred."
 rw_multi_actions.propose:0 "Offer gold and public support in exchange for charter release."
 rw_multi_actions.accept:0 "Accept all three clauses."
 rw_multi_actions.counter:0 "Counter with the other sum."
 rw_multi_actions.decline:0 "Close this proposal without an agreement."
 rw_multi_actions.pay:0 "Pay the promised gold."
 rw_multi_actions.support:0 "Give the promised public support."
 rw_multi_actions.release:0 "Release the exact agreed charter."
 rw_multi_actions.refuse_gold:0 "Refuse my promised payment."
 rw_multi_actions.refuse_support:0 "Refuse my promised public support."
 rw_multi_actions.refuse_release:0 "Refuse the promised charter release."
 rw_multi_actions.leave:0 "Leave this agreement for now."
