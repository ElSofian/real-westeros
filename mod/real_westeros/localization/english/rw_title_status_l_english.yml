l_english:
 rw_title_status.open:0 "Examine this prisoner’s titles and standing."
 rw_title_status.title:0 "Titles and standing of my prisoner"
 rw_title_status.intro:0 "I can consider this prisoner’s titles and personal standing separately from their life or freedom. Their present situation does not establish which offense, if any, has already been punished.\n\n"
 rw_title_status.reason:0 "I currently have recognized grounds for title revocation against this person. They may concern another act and do not guarantee that a particular title can be taken without consequences.\n\n"
 rw_title_status.no_reason:0 "I currently have no recognized grounds for title revocation against this person. Grounds for arrest or execution do not automatically supply them.\n\n"
 rw_title_status.unknown_reason:0 "Current grounds for title revocation could not be established.\n\n"
 rw_title_status.knight:0 "This person is currently recognized as a knight.\n\n"
 rw_title_status.not_knight:0 "This person is not currently recognized as a knight.\n\n"
 rw_title_status.stripped_knight:0 "This person currently bears the standing of a stripped knight. This does not establish that it arose from this plot.\n\n"
 rw_title_status.landed_knight:0 "This person currently holds a landed-knight contract. That standing is not a prohibition on holding land.\n\n"
 rw_title_status.no_landed_knight_contract:0 "No current landed-knight contract is established for this person. That alone does not determine their nobility or family’s standing.\n\n"
 rw_title_status.terms:0 "A title may be revoked through the normal title-selection process, subject to its laws, contracts and consequences. The usual release terms may offer personal status penalties when permitted. I must examine and confirm the exact terms; nothing here condemns this person’s relatives or bars their house from holding land."
 rw_title_status.review_revocation:0 "Review title revocation terms (does not send)."
 rw_title_status.review_release:0 "Review possible release conditions (does not send)."
 rw_title_status.unavailable:0 "The private record is no longer accessible or custody conditions have changed. No decision is taken."
 rw_title_status.close:0 "Leave the situation unchanged."
