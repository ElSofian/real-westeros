l_english:
 rw_offer_military_restraint_interaction:0 "Offer a personal pledge of military restraint"
 rw_offer_military_restraint_interaction_desc:0 "Offer not to become primary attacker against this person for ninety days after their explicit acceptance. This creates no native truce or restriction on war declarations. They have seven days to answer."
 rw_review_military_restraint_interaction:0 "Review personal military-restraint pledges"
 rw_review_military_restraint_interaction_desc:0 "Read this promisor’s retained pledges that I personally know. Reading creates no agreement or extension; only original parties may act on an exact current record."
 rw_military_restraint.title:0 "A personal pledge of military restraint"
 rw_military_restraint.parties:0 "Promisor: [scope:rw_mr_provider.GetShortUIName]. Beneficiary: [scope:rw_mr_beneficiary.GetShortUIName]. The proposed undertaking is not to become primary attacker against this beneficiary for ninety days after acceptance."
 rw_military_restraint.offered:0 "The original beneficiary has seven days from proposal to accept. Nothing is promised by silence and no truce, payment or opinion change is imposed. Either original party may close the offer."
 rw_military_restraint.active:0 "The beneficiary explicitly accepted; the original ninety-day period is still open. The promisor may renounce and the beneficiary may release the pledge. Neither decision changes native rights, CBs or wars; reading never renews the period."
 rw_military_restraint.observed:0 "A native war-start callback recorded the original promisor as primary attacker and the original beneficiary as primary defender while the accepted pledge was active. This is a role observation, not proof of voluntary initiation, legal wrongdoing or a deliberate betrayal. The pledge is closed; no sanction or forced peace follows."
 rw_military_restraint.renounced:0 "The original promisor explicitly renounced this accepted pledge. No native war, CB, truce, relationship or legal state was changed and no duty passes to an heir."
 rw_military_restraint.released:0 "The original beneficiary explicitly released this accepted pledge. No payment, pardon, native truce or change to another dispute follows."
 rw_military_restraint.closed:0 "An original party closed this unaccepted offer. There was no accepted undertaking or penalty."
 rw_military_restraint.elapsed:0 "The proposal or pledge period has elapsed. Missing observations do not certify fulfillment, peace, guilt or deliberate breach. No past war is reconstructed or sanction imposed."
 rw_military_restraint.boundaries:0 "This is a personal political undertaking, not a royal war ban or native truce. Actual declarations, CBs, restrictions and AGOT Mega Wars remain native. Only an exact fresh primary-attacker/primary-defender war-start context is recorded; defensive wars, secondary participation, missing context and older wars are not inferred. No automatic penalty or guarantee of complete observation is created."
 rw_military_restraint.unavailable:0 "This exact retained pledge is unavailable to this viewer. Missing identity, dead owners and successor data grant no authority."
 rw_military_restraint.accept:0 "Accept the exact ninety-day personal pledge, without a native truce or payment."
 rw_military_restraint.close:0 "Close this unaccepted offer freely."
 rw_military_restraint.renounce:0 "Explicitly renounce my personal pledge."
 rw_military_restraint.release:0 "Release the original promisor from this personal pledge."
 rw_military_restraint.leave:0 "Leave this record unchanged."
