l_english:
 rw_allegation_settlement.title:0 "A private settlement of the allegation"
 rw_allegation_settlement.introduction:0 "I may offer to withdraw this exact house-affront allegation for 50 gold paid by the respondent. They may refuse or counter 25 gold. Neither proposing nor paying establishes the truth of the allegation. I can still withdraw freely or refer the matter before an agreement is completed."
 rw_allegation_settlement.parties:0 "Respondent and payer: [scope:rw_service_provider.GetShortUIName]. Claimant and recipient: [scope:rw_service_client.GetShortUIName]. These terms concern withdrawal of this exact allegation only."
 rw_allegation_settlement.price50:0 "Current proposal: 50 gold from respondent to claimant, in exchange for immediate withdrawal of this allegation."
 rw_allegation_settlement.price25:0 "Current proposal: 25 gold from respondent to claimant, in exchange for immediate withdrawal of this allegation."
 rw_allegation_settlement.offered:0 "Only the other party may accept the latest terms or counter. The original seven-day offer window and original case deadline both still apply; negotiation never renews either. Before payment the claimant remains free to refer or withdraw without payment."
 rw_allegation_settlement.paid:0 "Both parties agreed to the recorded terms; the allegation was withdrawn and the agreed gold paid once. The preserved statements remain unchanged. Payment proves neither an underlying offense nor a fabricated accusation, and grants no immunity from native justice or another matter."
 rw_allegation_settlement.closed:0 "One party ended these settlement talks. No payment, withdrawal or new grievance follows from that refusal. The allegation follows its own existing stage and deadline."
 rw_allegation_settlement.inactive:0 "These talks can no longer settle: the original offer or case deadline, stage, disclosure, jurisdiction or participants no longer permit it. This is not an agreement, payment, withdrawal or admission."
 rw_allegation_settlement.unfunded:0 "The original respondent currently lacks the agreed gold. Nothing is taken and the allegation is not withdrawn. They may counter or refuse; waiting does not extend either deadline."
 rw_allegation_settlement.boundaries:0 "This private agreement changes only this allegation’s pending status and the agreed gold. It creates no admission, pardon, native secret, hook, legal penalty or obligation for an heir. Other facts and disputes remain. The planned mediator does not learn these financial terms."
 rw_allegation_settlement.unavailable:0 "No current private settlement terms are available for this exact allegation and viewer. Missing or old terms do not create consent."
 rw_allegation_settlement.propose:0 "Offer withdrawal of this allegation for 50 gold from the respondent."
 rw_allegation_settlement.accept:0 "Accept these exact terms: respondent pays the agreed gold; withdraw this allegation now."
 rw_allegation_settlement.counter25:0 "Counter with 25 gold for withdrawal; do not pay or withdraw yet."
 rw_allegation_settlement.counter50:0 "Maintain 50 gold for withdrawal; ask the respondent to agree again."
 rw_allegation_settlement.close:0 "End settlement talks without payment or withdrawal."
 rw_allegation_settlement.leave:0 "Leave these terms unchanged for now."
 rw_allegation_settlement.review:0 "Review private settlement terms for this allegation."
