l_english:
 rw_case_compensation.title:0 "A Voluntary Financial Gesture"
 rw_case_compensation.review:0 "Discuss or review voluntary compensation for this affair."
 rw_case_compensation.introduction:0 "This service dispute is closed. [rw_service_provider.GetTitledFirstName] may voluntarily compensate [rw_service_client.GetTitledFirstName]. Either original party can propose 25 or 50 gold. The responder must explicitly agree to the latest amount, with the provider still able to pay. Opening this discussion moves no money. It creates no debt, admission, forgiveness, immunity or new judgment; the original case and personal apology response remain unchanged."
 rw_case_compensation.parties:0 "This compensation concerns only the recorded closed dispute between [rw_service_provider.GetTitledFirstName] and [rw_service_client.GetTitledFirstName]. The provider always pays the client, whichever party proposed the amount. These financial discussions are private to the two original parties."
 rw_case_compensation.price_25:0 "Compensation amount under discussion or recorded as paid: 25 gold."
 rw_case_compensation.price_50:0 "Compensation amount under discussion or recorded as paid: 50 gold."
 rw_case_compensation.offered:0 "Only the responder may accept the current amount or counter with the other amount. Either original party may close the offer. The original seven-day response window is never renewed by a counteroffer or review. Funds are not reserved; payment requires available provider funds and both parties alive, adult, free and at peace with each other when accepted."
 rw_case_compensation.paid:0 "The agreed compensation has been paid for this exact affair. It cannot be paid again from this offer. The payment does not deliver the original service, reverse the breach or judgment, erase resentment, accept an apology, certify forgiveness or grant immunity."
 rw_case_compensation.closed:0 "An original party closed this offer without payment. No automatic penalty or new debt follows."
 rw_case_compensation.inactive:0 "This offer has expired or the parties can no longer accept it under present conditions. No money moves automatically and silence creates no debt or blame. Closing it adds no penalty."
 rw_case_compensation.boundaries:0 "A new offer cannot replace this affair’s original negotiation window. Other retained service affairs can have separate offers. Neither reading nor countering pays anything, extends case retention or changes native justice, bank debts, titles, wars or inheritance. The mediator does not receive these financial terms."
 rw_case_compensation.unavailable:0 "This retained closed service case, these current terms or my identity as one of the original two parties is no longer valid. No payment or decision follows."
 rw_case_compensation.propose_25:0 "Propose voluntary compensation of 25 gold from the provider to the client."
 rw_case_compensation.propose_50:0 "Propose voluntary compensation of 50 gold from the provider to the client."
 rw_case_compensation.accept:0 "Agree to this exact amount and pay it now from provider to client."
 rw_case_compensation.counter:0 "Counter with the other amount: 25 instead of 50, or 50 instead of 25 gold."
 rw_case_compensation.close:0 "Close this offer without payment or penalty."
 rw_case_compensation.unfunded:0 "The provider cannot currently pay this amount. It cannot be accepted now; a lower counteroffer or closing remains possible while the other conditions permit."
