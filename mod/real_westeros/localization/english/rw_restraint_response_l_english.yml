l_english:
 rw_restraint_resented_opinion:0 "Resented a war during a restraint pledge"
 rw_restraint_response.not_requested:0 "The beneficiary has not requested an explanation. The observed primary roles do not themselves establish a voluntary breach."
 rw_restraint_response.unanswered:0 "The beneficiary requested an explanation; no reply is recorded. Silence is not an acknowledgment of deliberate breach or guilt."
 rw_restraint_response.acknowledged:0 "The original promisor explicitly stated that they accept responsibility for breaking the undertaking. This is their statement, not an independent finding of intent or a native legal verdict."
 rw_restraint_response.contested:0 "The original promisor explicitly contested that the observed war roles amount to a voluntary breach of their undertaking. This statement neither erases the role observation nor proves innocence."
 rw_restraint_response.pending:0 "For thirty days from this fresh role observation, the original beneficiary may once ask for an explanation and choose a personal reaction, with or without a reply. Neither a request nor an answer renews this window. No opinion penalty is automatic."
 rw_restraint_response.expired:0 "The original response period has elapsed without a recorded personal reaction. Silence creates neither resentment, consent, pardon nor an admission. Review cannot reopen it."
 rw_restraint_response.resented:0 "The beneficiary explicitly chose resentment: −15 personal opinion for two years only if this grievance was absent for the pair. An existing grievance is neither stacked nor refreshed. The role fact and any statement remain separate; no crime or war effect follows."
 rw_restraint_response.noted:0 "The beneficiary took note without adding a grievance. Other opinions, disputes and legal facts remain unchanged. The observation and any reply are preserved; this is not a native pardon."
 rw_restraint_response.request:0 "Ask the original promisor to explain, without assuming intent or extending the deadline."
 rw_restraint_response.acknowledge:0 "State that I accept responsibility for breaking my undertaking."
 rw_restraint_response.contest:0 "Contest that these war roles mean I voluntarily broke my undertaking."
 rw_restraint_response.resent:0 "Resent this personally: −15 opinion for two years only if this grievance is absent."
 rw_restraint_response.note:0 "Take note without adding a grievance or erasing other disputes."
