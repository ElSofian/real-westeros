l_english:
 rw_review_restitution_requests_interaction:0 "Review my land-restitution discussions"
 rw_review_restitution_requests_interaction_desc:0 "Read only the requests in which I am the captured requester or holder. The selected character receives nothing."
 rw_restitution_refused_opinion:0 "Refused to discuss returning land"
 rw_restitution.consider:0 "Consider asking the present holder about restitution."
 rw_restitution.title:0 "A request concerning former lands"
 rw_restitution.request_terms:0 "[rw_lr_title.GetName] is currently held by [rw_rs_holder.GetShortUIName]. I can ask this person to discuss returning it to me, using this exact filed land-history entry. While the original former holder lives, only that person can use this request; after their death, the current head of the recorded house may ask. The request is free, remains open for thirty days, and permits no repeated request to the same holder for this title for one year. It creates no right to take the land."
 rw_restitution.send:0 "Send a request to discuss this exact title."
 rw_restitution.identity:0 "[rw_rs_requester.GetShortUIName] asked [rw_rs_holder.GetShortUIName] to discuss [rw_rs_title.GetName], referring to a filed land-history entry of [rw_rs_authority.GetName]."
 rw_restitution.pending:0 "The original thirty-day request is still open. The captured holder may agree to examine it, refuse or remain silent. Agreeing to examination is not a promise to grant land."
 rw_restitution.talks:0 "The holder agreed to examine the request. The original deadline still applies. A native title grant remains a separate decision, with its own eligibility and consequences."
 rw_restitution.refused:0 "The holder declined or closed the discussion. There is no automatic punishment. For seven days the requester may personally acknowledge the answer or resent this refusal; that response grants no legal right."
 rw_restitution.withdrawn:0 "The requester withdrew. No title, payment or punishment follows."
 rw_restitution.invalidated:0 "Observed changes made the captured request inapplicable. A successor cannot answer for a previous holder or inherit the requester’s consent."
 rw_restitution.unavailable_terms:0 "The original window has expired or the current parties, ownership or source entry no longer permit this discussion. Historical records create no present right to act."
 rw_restitution.now_held:0 "The requester now holds this title. This present-state observation does not prove the discussion caused that acquisition."
 rw_restitution.boundaries:0 "Examining native grant terms sends nothing and preselects no title. The holder must choose the intended title and confirm separately. Silence costs nothing; refusal creates no crime, inherited guilt, house sanction or automatic restitution."
 rw_restitution.accept_review:0 "Agree to examine this request, without promising land."
 rw_restitution.refuse:0 "Decline or close this discussion."
 rw_restitution.withdraw:0 "Withdraw my request without penalty."
 rw_restitution.open_grant:0 "Examine native title-grant terms for the requester."
 rw_restitution.resent:0 "Resent the refusing holder — my opinion −10 for two years if absent, without stacking or renewal."
 rw_restitution.accept_refusal:0 "Acknowledge the answer without a new penalty."
 rw_restitution.leave:0 "Leave the situation unchanged."
 rw_restitution.unavailable:0 "This private request or my identity as one of its original parties is no longer valid. Nothing is transferred."
 rw_restitution.resented_history:0 "The requester chose to resent this answer. That personal response is historical; it does not establish a crime or renew an earlier opinion modifier."
 rw_restitution.acknowledged_history:0 "The requester acknowledged the answer without adding a penalty."
