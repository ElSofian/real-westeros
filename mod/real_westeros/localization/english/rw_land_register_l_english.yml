l_english:
 rw_review_land_register_interaction:0 "Consult the crown land registers"
 rw_review_land_register_interaction_desc:0 "Read filed title-transfer facts concerning my crown, land, former house or personal role. The selected character receives nothing."
 rw_land_registry.consider:0 "Consider filing these land facts with the crown."
 rw_land_registry.deposit_title:0 "A place in the land register"
 rw_land_registry.deposit_terms:0 "I can deposit the observed transfer of [rw_tp_title.GetName], from [rw_tp_former_holder.GetShortUIName] to [rw_tp_new_holder.GetShortUIName], in the register of [rw_lr_authority.GetName]. The record will retain the title, parties, dates and the former holder’s house as observed, [rw_lr_house.GetName], for one hundred years after filing. Future holders of this crown or land, the original parties and members of that exact house may consult those facts. My private observations, plots and intended reasons are not included. Filing costs nothing and grants no title or legal right."
 rw_land_registry.deposit:0 "Deposit only these title-transfer facts."
 rw_land_registry.leave:0 "Leave this observation in my personal journal."
 rw_land_registry.record_title:0 "The crown land register"
 rw_land_registry.facts:0 "Entry [SCOPE.GetValue('rw_lr_serial')|0] of [rw_lr_authority.GetName] records that [rw_lr_title.GetName] passed from [rw_lr_former_holder.GetShortUIName] to [rw_lr_new_holder.GetShortUIName]. The former holder’s recorded house was [rw_lr_house.GetName]. This entry preserves the observation and filing dates, not an inherited judgment against that house."
 rw_land_registry.still_held:0 "The recorded recipient still holds this title. Any later restitution requires a separate current decision and native eligibility."
 rw_land_registry.changed_holder:0 "The title has changed hands again or currently has no holder. This historical entry gives no right to take it from a later holder."
 rw_land_registry.limits:0 "This archive creates no claim, pardon, noble status, collective land ban or automatic restitution. Custody of the register gives no additional power or access to a private case. Its original one-hundred-year retention is not renewed when read or passed to another custodian."
 rw_land_registry.unavailable:0 "The observation, authority or my right to consult this entry has changed. No land or penalty is changed."
 rw_land_registry.close:0 "Close this historical entry."
