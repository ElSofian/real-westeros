l_english:
 rw_relay_rumor_interaction:0 "Pass on an unverified account"
 rw_relay_rumor_interaction_desc:0 "Choose one account I know and consider telling it to this person. The first named speaker and each account’s provenance remain distinct from proof."
 rw_review_my_rumors_interaction:0 "Review the accounts I have heard"
 rw_review_my_rumors_interaction_desc:0 "Read only accounts personally entrusted to me. Reading does not affirm their truth or reveal the source’s private dossier."
 rw_rumor.title:0 "A story passed from mouth to mouth"
 rw_rumor.claim:0 "This account relates that [rw_ru_speaker.GetTitledFirstName] had accused [rw_ru_subject.GetTitledFirstName] of affronting their house. It is a report of an allegation, not an established offense."
 rw_rumor.own_account:0 "This is my own account, which I may choose to tell. Preparing it alone does not transmit it."
 rw_rumor.heard_account:0 "[rw_ru_sender.GetTitledFirstName] told me this account. Its first named speaker remains [rw_ru_speaker.GetTitledFirstName]; it has passed through [SCOPE.GetValue('rw_ru_hops')|0] relays."
 rw_rumor.caution:0 "Repetition does not confirm the story. Neither the respondent’s answer nor any private settlement, legal judgment or family guilt follows from hearing it."
 rw_rumor.send_title:0 "Should I pass on this account?"
 rw_rumor.send_terms:0 "I may tell [rw_ru_receiver.GetTitledFirstName] this same account, naming its initial speaker and my role as the latest relay. I will not disclose the private dossier or change its evidence."
 rw_rumor.unavailable:0 "This personal account is no longer accessible or cannot be passed on in these circumstances. Nothing about its truth follows from that."
 rw_rumor.prepare:0 "Prepare my account to tell someone"
 rw_rumor.send:0 "Tell this person the account, with its source"
 rw_rumor.keep:0 "Keep it to myself for now"
 rw_rumor.acknowledge:0 "Note what I have heard"
 rw_rumor.send_effect:0 "I will attempt to tell this account with its original source. I may relay another account after thirty days. Telling it creates no proof of its truth."
