l_english:
 rw_xw.title:0 "A war across authorities"
 rw_xw.declaring_desc:0 "[rw_xw_attacker.GetTitledFirstName] has declared war against [rw_xw_defender.GetTitledFirstName] despite my ban on all wars. This attack reaches another branch. I can let it pass, express disapproval or ask for the conflict to end."
 rw_xw.target_desc:0 "The war of [rw_xw_attacker.GetTitledFirstName] against [rw_xw_defender.GetTitledFirstName] targets a title held by [rw_xw_holder.GetTitledFirstName], my direct vassal. I can object to this attack."
 rw_xw.ignore:0 "I shall let it pass for now."
 rw_xw.disapprove:0 "I disapprove of this attack."
 rw_xw.disapprove_effect:0 "My opinion of the attacker falls by 10 for two years. The war continues."
 rw_xw.notice_title:0 "An attack disapproved"
 rw_xw.notice_desc:0 "[rw_xw_ruler.GetTitledFirstName] disapproves of my attack."
 rw_xw.close:0 "The situation has changed."
 rw_xw.demand:0 "I ask them to end this war."
 rw_xw.demand_effect:0 "The attacker receives my political request and has seven days to answer. The authority may then reconsider once while this war and its original decision window remain valid."
 rw_xw.demand_title:0 "A request concerning my war"
 rw_xw.liege_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], my direct liege, asks me to end my war against [rw_xw_defender.GetTitledFirstName]. I can acknowledge the request or state my refusal."
 rw_xw.protector_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], the liege of a title holder targeted by my war against [rw_xw_defender.GetTitledFirstName], asks me to end this attack. I can acknowledge the request or state my refusal."
 rw_xw.acknowledge:0 "I have received your request."
 rw_xw.acknowledge_effect:0 "I acknowledge receipt. The war continues and my answer creates no peace commitment. The authority may then reconsider once while this war and its original decision window remain valid."
 rw_xw.refuse:0 "I shall continue this war."
 rw_xw.refuse_liege_effect:0 "My liege loses 15 opinion of me for two years."
 rw_xw.refuse_protector_effect:0 "The sender loses 10 opinion of me for two years."
 rw_xw.answer_title:0 "An answer to my request"
 rw_xw.acknowledged_notice:0 "[rw_xw_attacker.GetTitledFirstName] has acknowledged my request. The question of peace remains open."
 rw_xw.refused_notice:0 "[rw_xw_attacker.GetTitledFirstName] refuses my request and intends to continue this war."
 rw_xw.native_intervene:0 "I shall negotiate an end to this war."
 rw_xw.native_intervene_effect:0 "Tomorrow, the native intervention conditions will be checked for this exact war. CK3/AGOT handles the negotiation, any consideration and its outcome."
 rw_xw.native_blocked_title:0 "Intervention became unavailable"
 rw_xw.native_blocked_desc:0 "This war's context or its native conditions have changed. My intervention attempt ends here."
 rw_xm.request:0 "I shall approach their liege."
 rw_xm.request_effect:0 "The declarer's original liege receives my request and has seven days to choose a response."
 rw_xm.title:0 "A request for mediation"
 rw_xm.desc:0 "[rw_xm_protector.GetTitledFirstName] asks me to intervene with my vassal [rw_xw_attacker.GetTitledFirstName] over their war against [rw_xw_defender.GetTitledFirstName]. I can agree to attempt native negotiation or decline the request."
 rw_xm.accept:0 "I shall try to obtain an end to this war."
 rw_xm.accept_effect:0 "I consent to prepare a native attempt for this war. Its conditions will be checked again tomorrow, and CK3/AGOT handles the negotiation and outcome."
 rw_xm.decline:0 "I shall not take up this request."
 rw_xm.note_existing:0 "An attempt has already been initiated."
 rw_xm.answer_title:0 "An answer to my mediation request"
 rw_xm.declined_notice:0 "[rw_xm_mediator.GetTitledFirstName] declines my request for mediation."
 rw_xm.queued_notice:0 "[rw_xm_mediator.GetTitledFirstName] agrees to try intervening. A native attempt is prepared for tomorrow."
 rw_xm.unavailable_notice:0 "[rw_xm_mediator.GetTitledFirstName] agreed to try, but preparing the attempt became unavailable."
 rw_xm.existing_notice:0 "[rw_xm_mediator.GetTitledFirstName] reports that an attempt for this war is already queued or was sent today."
 rw_xw.review_desc:0 "The authority reconsiders this request while the war continues. Your answer is retained. This is the final decision for this request. Sending the same demand again is unavailable."
