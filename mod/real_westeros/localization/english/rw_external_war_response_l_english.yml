l_english:
 rw_xw.title:0 "A war across authorities"
 rw_xw.declaring_desc:0 "[rw_xw_attacker.GetTitledFirstName] has declared war against [rw_xw_defender.GetTitledFirstName] despite my ban on all wars. This attack reaches another branch. I can let it pass, express disapproval or ask for the conflict to end."
 rw_xw.target_desc:0 "The war of [rw_xw_attacker.GetTitledFirstName] against [rw_xw_defender.GetTitledFirstName] targets a title held by [rw_xw_holder.GetTitledFirstName], my direct vassal. I can object to this attack."
 rw_xw.ignore:0 "I shall let it pass for now."
 rw_xw.disapprove:0 "I disapprove of this attack."
 rw_xw.disapprove_effect:0 "My opinion of the attacker falls by 10 for two years. The war continues."
 rw_xw.notice_title:0 "An attack disapproved"
 rw_xw.notice_desc:0 "[rw_xw_ruler.GetTitledFirstName] disapproves of my attack."
 rw_xw.close:0 "The situation has changed."
 rw_xw.demand:0 "I ask them to end this war."
 rw_xw.demand_effect:0 "The attacker receives my political request and has seven days to answer."
 rw_xw.demand_title:0 "A request concerning my war"
 rw_xw.liege_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], my direct liege, asks me to end my war against [rw_xw_defender.GetTitledFirstName]. I can acknowledge the request or state my refusal."
 rw_xw.protector_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], the liege of a title holder targeted by my war against [rw_xw_defender.GetTitledFirstName], asks me to end this attack. I can acknowledge the request or state my refusal."
 rw_xw.acknowledge:0 "I have received your request."
 rw_xw.acknowledge_effect:0 "I acknowledge receipt. The war continues and my answer creates no peace commitment."
 rw_xw.refuse:0 "I shall continue this war."
 rw_xw.refuse_liege_effect:0 "My liege loses 15 opinion of me for two years."
 rw_xw.refuse_protector_effect:0 "The sender loses 10 opinion of me for two years."
 rw_xw.answer_title:0 "An answer to my request"
 rw_xw.acknowledged_notice:0 "[rw_xw_attacker.GetTitledFirstName] has acknowledged my request. The question of peace remains open."
 rw_xw.refused_notice:0 "[rw_xw_attacker.GetTitledFirstName] refuses my request and intends to continue this war."
