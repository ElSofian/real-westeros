l_french:
 rw_xw.title:0 "Une guerre entre deux autorités"
 rw_xw.declaring_desc:0 "[rw_xw_attacker.GetTitledFirstName] a déclaré la guerre contre [rw_xw_defender.GetTitledFirstName] malgré mon interdiction de toutes les guerres. Cette attaque touche une autre branche. Je peux laisser passer, désapprouver ou demander la fin du conflit."
 rw_xw.target_desc:0 "La guerre de [rw_xw_attacker.GetTitledFirstName] contre [rw_xw_defender.GetTitledFirstName] vise un titre détenu par [rw_xw_holder.GetTitledFirstName], mon vassal direct. Je peux manifester mon opposition à cette attaque."
 rw_xw.ignore:0 "Je laisse passer pour le moment."
 rw_xw.disapprove:0 "Je désapprouve cette attaque."
 rw_xw.disapprove_effect:0 "Mon opinion de l'attaquant baisse de 10 pendant deux ans. La guerre poursuit son cours."
 rw_xw.notice_title:0 "Une attaque désapprouvée"
 rw_xw.notice_desc:0 "[rw_xw_ruler.GetTitledFirstName] désapprouve mon attaque."
 rw_xw.close:0 "La situation a changé."
 rw_xw.demand:0 "Je lui demande de mettre fin à cette guerre."
 rw_xw.demand_effect:0 "L'attaquant reçoit ma demande politique et dispose de sept jours pour répondre. L'autorité pourra ensuite réexaminer cette demande une fois, tant que la guerre et le délai initial restent valides."
 rw_xw.demand_title:0 "Une demande au sujet de ma guerre"
 rw_xw.liege_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], mon suzerain direct, me demande de mettre fin à ma guerre contre [rw_xw_defender.GetTitledFirstName]. Je peux accuser réception de cette demande ou annoncer mon refus."
 rw_xw.protector_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], suzerain d'un détenteur de titre visé par ma guerre contre [rw_xw_defender.GetTitledFirstName], me demande de mettre fin à cette attaque. Je peux accuser réception de cette demande ou annoncer mon refus."
 rw_xw.acknowledge:0 "J'ai bien reçu votre demande."
 rw_xw.acknowledge_effect:0 "J'accuse réception de la demande. La guerre se poursuit et ma réponse ne crée aucun engagement de paix. L'autorité pourra ensuite réexaminer cette demande une fois, tant que la guerre et le délai initial restent valides."
 rw_xw.refuse:0 "Je poursuivrai cette guerre."
 rw_xw.refuse_liege_effect:0 "Mon suzerain perd 15 d'opinion envers moi pendant deux ans."
 rw_xw.refuse_protector_effect:0 "L'auteur de la demande perd 10 d'opinion envers moi pendant deux ans."
 rw_xw.answer_title:0 "Réponse à ma demande"
 rw_xw.acknowledged_notice:0 "[rw_xw_attacker.GetTitledFirstName] a accusé réception de ma demande. La question de la paix reste ouverte."
 rw_xw.refused_notice:0 "[rw_xw_attacker.GetTitledFirstName] refuse ma demande et annonce poursuivre cette guerre."
 rw_xw.native_intervene:0 "J'ouvre une négociation pour arrêter cette guerre."
 rw_xw.native_intervene_effect:0 "Demain, les conditions de l'intervention native seront vérifiées pour cette guerre précise. CK3/AGOT gérera la négociation, ses éventuelles contreparties et son résultat."
 rw_xw.native_blocked_title:0 "Intervention devenue indisponible"
 rw_xw.native_blocked_desc:0 "Le contexte de cette guerre ou les conditions natives ont changé. Ma tentative d'intervention s'arrête ici."
 rw_xm.request:0 "Je sollicite son suzerain."
 rw_xm.request_effect:0 "Le suzerain original du déclarant reçoit ma demande et dispose de sept jours pour choisir sa réponse."
 rw_xm.title:0 "Une demande de médiation"
 rw_xm.desc:0 "[rw_xm_protector.GetTitledFirstName] me demande d'intervenir auprès de mon vassal [rw_xw_attacker.GetTitledFirstName] au sujet de sa guerre contre [rw_xw_defender.GetTitledFirstName]. Je peux accepter de tenter la négociation native ou décliner cette demande."
 rw_xm.accept:0 "J'essaierai d'obtenir la fin de cette guerre."
 rw_xm.accept_effect:0 "Je consens à préparer une tentative native pour cette guerre. Ses conditions seront revérifiées demain et CK3/AGOT gérera la négociation et son résultat."
 rw_xm.decline:0 "Je ne donnerai pas suite à cette demande."
 rw_xm.note_existing:0 "Une tentative a déjà été engagée."
 rw_xm.answer_title:0 "Réponse à ma demande de médiation"
 rw_xm.declined_notice:0 "[rw_xm_mediator.GetTitledFirstName] décline ma demande de médiation."
 rw_xm.queued_notice:0 "[rw_xm_mediator.GetTitledFirstName] accepte de tenter une intervention. La tentative native est préparée pour demain."
 rw_xm.unavailable_notice:0 "[rw_xm_mediator.GetTitledFirstName] a accepté d'essayer, mais la préparation de la tentative est devenue indisponible."
 rw_xm.existing_notice:0 "[rw_xm_mediator.GetTitledFirstName] signale qu'une tentative pour cette guerre est déjà préparée ou a été envoyée aujourd'hui."
 rw_xw.review_desc:0 "L'autorité réexamine cette demande tant que la guerre continue. Votre réponse reste enregistrée. Cette demande reçoit sa dernière décision. Elle ne peut pas être renvoyée en boucle."
