l_french:
 rw_xw.title:0 "Une guerre entre deux autorités"
 rw_xw.declaring_desc:0 "[rw_xw_attacker.GetTitledFirstName] a déclaré la guerre contre [rw_xw_defender.GetTitledFirstName] malgré mon interdiction de toutes les guerres. Cette attaque touche une autre branche. Je peux laisser passer, désapprouver ou demander la fin du conflit."
 rw_xw.target_desc:0 "La guerre de [rw_xw_attacker.GetTitledFirstName] contre [rw_xw_defender.GetTitledFirstName] vise un titre détenu par [rw_xw_holder.GetTitledFirstName], mon vassal direct. Je peux manifester mon opposition à cette attaque."
 rw_xw.ignore:0 "Je laisse passer pour le moment."
 rw_xw.disapprove:0 "Je désapprouve cette attaque."
 rw_xw.disapprove_effect:0 "Mon opinion de l'attaquant baisse de 10 pendant deux ans. La guerre poursuit son cours."
 rw_xw.notice_title:0 "Une attaque désapprouvée"
 rw_xw.notice_desc:0 "[rw_xw_ruler.GetTitledFirstName] désapprouve mon attaque."
 rw_xw.close:0 "La situation a changé."
 rw_xw.demand:0 "Je lui demande de mettre fin à cette guerre."
 rw_xw.demand_effect:0 "L'attaquant reçoit ma demande politique et dispose de sept jours pour répondre."
 rw_xw.demand_title:0 "Une demande au sujet de ma guerre"
 rw_xw.liege_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], mon suzerain direct, me demande de mettre fin à ma guerre contre [rw_xw_defender.GetTitledFirstName]. Je peux accuser réception de cette demande ou annoncer mon refus."
 rw_xw.protector_demand_desc:0 "[rw_xw_ruler.GetTitledFirstName], suzerain d'un détenteur de titre visé par ma guerre contre [rw_xw_defender.GetTitledFirstName], me demande de mettre fin à cette attaque. Je peux accuser réception de cette demande ou annoncer mon refus."
 rw_xw.acknowledge:0 "J'ai bien reçu votre demande."
 rw_xw.acknowledge_effect:0 "J'accuse réception de la demande. La guerre se poursuit et ma réponse ne crée aucun engagement de paix."
 rw_xw.refuse:0 "Je poursuivrai cette guerre."
 rw_xw.refuse_liege_effect:0 "Mon suzerain perd 15 d'opinion envers moi pendant deux ans."
 rw_xw.refuse_protector_effect:0 "L'auteur de la demande perd 10 d'opinion envers moi pendant deux ans."
 rw_xw.answer_title:0 "Réponse à ma demande"
 rw_xw.acknowledged_notice:0 "[rw_xw_attacker.GetTitledFirstName] a accusé réception de ma demande. La question de la paix reste ouverte."
 rw_xw.refused_notice:0 "[rw_xw_attacker.GetTitledFirstName] refuse ma demande et annonce poursuivre cette guerre."
