l_french:
 rw_multi_actions.title:0 "Un accord commun"
 rw_multi_actions.terms:0 "[rw_ba_payer.GetTitledFirstName] promet de l’or et un soutien public à [rw_ba_payee.GetTitledFirstName], qui promet en retour de libérer la charte concernant [rw_ba_title.GetNameNoTier]. Les trois clauses sont acceptées ensemble, mais chaque acte reste volontaire et est consigné séparément."
 rw_multi_actions.price25:0 "La somme promise est de 25 pièces d’or. Le soutien public apporte un prestige adapté au rang du prestataire à son destinataire. Le bonus commun à ce prestataire et ce bénéficiaire se renouvelle après un an."
 rw_multi_actions.price50:0 "La somme promise est de 50 pièces d’or. Le soutien public apporte un prestige adapté au rang du prestataire à son destinataire. Le bonus commun à ce prestataire et ce bénéficiaire se renouvelle après un an."
 rw_multi_actions.negotiating:0 "Cette proposition dure sept jours. L’acceptation engage les deux parties sur cet accord précis ; elle n’exécute aucune de ses actions."
 rw_multi_actions.declined:0 "Cette proposition est close. Aucun accord n’a été signé."
 rw_multi_actions.active:0 "Les parties disposent de trente jours à compter de l’acceptation pour accomplir leurs propres clauses, dans l’ordre de leur choix. Une promesse non tenue ne crée pas une infraction judiciaire."
 rw_multi_actions.overdue:0 "Le délai d’exécution est écoulé. Les actes déjà accomplis demeurent ; les clauses restantes ne peuvent plus être exécutées au titre de cet accord."
 rw_multi_actions.fulfilled:0 "Les trois actions ont été consignées comme accomplies."
 rw_multi_actions.partial:0 "Cet accord s’est terminé sans que les trois actions soient accomplies. Les actes déjà réalisés sont conservés ; aucun remboursement ni châtiment n’est automatique."
 rw_multi_actions.gold_label:0 "Or :"
 rw_multi_actions.support_label:0 "Soutien public :"
 rw_multi_actions.release_label:0 "Libération de la charte :"
 rw_multi_actions.done:0 "Accompli."
 rw_multi_actions.attempted:0 "Tentative consignée ; résultat non confirmé."
 rw_multi_actions.pending:0 "En attente."
 rw_multi_actions.refused:0 "Refus explicite de la personne engagée."
 rw_multi_actions.expired:0 "Délai écoulé sans exécution."
 rw_multi_actions.unavailable:0 "Devenu impossible dans cet accord ; aucune faute personnelle n’en est déduite."
 rw_multi_actions.propose:0 "Proposer de l’or et un soutien public contre la libération de la charte."
 rw_multi_actions.accept:0 "Accepter les trois clauses."
 rw_multi_actions.counter:0 "Proposer l’autre somme."
 rw_multi_actions.decline:0 "Clore cette proposition sans accord."
 rw_multi_actions.pay:0 "Verser l’or promis."
 rw_multi_actions.support:0 "Apporter le soutien public promis."
 rw_multi_actions.release:0 "Libérer la charte convenue."
 rw_multi_actions.refuse_gold:0 "Refuser le paiement promis."
 rw_multi_actions.refuse_support:0 "Refuser le soutien public promis."
 rw_multi_actions.refuse_release:0 "Refuser la libération de la charte promise."
 rw_multi_actions.leave:0 "Laisser cet accord pour le moment."
 rw_review_multi_action_agreements_interaction:0 "Mes accords communs"
 rw_review_multi_action_agreements_interaction_desc:0 "Lire les propositions et les résultats qui me concernent ; cela n’exécute aucune action."
