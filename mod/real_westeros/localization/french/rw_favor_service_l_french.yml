l_french:
 rw_offer_favor_endorsement_interaction:0 "Proposer un soutien contre une faveur"
 rw_offer_favor_endorsement_interaction_desc:0 "Proposer un soutien immédiat contre une faveur native, avec une contre-offre possible de 25 pièces d’or. Le destinataire doit accepter explicitement. Ce parcours partage le délai annuel des offres de soutien existantes."
 rw_review_favor_endorsement_interaction:0 "Consulter le dernier soutien contre faveur"
 rw_review_favor_endorsement_interaction_desc:0 "Cibler le prestataire initial pour consulter la dernière offre connue comme prestataire ou client. Cette lecture ne renouvelle rien et n’accorde ni faveur, prestige ou paiement."
 rw_favor_service.title:0 "Soutien et contrepartie"
 rw_favor_service.parties:0 "[rw_fv_provider.GetTitledFirstName] propose un soutien immédiat à [rw_fv_client.GetTitledFirstName]. Seule la personne appelée à répondre aux dernières clauses peut accepter. La fenêtre initiale de trente jours n’est pas renouvelée par les contre-offres ; les offres de soutien partagent un délai d’un an à compter de leur lancement."
 rw_favor_service.favor_terms:0 "Contrepartie : le prestataire obtient une faveur native sur le client ; le client reçoit 50 points de prestige pour le soutien. Ces clauses ne versent aucun or. L’usage, la durée et les restrictions de la faveur suivent les règles de CK3/AGOT. Un hook existant détecté n’est ni remplacé ni renouvelé par cet échange."
 rw_favor_service.gold_terms:0 "Contrepartie alternative : le client verse 25 pièces d’or au prestataire et reçoit 50 points de prestige. Cette branche n’accorde aucune nouvelle faveur. Le prestataire doit accepter la contre-offre exacte et actuelle, et le client doit encore pouvoir payer."
 rw_favor_service.offered:0 "Ces clauses restent ouvertes. Le client peut accepter la faveur ou proposer 25 pièces d’or. Le prestataire peut accepter l’or ou redemander une faveur. Chacun peut clore l’offre sans paiement ni faute. Les réponses prennent un jour et ne renouvellent pas la fenêtre initiale."
 rw_favor_service.favor_unavailable:0 "Un hook existant détecté ou les règles natives bloquent maintenant cette faveur. Aucun hook n’est remplacé ou renouvelé. Une contre-offre en or ou la clôture peuvent rester disponibles."
 rw_favor_service.unfunded:0 "Le client ne peut actuellement pas payer 25 pièces d’or. Les clauses financières ne peuvent pas être acceptées sans les fonds ; la clôture ou des clauses de faveur éligibles restent des choix distincts."
 rw_favor_service.fulfilled:0 "L’échange de soutien est clos selon les clauses conservées. Cette offre ne permet plus de l’exécuter à nouveau. Un accord de faveur passé ne garantit pas que la faveur native est encore active ou inutilisée plus tard."
 rw_favor_service.closed:0 "Une partie initiale a clos cette offre. Cette clôture ne crée ni faveur, or, prestige, malus automatique ou nouvelle dette."
 rw_favor_service.inactive:0 "Cette offre a expiré ou les parties ne sont plus disponibles. Aucun service n’est exécuté automatiquement et aucun devoir n’est hérité. Clore l’offre ancienne exacte n’affecte pas une nouvelle offre."
 rw_favor_service.boundaries:0 "Accepter exécute ce service immédiat ; ce n’est pas une promesse pour plus tard. Utiliser la faveur pour une autre action reste soumis aux règles natives et demande un choix distinct. Consulter, contre-proposer et rester silencieux n’accordent rien. Cette vue conserve seulement la dernière offre du prestataire, pas un historique complet des services."
 rw_favor_service.unavailable:0 "Cette offre ou mon identité de participant initial ne sont plus actuelles. Aucun échange n’en découle."
 rw_favor_service.accept_favor:0 "Accepter : accorder une faveur native au prestataire et recevoir le soutien (+50 prestige)."
 rw_favor_service.counter_gold:0 "Proposer 25 pièces d’or au lieu d’une faveur ; attendre l’accord du prestataire."
 rw_favor_service.accept_gold:0 "Accepter les 25 pièces d’or proposées par le client et exécuter le soutien."
 rw_favor_service.restate:0 "Redemander une faveur native au lieu de l’or ; attendre l’accord du client."
 rw_favor_service.close:0 "Clore cette offre sans exécuter l’échange."
 rw_favor_service.leave:0 "Quitter sans prendre de nouvelle décision."
