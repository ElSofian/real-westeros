l_french:
 rw_request_release_endorsement_interaction:0 "Demander à être libéré de ma promesse"
 rw_request_release_endorsement_interaction_desc:0 "Demander au client de vous libérer du soutien différé convenu. Seule son acceptation explicite l’annule. La demande dure sept jours, sans suspendre l’exécution ni prolonger l’échéance initiale. L’accord ne change ni or, ni prestige, ni opinion."
 rw_offer_release_endorsement_interaction:0 "Proposer de libérer cette promesse"
 rw_offer_release_endorsement_interaction_desc:0 "Proposer au prestataire de le libérer de son soutien différé envers vous. Seule son acceptation explicite l’annule. La demande dure sept jours, sans suspendre l’exécution ni prolonger l’échéance initiale. L’accord ne change ni or, ni prestige, ni opinion."
 rw_cancellations.0001.t:0 "Une promesse à laquelle renoncer ensemble"
 rw_cancellations.0001.desc:0 "[rw_cancel_proposer.GetTitledFirstName] propose d’annuler d’un commun accord le soutien différé de [rw_service_provider.GetTitledFirstName] envers [rw_service_client.GetTitledFirstName]. Je peux accepter, refuser ou ne pas répondre. Seul un accord libère les deux parties. Aucun or, prestige ou point d’opinion n’est gagné ni perdu. La demande expire après sept jours ; la promesse reste active et son échéance initiale ne change pas."
 rw_cancellations.accept:0 "Accepter : libérer les deux parties sans paiement ni peine."
 rw_cancellations.reject:0 "Refuser : maintenir la promesse initiale."
 rw_cancellations.ignore:0 "Laisser sans réponse, sans donner mon accord."
 rw_cancellations.lapsed:0 "Cette demande ne permet plus de prendre une décision."
 rw_cancellations.0002.t:0 "Une promesse libérée d’un commun accord"
 rw_cancellations.released:0 "[rw_service_provider.GetTitledFirstName] et [rw_service_client.GetTitledFirstName] ont accepté d’annuler ce soutien différé. Cet accord n’accomplit aucun service, ne prélève aucun paiement, n’accorde aucune récompense et ne constate aucune rupture. Les autres affaires antérieures restent inchangées."
 rw_cancellations.unavailable:0 "Cette notification ne correspond plus à un enregistrement actuel et concordant. Elle ne donne aucun accord et ne modifie aucune promesse ni rupture consignée."
 rw_cancellations.acknowledge:0 "C’est noté."
 rw_cancellations.0003.t:0 "Une promesse différée est consignée"
 rw_cancellations.promise_received:0 "[rw_service_provider.GetTitledFirstName] m’a promis un soutien futur au prix convenu. Aucun or ni prestige n’a été transféré. Je peux maintenir l’accord ou proposer d’y renoncer ensemble. Le prestataire peut encore accomplir ou rompre la promesse selon les conditions initiales ; ma seule proposition ne change rien."
 rw_cancellations.propose:0 "Proposer d’annuler cette promesse d’un commun accord."
 rw_cancellations.keep:0 "Maintenir l’accord en l’état."
