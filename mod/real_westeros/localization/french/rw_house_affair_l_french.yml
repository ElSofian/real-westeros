l_french:
 rw_review_house_affairs_interaction:0 "Consulter les affaires de ma maison et de ma couronne"
 rw_review_house_affairs_interaction_desc:0 "Relire les affaires politiques de maison connues de mon personnage. Rien n’est communiqué au personnage sélectionné."
 rw_house_censured_opinion:0 "Ma maison a été disgraciée"
 rw_house_restored_opinion:0 "Une maison revenue dans mes bonnes grâces"
 rw_house_affairs.consider:0 "Envisager la disgrâce politique de cette maison."
 rw_house_affairs.censure_title:0 "Une maison en disgrâce"
 rw_house_affairs.censure_terms:0 "Je peux placer [rw_house_target.GetName] dans la disgrâce politique de [rw_house_authority.GetName] pour cinquante ans, au prix de 50 de prestige. Son chef actuel m’en voudra pendant cinq ans si ce ressentiment n’est pas déjà présent. Cette décision ne rend pas les proches coupables, ne retire pas leur noblesse et n’interdit pas de détenir des terres. Un souverain ultérieur pourra la lever ; le futur chef de maison pourra demander sa réhabilitation. Je décide de la faveur de la couronne, pas d’une nouvelle peine criminelle."
 rw_house_affairs.censure:0 "Déclarer la disgrâce de cette maison — 50 de prestige."
 rw_house_affairs.record_title:0 "Une affaire de maison et de couronne"
 rw_house_affairs.active:0 "[rw_house_target.GetName] reste dans la disgrâce politique de l’autorité de [rw_house_authority.GetName]. Le terme initial est de cinquante ans ; les pétitions ultérieures ne le renouvellent pas. Le chef actuel peut demander sa réhabilitation au souverain présent. La couronne peut accepter, refuser, laisser la demande sans réponse ou retirer sa censure. Ce statut n’offre aucune immunité et ne modifie aucun droit habituel sur les titres."
 rw_house_affairs.restored:0 "La pétition de [rw_house_target.GetName] a été acceptée. Sa situation politique auprès de [rw_house_authority.GetName] est réhabilitée. Cette reconnaissance n’accorde ni terres ancestrales, ni grâce criminelle, ni annulation d’un décret d’une autre autorité."
 rw_house_affairs.withdrawn:0 "Le souverain a retiré cette censure politique de [rw_house_target.GetName]. Les autres affaires, les peines habituelles et la possession des titres restent distinctes."
 rw_house_affairs.expired:0 "La censure politique initiale de [rw_house_target.GetName] a expiré. Ce dossier n’établit aucune interdiction passée de détenir des terres et n’accorde aucun titre."
 rw_house_affairs.petition:0 "Demander la réhabilitation politique de la maison."
 rw_house_affairs.answer:0 "Examiner la pétition actuelle."
 rw_house_affairs.withdraw:0 "Retirer cette censure politique."
 rw_house_affairs.petition_title:0 "Une maison demande sa réhabilitation"
 rw_house_affairs.petition_terms:0 "Le chef actuel de [rw_house_target.GetName] demande la fin de cette censure politique. Accepter clôt uniquement cette affaire et donne au souverain +10 d’opinion envers le pétitionnaire pendant deux ans si cette faveur est absente ; elle ne se cumule pas et ne renouvelle pas une faveur existante. Refuser ou garder le silence n’ajoute aucune sanction. Cette décision ne promet aucune terre et n’accorde aucune immunité criminelle."
 rw_house_affairs.restore:0 "Rendre à cette maison la faveur de la couronne."
 rw_house_affairs.refuse:0 "Refuser cette pétition."
 rw_house_affairs.leave_unchanged:0 "Laisser la situation inchangée."
 rw_house_affairs.unavailable:0 "Le dossier ou mon autorité pour faire ce choix a changé. Aucune nouvelle décision n’est prise."
 rw_house_affairs.last_refused:0 "La dernière pétition a été refusée. Cela n’a ajouté aucune peine ; le terme initial reste inchangé."
 rw_house_affairs.last_unanswered:0 "La dernière pétition n’a reçu aucune décision dans son délai de trente jours. Cela n’a ajouté aucune peine ; une nouvelle demande suit le délai habituel de la maison."
 rw_house_affairs.refresh:0 "Relire le dossier actuel avant de décider."
 rw_house_affairs.last_invalidated:0 "La dernière pétition est devenue caduque après un changement des parties ou de leur capacité à agir. Elle ne peut plus recevoir de réponse. Cela n’ajoute aucune peine et ne renouvelle pas la censure ; un nouveau chef ou souverain peut permettre une nouvelle demande."
