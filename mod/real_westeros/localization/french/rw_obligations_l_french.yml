l_french:
 rw_review_endorsement_promise_interaction:0 "Revoir ma promesse de soutien"
 rw_review_endorsement_promise_interaction_desc:0 "Reprendre votre engagement après sept jours et avant l’échéance convenue de quatorze ou trente jours. L’accomplissement transfère le prix convenu et donne 50 points de prestige au client. Vous pouvez aussi attendre ou rompre votre promesse."
 rw_obligations.0001.t:0 "Une promesse à tenir"
 rw_obligations.0001.desc:0 "J’ai promis mon soutien public à [rw_service_client.GetTitledFirstName]. Je peux maintenant l’apporter contre la somme convenue, attendre une semaine ou manquer à ma parole. Si je reste en mesure d’agir et laisse passer l’échéance, le client sera informé de mon manquement. Si une partie est indisponible ou le paiement impossible à l’échéance, l’accord prend fin sans faute imputée."
 rw_obligations.fulfill:0 "Apporter mon soutien et recevoir le paiement convenu."
 rw_obligations.break:0 "Je ne tiendrai pas cette promesse."
 rw_obligations.wait:0 "Attendre et reconsidérer dans une semaine."
 rw_obligations.lapsed:0 "Cette réponse n’est plus valable."
 rw_obligations.0003.t:0 "Un soutien qui ne viendra pas"
 rw_obligations.0003.desc:0 "[rw_service_provider.GetTitledFirstName] n’a pas honoré notre accord de soutien. Aucun paiement n’a été prélevé. Je peux lui en tenir rigueur ou laisser passer. C’est une réaction politique personnelle, pas la preuve d’un crime."
 rw_obligations.resent:0 "Je me souviendrai de ce manquement."
 rw_obligations.forgive:0 "Laisser passer sans pénalité."
 rw_broken_service_opinion:0 "A rompu une promesse de soutien"
