l_french:
 rw_house_terms.title:0 "Les conditions de la réhabilitation d’une maison"
 rw_house_terms.offer:0 "Proposer les conditions financières de cette réhabilitation."
 rw_house_terms.review:0 "Examiner les conditions financières de la réhabilitation."
 rw_house_terms.conditions:0 "Le souverain actuel de [rw_house_authority.GetName] propose de clore cette censure politique de [rw_house_target.GetName]. La contribution personnelle ci-dessous est fixée pour cette offre de trente jours. L’accord exige les mêmes parties habilitées et une trésorerie suffisante."
 rw_house_terms.unaffordable:0 "Ma trésorerie actuelle est inférieure à la contribution convenue."
 rw_house_terms.accept:0 "Verser la contribution convenue et obtenir cette réhabilitation politique."
 rw_house_terms.refuse:0 "Refuser ces conditions financières."
 rw_house_terms.pending:0 "Le chef actuel peut examiner, accepter, refuser ou laisser sans réponse la contribution personnelle proposée pendant trente jours."
 rw_house_terms.refused:0 "Le pétitionnaire a refusé les conditions financières. Aucun or n’a été prélevé et aucune peine n’a été ajoutée ; cette censure conserve son terme initial."
 rw_house_terms.invalidated:0 "L’offre financière est devenue caduque après un changement des parties ou de leur capacité à agir. Rien n’a été payé. Une offre constatée caduque ne peut pas renaître ; une nouvelle demande suit le délai applicable et les rôles actuels."
 rw_house_terms.unanswered:0 "L’offre financière a expiré sans réponse. Rien n’a été payé, aucune peine n’a été ajoutée et le terme initial de la censure n’a pas été renouvelé."
 rw_house_terms.settled:0 "Le pétitionnaire a versé la contribution convenue au souverain désigné. Cette censure politique est close."
