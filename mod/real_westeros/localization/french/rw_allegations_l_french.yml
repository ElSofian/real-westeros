l_french:
 rw_raise_affront_allegation_interaction:0 "Formuler une accusation d’offense (expérimental)"
 rw_raise_affront_allegation_interaction_desc:0 "Alléguer que ce dirigeant a offensé votre maison. Aucun fait n’est ainsi prouvé et aucune pénalité n’est appliquée. Il peut reconnaître, contester ou ignorer. Vous pourrez ensuite retirer l’affaire ou transmettre sa réponse à un suzerain commun distinct des parties. Délai de trente jours ; nouvelle accusation après quatre-vingt-dix jours. Non testé dans CK3."
 rw_allegations.0001.t:0 "Une offense alléguée"
 rw_allegations.0001.desc:0 "[rw_service_client.GetTitledFirstName] m’accuse d’avoir offensé sa maison. Aucune preuve indépendante n’établit les faits. Je peux reconnaître les propos allégués, contester le récit ou ne pas répondre. Ma réponse sera consignée comme une déclaration, pas comme un crime ou un jugement. Notre suzerain commun n’est pas encore informé."
 rw_allegations.admit:0 "Reconnaître les propos allégués."
 rw_allegations.contest:0 "Contester ce récit."
 rw_allegations.ignore:0 "Ne pas répondre : le silence ne prouve rien."
 rw_allegations.0002.t:0 "Une réponse à l’accusation"
 rw_allegations.reply_admitted:0 "[rw_service_provider.GetTitledFirstName] a reconnu les propos allégués. Cela établit qu’une reconnaissance a été formulée, pas un crime natif ni un jugement indépendant. Le plaignant peut retirer l’affaire ou transmettre cette déclaration à [rw_case_mediator.GetTitledFirstName]."
 rw_allegations.reply_contested:0 "[rw_service_provider.GetTitledFirstName] a contesté ce récit. L’accusation reste non vérifiée ; la dénégation ne prouve pas non plus qu’elle était fausse. Le plaignant peut retirer l’affaire ou transmettre ce récit contesté à [rw_case_mediator.GetTitledFirstName]."
 rw_allegations.refer:0 "Transmettre cette déclaration et demander une médiation."
 rw_allegations.withdraw:0 "Retirer l’affaire sans pénalité."
 rw_allegations.ruler_admitted_desc:0 "[rw_service_client.GetTitledFirstName] reproche une offense à [rw_service_provider.GetTitledFirstName], qui a reconnu les propos. Cette déclaration est consignée, mais aucun crime natif ni jugement indépendant n’est établi. Je peux ne pas intervenir, exprimer ma désapprobation personnelle ou proposer un apaisement volontaire."
 rw_allegations.ruler_contested_desc:0 "[rw_service_client.GetTitledFirstName] reproche une offense à [rw_service_provider.GetTitledFirstName], qui conteste le récit. Il n’existe aucune corroboration indépendante. Je peux ne pas intervenir ou proposer un geste d’apaisement volontaire ; cette seule accusation contestée n’autorise pas l’option de réprimande."
 rw_allegations.repair_desc:0 "[rw_case_mediator.GetTitledFirstName] propose un geste d’apaisement volontaire envers [rw_service_client.GetTitledFirstName]. Il coûte 25 points de prestige et améliore de 5 l’opinion du médiateur pendant deux ans. Le plaignant choisit de l’accepter ou non pour le même gain d’opinion. Faire ce geste ne reconnaît pas l’accusation, n’efface pas une déclaration, n’établit aucun crime et ne paie aucun service. Je peux décliner sans nouvelle peine automatique."
 rw_allegations.archive_respondent:0 "Ce dossier contient une accusation non vérifiée de [rw_service_client.GetTitledFirstName] contre [rw_service_provider.GetTitledFirstName]. Il attend une réponse. Le silence ne corrobore rien et le médiateur prévu n’est pas informé."
 rw_allegations.archive_claimant:0 "Cette accusation a reçu une réponse consignée. Le plaignant choisit de retirer ou de transmettre le dossier ; le médiateur prévu n’est pas encore informé. Aucun crime natif ni aucune peine ne découle de cette étape."
 rw_allegations.result_withdrawn:0 "Le plaignant a retiré l’affaire sans pénalité. Le dossier conserve l’accusation et la réponse formulée ; ce retrait ne vaut ni aveu ni preuve d’innocence."
 rw_allegations.read_statement:0 "Lire l’accusation et la réponse consignées."
 rw_allegations.statement_title:0 "Les déclarations consignées"
 rw_allegations.statement_admitted:0 "[rw_service_client.GetTitledFirstName] a reproché une offense à [rw_service_provider.GetTitledFirstName], qui a reconnu les propos. Cela consigne la reconnaissance, pas une preuve indépendante ou un crime natif. La déclaration reste conservée si l’affaire est ensuite retirée ou apaisée."
 rw_allegations.statement_contested:0 "[rw_service_client.GetTitledFirstName] a reproché une offense à [rw_service_provider.GetTitledFirstName], qui a contesté le récit. L’accusation demeure contestée, sans être prouvée vraie ni fausse. Un retrait ou un geste d’apaisement ne change pas cette réponse consignée."
 rw_allegations.statement_unanswered:0 "[rw_service_client.GetTitledFirstName] a reproché une offense à [rw_service_provider.GetTitledFirstName]. Aucune réponse n’a été consignée. Le silence n’établit pas l’accusation, même après l’échéance."
 rw_allegations.statement_unavailable:0 "Ce dossier n’est plus accessible. Son absence ne permet de tirer aucune conclusion sur l’accusation."
