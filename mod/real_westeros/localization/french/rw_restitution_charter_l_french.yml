l_french:
 rw_restitution_charter.title:0 "Une charte de restitution de la couronne"
 rw_restitution_charter.introduction:0 "Le souverain actuel peut proposer, au nom de cette couronne enregistrée, un engagement public de cinq ans visant le retour de ce titre précis à l’ancienne maison enregistrée, lorsque la couronne le détient personnellement. Son chef actuel doit accepter explicitement sous sept jours. Aucun titre, revendication, paiement ou droit juridique n’est créé."
 rw_restitution_charter.terms:0 "Cette charte concerne uniquement le titre, la couronne et l’ancienne maison de cette entrée publique précise. C’est un engagement politique institutionnel, pas un serment personnel transmis silencieusement à un héritier. Proposition et acceptation initiales restent distinctes de la reconnaissance explicite d’un successeur."
 rw_restitution_charter.offered:0 "Le délai initial de sept jours est ouvert. Seul le chef de maison initialement désigné peut accepter tant que les deux représentants désignés occupent encore leurs fonctions. Une succession n’hérite pas d’un consentement personnel en attente. Les représentants actuels peuvent fermer une proposition devenue caduque sans faute."
 rw_restitution_charter.active:0 "La charte a été acceptée et sa période initiale de cinq ans reste ouverte. Le souverain actuel peut la maintenir ou la répudier ; le chef de maison actuel peut l’en délier, ou constater sa satisfaction si la maison exacte détient réellement le titre précis. Aucune opération de titre n’est automatique."
 rw_restitution_charter.unassumed:0 "Ce souverain actuel n’a pas explicitement reconnu cette charte. Il peut choisir de la reprendre ou de la répudier ; consulter ou recevoir la couronne ne vaut ni promesse personnelle ni culpabilité. La reconnaissance ne recommence jamais le délai initial."
 rw_restitution_charter.satisfied:0 "Le chef de maison alors en fonction a explicitement constaté sa satisfaction tandis qu’un membre vivant de la maison exacte détenait ce titre précis. Cette propriété et cette déclaration ne prouvent ni une concession de la couronne ni un retour causé par la charte. Aucun domaine, récompense ou immunité n’a été accordé par ce dossier."
 rw_restitution_charter.renounced:0 "Le souverain alors en fonction a explicitement répudié la charte. Cela conserve une décision institutionnelle, pas une culpabilité personnelle héritée ou un crime, une sanction ou une confiscation natifs automatiques."
 rw_restitution_charter.released:0 "Le chef de maison alors en fonction a explicitement délié la couronne de la charte au nom de la maison enregistrée. Aucun titre, revendication, opinion ou autre différend natif n’a changé."
 rw_restitution_charter.closed:0 "La proposition non acceptée a été fermée par un représentant actuel. Aucun engagement accepté, faute personnelle ou droit foncier n’en découle."
 rw_restitution_charter.expired:0 "Le délai initial de proposition ou d’engagement est échu. Le silence et l’absence de retour ne prouvent ni rupture délibérée, exécution ou culpabilité ; le dossier et la conservation initiale du registre ne sont pas prolongés."
 rw_restitution_charter.limits:0 "Les règles natives de concession, succession, élection, conquête et AGOT restent déterminantes. Cette charte ne force ni transfert ni saisie et ne crée ni interdiction foncière de maison ni revendication. Les actions natives restent distinctes. Publicité et stockage suivent le registre existant, dont la conservation fixe n’est jamais prolongée ; fonctions ou références perdues désactivent les actions."
 rw_restitution_charter.unavailable:0 "Cette charte précise ou ses fonctions et sa révision actuelles sont indisponibles. Des données historiques absentes n’accordent ni consentement ni autorité héritée."
 rw_restitution_charter.propose:0 "Proposer cet engagement public de cinq ans de la couronne ; demander l’accord du chef de maison actuel."
 rw_restitution_charter.accept:0 "Accepter ces clauses institutionnelles exactes pour la maison enregistrée."
 rw_restitution_charter.assume:0 "Reprendre explicitement cette charte comme souverain actuel, sans changer son échéance."
 rw_restitution_charter.renounce:0 "Répudier cette charte comme souverain actuel, sans transférer de terres."
 rw_restitution_charter.release:0 "Délier la couronne de cette charte comme chef actuel de la maison enregistrée."
 rw_restitution_charter.satisfy:0 "Constater ma satisfaction : ma maison exacte possède actuellement ce titre précis, sans affirmer la cause."
 rw_restitution_charter.close:0 "Fermer cette proposition non acceptée, sans faute ni nouveau droit."
 rw_restitution_charter.leave:0 "Laisser cette charte inchangée."
 rw_restitution_charter.review:0 "Consulter la charte publique de restitution de cette entrée."
