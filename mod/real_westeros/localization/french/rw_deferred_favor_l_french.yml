l_french:
 rw_offer_deferred_favor_endorsement_interaction:0 "Promettre un soutien contre une faveur future"
 rw_offer_deferred_favor_endorsement_interaction_desc:0 "Négocier un soutien différé contre une faveur native ou 25 pièces d’or. L’accord promet une exécution après sept jours et avant trente, sans rien verser maintenant. Le client initial peut se retirer avant l’exécution."
 rw_deferred_favor.immediate_timing:0 "Clauses immédiates : accepter exécute maintenant le soutien et la contrepartie choisie, sans promesse pour plus tard."
 rw_deferred_favor.timing:0 "Clauses différées : l’accord crée une promesse personnelle, pas un échange immédiat. Le prestataire peut l’exécuter après sept jours et avant trente jours depuis l’acceptation. Alors seulement, après de nouvelles vérifications, la faveur ou les 25 pièces d’or convenues sont échangées contre 50 points de prestige pour le client. Le client peut se retirer avant l’exécution ; ni argent ni faveur ne sont réservés."
 rw_deferred_favor.promised:0 "La promesse personnelle est acceptée et son délai initial d’exécution reste ouvert. Le prestataire décide de l’exécuter, de la renier ou d’attendre. Le client initial peut retirer sa future contrepartie. Consulter ne prolonge jamais l’échéance."
 rw_deferred_favor.renounced:0 "Le prestataire initial a explicitement renié sa promesse acceptée. Aucun soutien, faveur ou argent n’est échangé ; cette déclaration ne crée ni crime, sanction automatique ou devoir hérité."
 rw_deferred_favor.withdrawn:0 "Le client initial s’est retiré avant l’exécution. Aucune contrepartie ni aucun prestige n’est échangé. Les hooks natifs existants restent intacts et aucune dette ou faute automatique n’est créée."
 rw_deferred_favor.unresolved:0 "Le délai d’exécution s’est terminé sans exécution conservée, ou cette promesse n’est plus active. Elle reste non résolue ; ce n’est pas une preuve de rupture délibérée. Aucun service, contrepartie, sanction ou devoir hérité n’en découle automatiquement."
 rw_deferred_favor.accept:0 "Accepter ces clauses différées exactes, sans échanger maintenant faveur, or ou prestige."
 rw_deferred_favor.perform:0 "Exécuter maintenant : appliquer la faveur ou les 25 pièces d’or convenues et accorder 50 points de prestige au client."
 rw_deferred_favor.renounce:0 "Renier explicitement ma promesse sans l’exécuter."
 rw_deferred_favor.withdraw:0 "Retirer ma future contrepartie avant l’exécution ; ne rien échanger."
 rw_deferred_favor.consideration_unavailable:0 "La contrepartie convenue ne peut actuellement pas être fournie : les fonds requis du client ou l’éligibilité de la faveur native manquent. Rien n’est prélevé. Attendre ne prolonge pas le délai ; le reniement du prestataire et le retrait du client restent des choix distincts."
