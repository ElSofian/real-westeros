l_french:
 rw_title_status.open:0 "Examiner les titres et le statut de ce prisonnier."
 rw_title_status.title:0 "Les titres et le statut de mon prisonnier"
 rw_title_status.intro:0 "Je peux examiner les titres et le statut personnel de ce prisonnier indépendamment de sa vie ou de sa liberté. Sa situation actuelle n’établit pas quelle infraction aurait déjà été sanctionnée.\n\n"
 rw_title_status.reason:0 "Je dispose actuellement d’un motif reconnu de révocation contre cette personne. Il peut concerner un autre acte et ne garantit pas qu’un titre donné puisse être retiré sans conséquences.\n\n"
 rw_title_status.no_reason:0 "Je ne dispose actuellement d’aucun motif reconnu de révocation contre cette personne. Un motif d’emprisonnement ou d’exécution n’en fournit pas automatiquement un.\n\n"
 rw_title_status.unknown_reason:0 "Les motifs actuels de révocation n’ont pas pu être établis.\n\n"
 rw_title_status.knight:0 "Cette personne est actuellement reconnue comme chevalier.\n\n"
 rw_title_status.not_knight:0 "Cette personne n’est pas actuellement reconnue comme chevalier.\n\n"
 rw_title_status.stripped_knight:0 "Cette personne porte actuellement le statut de chevalier déchu. Cela ne prouve pas que ce statut résulte de ce complot.\n\n"
 rw_title_status.landed_knight:0 "Cette personne possède actuellement un contrat de chevalier fieffé. Ce statut ne lui interdit pas de détenir des terres.\n\n"
 rw_title_status.no_landed_knight_contract:0 "Aucun contrat actuel de chevalier fieffé n’est établi pour cette personne. Cela ne détermine pas à lui seul sa noblesse ni le statut de sa famille.\n\n"
 rw_title_status.terms:0 "Une révocation passe par le choix habituel du titre, selon les lois, les contrats et leurs conséquences. Les conditions de libération peuvent proposer des sanctions de statut personnel lorsqu’elles sont permises. Je dois en examiner et confirmer les termes précis ; rien ici ne condamne les proches de ce prisonnier ni n’interdit à sa maison de détenir des terres."
 rw_title_status.review_revocation:0 "Examiner les conditions de révocation (sans envoyer)."
 rw_title_status.review_release:0 "Examiner les conditions possibles de libération (sans envoyer)."
 rw_title_status.unavailable:0 "Le dossier privé n’est plus accessible ou les conditions de détention ont changé. Aucune décision n’est prise."
 rw_title_status.close:0 "Laisser la situation inchangée."
