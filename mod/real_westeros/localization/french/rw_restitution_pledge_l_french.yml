l_french:
 rw_restitution_pledge.title:0 "Une promesse personnelle de restitution"
 rw_restitution_renounced_opinion:0 "Promesse personnelle de restitution reniée"
 rw_restitution_pledge.propose:0 "Proposer personnellement de rendre ce titre sous trente jours, sans paiement."
 rw_restitution_pledge.review:0 "Consulter notre promesse de restitution distincte."
 rw_restitution_pledge.discussion_closed:0 "La discussion est close ou ses conditions ont changé. Une promesse personnelle acceptée séparément conserve son propre délai et son propre dénouement. Clore la discussion ne libère pas de cette promesse et ne la renie pas ; aucun malus de refus ne s’y ajoute."
 rw_restitution_pledge.identity:0 "[rw_rs_holder.GetShortUIName] a proposé à [rw_rs_requester.GetShortUIName] de s’engager personnellement à rendre [rw_rs_title.GetName]. Cet engagement est distinct du simple examen de la demande."
 rw_restitution_pledge.days_14:0 "Délai proposé ou accepté : quatorze jours à compter de l’acceptation de ces clauses."
 rw_restitution_pledge.days_30:0 "Délai proposé ou accepté : trente jours à compter de l’acceptation de ces clauses."
 rw_restitution_pledge.offered:0 "La personne appelée à répondre peut accepter ces clauses exactes, proposer l’autre délai ou clore l’offre. Une contre-offre passe la réponse à l’autre partie. La fenêtre initiale de sept jours et l’échéance initiale de discussion restent applicables ; aucune n’est renouvelée. Aucune promesse n’existe avant acceptation."
 rw_restitution_pledge.offer_closed:0 "Une partie a clos l’offre non acceptée. Il n’en résulte aucune promesse, cession, dépense ou sanction."
 rw_restitution_pledge.offer_lapsed:0 "L’offre a expiré ou la discussion initiale, les parties, la propriété ou la source ne permettent plus son acceptation. Aucune promesse personnelle n’a été acceptée."
 rw_restitution_pledge.promised:0 "Les deux parties ont accepté cette promesse personnelle. Le délai convenu court depuis l’acceptation, indépendamment de la discussion. La promesse ne cède aucun titre et ne garantit pas l’éligibilité native. Le détenteur doit employer les actions natives ordinaires ; le bénéficiaire peut librement le délier."
 rw_restitution_pledge.renounced:0 "Le détenteur initial a explicitement renié sa promesse acceptée alors qu’il possédait encore le titre. Aucune sanction n’est automatique. Pendant sept jours, le bénéficiaire peut en prendre acte ou choisir une réaction personnelle limitée si les conditions présentes le permettent."
 rw_restitution_pledge.released:0 "Le bénéficiaire a librement délié l’autre partie de sa promesse. Aucun paiement, transfert de titre ou nouveau malus n’en résulte."
 rw_restitution_pledge.unresolved:0 "L’échéance est passée sans confirmation enregistrée du bénéficiaire. Cela ne prouve ni une rupture délibérée ni quand et comment le titre a changé de mains. Aucune sanction n’est automatique. Le bénéficiaire peut délier l’autre partie ou, s’il possède maintenant le titre, constater sa satisfaction."
 rw_restitution_pledge.invalidated:0 "Un décès ou le passage du titre à un tiers observé a clos cette promesse personnelle en attente sans sanction. Aucun successeur n’hérite du consentement, de la culpabilité ou du devoir de céder des terres."
 rw_restitution_pledge.acknowledged:0 "Alors qu’il possédait ce titre exact, le bénéficiaire a confirmé sa satisfaction avant l’échéance. Cela conserve sa déclaration personnelle et la propriété présente, sans prouver la cause ni la voie d’acquisition."
 rw_restitution_pledge.acknowledged_late:0 "Après l’échéance, le bénéficiaire a confirmé sa satisfaction alors qu’il possédait le titre. La confirmation est tardive ; cela ne prouve pas que l’acquisition l’était ou résultait de la promesse."
 rw_restitution_pledge.boundaries:0 "Ces choix ne créent aucun titre, or, prestige, revendication, pardon ou droit légal. Sélection, restrictions et confirmation d’une concession native restent distinctes. La propriété présente ne clôt jamais automatiquement la promesse. Le silence et une échéance non résolue n’ajoutent aucun malus. Clauses personnelles et réponses restent entre les deux parties initiales."
 rw_restitution_pledge.unavailable:0 "Cette promesse privée, ses clauses actuelles ou mon identité de participant initial ne sont plus valides. Aucune décision ni cession n’en découle."
 rw_restitution_pledge.accept:0 "Accepter cette promesse personnelle exacte et son délai de restitution."
 rw_restitution_pledge.counter:0 "Proposer l’autre délai : quatorze jours au lieu de trente, ou trente au lieu de quatorze."
 rw_restitution_pledge.close_offer:0 "Clore cette offre sans accepter de promesse."
 rw_restitution_pledge.acknowledge:0 "Je possède ce titre et confirme ma satisfaction, sans attester la voie d’acquisition."
 rw_restitution_pledge.renounce:0 "Renier explicitement ma promesse acceptée alors que je possède encore le titre."
 rw_restitution_pledge.release:0 "Délier l’autre partie de cette promesse personnelle sans malus."
 rw_restitution_pledge.resent:0 "Mal prendre ce reniement explicite : mon opinion −15 pendant deux ans si absente, sans cumul ni renouvellement."
 rw_restitution_pledge.accept_renunciation:0 "Prendre acte du reniement sans ajouter de malus."
 rw_restitution_pledge.resented_history:0 "Le bénéficiaire a choisi de mal prendre le reniement. Cette réaction passée ne renouvelle aucun modificateur d’opinion et ne prouve aucun crime."
 rw_restitution_pledge.response_history:0 "Le bénéficiaire a pris acte du reniement sans ajouter de malus."
