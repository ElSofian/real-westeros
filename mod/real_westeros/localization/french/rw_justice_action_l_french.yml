 rw_justice_action.title:0 "Envisager une demande d’arrestation native"
 rw_justice_action.confirm_desc:0 "Je peux demander l’arrestation de [rw_ja_target.GetTitledFirstName] selon les règles natives actuelles. Le motif d’emprisonnement présent ne prouve pas qu’il concerne ce complot. L’envoi peut entraîner un refus, une résistance ou d’autres conséquences natives. Ce canal utilise la demande ordinaire sans faveur utilisable ni diarchie active. Il ne garantit pas la détention et n’enregistre pas une sanction accomplie."
 rw_justice_action.unavailable:0 "Cette demande n’est plus disponible. Le personnage, le dossier ou les conditions natives ont changé, ou ce dossier a déjà servi à une tentative. Aucune sanction n’en est déduite."
 rw_justice_action.attempt:0 "Envoyer cette demande d’arrestation native"
 rw_justice_action.leave:0 "Laisser cette affaire pour l’instant"
 rw_justice_action.open:0 "Envisager l’envoi d’une demande d’arrestation"
