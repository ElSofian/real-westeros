l_french:
 rw_consider_title_revocation_interaction:0 "Envisager la révocation d’un titre précis"
 rw_consider_title_revocation_interaction_desc:0 "Sélectionner un titre pour examiner une intention fondée sur l’une de mes observations privées. La sélection seule n’enregistre aucune intention et ne révoque rien."
 rw_review_revocation_intents_interaction:0 "Consulter mes intentions de révocation"
 rw_review_revocation_intents_interaction_desc:0 "Relire mes intentions privées, présentes ou passées. Le personnage sélectionné ne reçoit rien."
 rw_revocation_intents.title:0 "Une intention concernant un titre"
 rw_revocation_intents.confirm_terms:0 "J’envisage [rw_ri_title.GetName], actuellement détenu par [rw_ri_subject.GetShortUIName], au titre de mon observation privée n° [SCOPE.GetValue('rw_scheme_evidence_serial')|0]. Enregistrer cette intention ne coûte rien et ouvre un délai de trente jours. Cela ne révoque rien et n’établit aucun jugement légal. Un transfert natif de ce titre précis, de cette personne vers moi, pourra être enregistré comme correspondant à cette intention ; cela ne prouvera pas pourquoi l’action native a eu lieu."
 rw_revocation_intents.confirm:0 "Enregistrer cette intention pour trente jours."
 rw_revocation_intents.inspect_basis:0 "Relire l’observation privée avant de décider."
 rw_revocation_intents.identity:0 "Cette entrée concerne [rw_ri_title.GetName] et [rw_ri_subject.GetShortUIName], sur la base de mon observation privée n° [SCOPE.GetValue('rw_ri_basis_serial')|0]."
 rw_revocation_intents.pending:0 "Le délai initial de trente jours est encore ouvert. Je peux retirer cette intention ou examiner les conditions habituelles de révocation si mon autorité actuelle, ma garde et le titre le permettent encore. Cette intention n’a révoqué aucun titre."
 rw_revocation_intents.withdrawn:0 "J’ai retiré cette intention. Un transfert ultérieur ne peut ni l’exécuter ni la réactiver."
 rw_revocation_intents.expired:0 "Le délai initial de trente jours a expiré. Cette intention ne peut plus être reliée à un transfert ultérieur. Aucun titre ni aucune peine n’est modifié."
 rw_revocation_intents.observed:0 "Un transfert correspondant a été observé dans le contexte natif de révocation et relié à cette intention. Ce lien constate une correspondance, pas la preuve que ce complot précis a été légalement puni."
 rw_revocation_intents.boundaries:0 "Ouvrir les conditions n’envoie rien et ne présélectionne pas le titre : choisissez le titre envisagé dans la fenêtre habituelle et confirmez-y séparément. Les restrictions, coûts, refus et conséquences natives restent déterminants. Cette entrée privée ne crée ni droit ancestral, ni grâce, ni culpabilité héritée."
 rw_revocation_intents.open_native:0 "Examiner les conditions habituelles de révocation."
 rw_revocation_intents.withdraw:0 "Retirer cette intention sans pénalité."
 rw_revocation_intents.leave:0 "Laisser la situation inchangée."
 rw_revocation_intents.unavailable:0 "L’observation, la garde, le titre ou une intention existante a changé. Aucune nouvelle intention ni aucun transfert n’est enregistré."
 rw_revocation_intents.provenance_link:0 "Cette observation correspond à mon intention enregistrée sur la base de l’observation privée n° [SCOPE.GetValue('rw_ri_basis_serial')|0]. Il s’agissait du motif que j’avais déclaré, pas d’une constatation native attribuant le transfert à cette faute."
