l_french:
 rw_restitution_transfer.observed:0 "Alors que cette promesse exacte, acceptée, était encore ouverte, un signal natif d’acquisition de titre a indiqué son passage direct du détenteur initial au bénéficiaire. Ce relevé conserve ce contexte et sa date d’observation. Il ne prouve ni une concession volontaire ni un lien causal avec la promesse, ne garantit pas la propriété actuelle et ne confirme pas la satisfaction du bénéficiaire. Il n’entraîne aucun paiement, avantage ou sanction."
 rw_restitution_transfer.unobserved:0 "Aucune observation valide de transfert direct n’est conservée pour ces clauses. L’absence de relevé ne prouve ni que le titre n’a jamais changé de mains ni que la promesse a été rompue. La confirmation du bénéficiaire reste une déclaration personnelle distincte."
