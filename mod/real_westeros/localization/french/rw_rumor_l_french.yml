l_french:
 rw_relay_rumor_interaction:0 "Transmettre un récit non vérifié"
 rw_relay_rumor_interaction_desc:0 "Choisir un récit que je connais et envisager de le raconter à ce personnage. Le premier auteur nommé et la provenance de chaque récit restent distincts d’une preuve."
 rw_review_my_rumors_interaction:0 "Consulter les récits que j’ai entendus"
 rw_review_my_rumors_interaction_desc:0 "Lire uniquement les récits qui m’ont personnellement été confiés. Les consulter ne confirme pas leur véracité et ne dévoile pas le dossier privé de leur source."
 rw_rumor.title:0 "Un récit de bouche à oreille"
 rw_rumor.claim:0 "Ce récit rapporte que [rw_ru_speaker.GetTitledFirstName] avait accusé [rw_ru_subject.GetTitledFirstName] d’avoir offensé sa maison. Il s’agit du récit d’une allégation, pas d’une faute établie."
 rw_rumor.own_account:0 "C’est mon propre récit, que je peux choisir de raconter. Le préparer ne suffit pas à le transmettre."
 rw_rumor.heard_account:0 "[rw_ru_sender.GetTitledFirstName] m’a transmis ce récit. Son premier auteur nommé reste [rw_ru_speaker.GetTitledFirstName] ; il est passé par [SCOPE.GetValue('rw_ru_hops')|0] relais."
 rw_rumor.caution:0 "La répétition ne confirme pas ce récit. L’entendre ne révèle ni la réponse de la personne visée, ni un arrangement privé, ni un jugement ou une faute familiale."
 rw_rumor.send_title:0 "Dois-je transmettre ce récit ?"
 rw_rumor.send_terms:0 "Je peux raconter ce même récit à [rw_ru_receiver.GetTitledFirstName], en nommant son premier auteur et mon propre rôle de dernier relais. Je ne dévoilerai pas le dossier privé et n’en modifierai pas les éléments."
 rw_rumor.unavailable:0 "Ce récit personnel n’est plus accessible ou ne peut plus être transmis dans ces circonstances. Cela ne prouve rien sur sa véracité."
 rw_rumor.prepare:0 "Préparer mon récit pour le raconter"
 rw_rumor.send:0 "Raconter ce récit en précisant sa source"
 rw_rumor.keep:0 "Le garder pour moi pour l’instant"
 rw_rumor.acknowledge:0 "Prendre note de ce que j’ai entendu"
 rw_rumor.send_effect:0 "Je tenterai de raconter ce récit en précisant sa source initiale. Je pourrai relayer un autre récit après trente jours. Le raconter ne prouve pas sa véracité."
