l_french:
 rw_native_sentence.title:0 "Envisager la sentence d’un prisonnier"
 rw_native_sentence.reasoned_desc:0 "Je dispose actuellement d’un motif reconnu pour exécuter [rw_jp_target.GetTitledFirstName]. Ce motif ne prouve pas à lui seul sa culpabilité dans le complot observé. Je peux ordonner la sentence selon les règles et les conséquences en vigueur, ou laisser cette affaire."
 rw_native_sentence.arbitrary_desc:0 "Je ne dispose actuellement d’aucun motif reconnu pour exécuter [rw_jp_target.GetTitledFirstName]. Je peux néanmoins tenter d’ordonner la sentence si mon autorité le permet, en assumant les conséquences d’un acte arbitraire. Je peux aussi m’abstenir."
 rw_native_sentence.unavailable:0 "La personne, la garde, les motifs ou la situation actuelle ne correspondent plus à cette décision. Je dois réexaminer la situation avant de tenter d’ordonner une sentence."
 rw_native_sentence.reasoned:0 "Tenter d’ordonner la sentence sur le motif reconnu."
 rw_native_sentence.arbitrary:0 "Tenter d’ordonner la sentence sans motif reconnu."
 rw_native_sentence.leave:0 "Laisser cette affaire pour le moment."
 rw_native_sentence.open:0 "Envisager d’ordonner une sentence."
 rw_native_sentence.receipt:0 "Relire ma tentative de sentence consignée."
 rw_native_sentence.receipt_title:0 "Une tentative de sentence consignée"
 rw_native_sentence.receipt_intro:0 "Une tentative d’ordonner une sentence contre [rw_jp_target.GetTitledFirstName] est consignée dans mon dossier."
 rw_native_sentence.receipt_reasoned:0 "Un motif d’exécution reconnu était présent au moment de ma décision."
 rw_native_sentence.receipt_arbitrary:0 "Aucun motif d’exécution reconnu n’était présent au moment de ma décision."
 rw_native_sentence.receipt_limits:0 "Ce récit conserve la tentative et ses motifs à cet instant. Il n’atteste ni que la sentence a été accomplie, ni qu’un décès ultérieur en découle, ni que le prisonnier était coupable de ce complot."
