l_french:
 rw_offer_military_restraint_interaction:0 "Proposer un engagement personnel de retenue militaire"
 rw_offer_military_restraint_interaction_desc:0 "Proposer de ne pas devenir attaquant principal contre ce personnage pendant les quatre-vingt-dix jours suivant son acceptation explicite. Cela ne crée ni trêve native ni restriction de déclaration de guerre. Il dispose de sept jours pour répondre."
 rw_review_military_restraint_interaction:0 "Consulter les engagements personnels de retenue militaire"
 rw_review_military_restraint_interaction_desc:0 "Lire les engagements conservés de cet auteur que je connais personnellement. Consulter ne crée ni accord ni prolongation ; seules les parties initiales peuvent agir sur un dossier exact et actuel."
 rw_military_restraint.title:0 "Un engagement personnel de retenue militaire"
 rw_military_restraint.parties:0 "Auteur : [scope:rw_mr_provider.GetShortUIName]. Bénéficiaire : [scope:rw_mr_beneficiary.GetShortUIName]. L’engagement proposé est de ne pas devenir attaquant principal contre ce bénéficiaire pendant les quatre-vingt-dix jours suivant l’acceptation."
 rw_military_restraint.offered:0 "Le bénéficiaire initial dispose de sept jours depuis la proposition pour accepter. Le silence ne promet rien et n’impose ni trêve, paiement ou changement d’opinion. Chaque partie initiale peut fermer l’offre."
 rw_military_restraint.active:0 "Le bénéficiaire a explicitement accepté ; la période initiale de quatre-vingt-dix jours est encore ouverte. L’auteur peut renier sa promesse et le bénéficiaire l’en délier. Aucun choix ne modifie les droits, CB ou guerres natifs ; consulter ne prolonge jamais la période."
 rw_military_restraint.observed:0 "Un callback natif de début de guerre a relevé l’auteur initial comme attaquant principal et le bénéficiaire initial comme défenseur principal pendant l’engagement accepté. Ce sont des rôles observés, pas une preuve d’initiative volontaire, de faute juridique ou de trahison délibérée. L’engagement est clos ; aucune sanction ni paix forcée ne suit."
 rw_military_restraint.renounced:0 "L’auteur initial a explicitement renié cet engagement accepté. Aucun CB, guerre, trêve, lien ou état juridique natif n’a changé et aucun devoir ne passe à un héritier."
 rw_military_restraint.released:0 "Le bénéficiaire initial a explicitement délié l’auteur de cet engagement accepté. Cela ne crée ni paiement, pardon ou trêve native et ne modifie aucun autre différend."
 rw_military_restraint.closed:0 "Une partie initiale a fermé cette offre non acceptée. Aucun engagement n’avait été accepté et aucune pénalité ne suit."
 rw_military_restraint.elapsed:0 "Le délai de proposition ou d’engagement est échu. L’absence d’observation ne certifie ni exécution, paix, culpabilité ou rupture délibérée. Aucune guerre passée n’est reconstituée et aucune sanction n’est imposée."
 rw_military_restraint.boundaries:0 "C’est un engagement politique personnel, pas une interdiction royale ou une trêve native. Les déclarations réelles, CB, restrictions et Mega Wars d’AGOT restent natifs. Seul un contexte exact et nouveau de début de guerre avec ces attaquant et défenseur principaux est relevé ; guerres défensives, participations secondaires, contextes manquants ou anciennes guerres ne sont pas déduits. Aucune pénalité automatique ni garantie d’observation exhaustive n’est créée."
 rw_military_restraint.unavailable:0 "Cet engagement exact et conservé est inaccessible à ce lecteur. Identités absentes, auteurs décédés ou données de succession n’accordent aucune autorité."
 rw_military_restraint.accept:0 "Accepter cet engagement personnel précis de quatre-vingt-dix jours, sans trêve native ni paiement."
 rw_military_restraint.close:0 "Fermer librement cette offre non acceptée."
 rw_military_restraint.renounce:0 "Renier explicitement mon engagement personnel."
 rw_military_restraint.release:0 "Délier l’auteur initial de cet engagement personnel."
 rw_military_restraint.leave:0 "Laisser ce dossier inchangé."
