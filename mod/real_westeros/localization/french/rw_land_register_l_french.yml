l_french:
 rw_review_land_register_interaction:0 "Consulter les registres fonciers des couronnes"
 rw_review_land_register_interaction_desc:0 "Relire les faits fonciers déposés qui concernent ma couronne, mes terres, mon ancienne maison ou mon rôle personnel. Le personnage sélectionné ne reçoit rien."
 rw_land_registry.consider:0 "Envisager le dépôt de ces faits fonciers auprès de la couronne."
 rw_land_registry.deposit_title:0 "Une place dans le registre foncier"
 rw_land_registry.deposit_terms:0 "Je peux déposer le transfert observé de [rw_tp_title.GetName], de [rw_tp_former_holder.GetShortUIName] à [rw_tp_new_holder.GetShortUIName], dans le registre de [rw_lr_authority.GetName]. L’entrée conservera pendant cent ans après son dépôt le titre, les parties, les dates et la maison de l’ancien détenteur au moment observé, [rw_lr_house.GetName]. Les futurs détenteurs de cette couronne ou de ces terres, les parties d’origine et les membres de cette maison précise pourront consulter ces faits. Mes observations privées, complots et motifs envisagés n’y figureront pas. Le dépôt ne coûte rien et n’accorde aucun titre ni droit légal."
 rw_land_registry.deposit:0 "Déposer uniquement ces faits de transfert foncier."
 rw_land_registry.leave:0 "Laisser cette observation dans mon journal personnel."
 rw_land_registry.record_title:0 "Le registre foncier de la couronne"
 rw_land_registry.facts:0 "L’entrée [SCOPE.GetValue('rw_lr_serial')|0] de [rw_lr_authority.GetName] consigne le passage de [rw_lr_title.GetName] de [rw_lr_former_holder.GetShortUIName] à [rw_lr_new_holder.GetShortUIName]. La maison enregistrée pour l’ancien détenteur était [rw_lr_house.GetName]. Cette entrée conserve les dates d’observation et de dépôt ; elle ne transmet aucun jugement contre cette maison."
 rw_land_registry.still_held:0 "Le destinataire enregistré détient encore ce titre. Une restitution ultérieure demanderait une décision actuelle distincte et le respect des règles natives."
 rw_land_registry.changed_holder:0 "Le titre a changé de mains depuis, ou n’a plus de détenteur. Cette entrée historique ne donne aucun droit pour le prendre à un titulaire ultérieur."
 rw_land_registry.limits:0 "Cette archive ne crée ni revendication, ni grâce, ni noblesse, ni interdiction foncière collective, ni restitution automatique. Garder le registre n’accorde aucun pouvoir supplémentaire ni accès à une affaire privée. La conservation initiale de cent ans ne se renouvelle ni à la lecture ni au changement de gardien."
 rw_land_registry.unavailable:0 "L’observation, l’autorité ou mon droit de consulter cette entrée a changé. Aucune terre ni aucune peine n’est modifiée."
 rw_land_registry.close:0 "Fermer cette entrée historique."
