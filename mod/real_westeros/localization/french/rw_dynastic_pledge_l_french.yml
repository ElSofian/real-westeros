l_french:
 rw_offer_dynastic_endowment_interaction:0 "Proposer une dotation pour la prochaine génération"
 rw_offer_dynastic_endowment_interaction_desc:0 "Proposer une dotation entre nos maisons, fixée à 50, 100, 200 ou 400 pièces d’or selon le rang du contributeur initial. Les futurs chefs peuvent reconnaître personnellement cet engagement avant de payer avec leur propre trésorerie."
 rw_review_dynastic_endowments_interaction:0 "Consulter les promesses de nos maisons"
 rw_review_dynastic_endowments_interaction_desc:0 "Lire les promesses connues en tant que signataire d’origine ou chef actuel de maison. Les consulter n’engage à rien."
 rw_dynastic_pledge.title:0 "Une promesse entre maisons"
 rw_dynastic_pledge.history:0 "[rw_dp_original_payer.GetTitledFirstName] a proposé la dotation ci-dessous à [rw_dp_original_payee.GetTitledFirstName], après le décès du bienfaiteur initial. Les chefs actuels choisissent de reconnaître l’engagement accepté et de payer avec leur propre trésorerie."
 rw_dynastic_pledge.offered:0 "Les chefs d’origine ont sept jours pour s’accorder. Aucun or n’est prélevé ; une proposition sans réponse ou devenue caduque s’éteint sans faute présumée."
 rw_dynastic_pledge.active:0 "L’engagement accepté dure vingt-cinq ans. Son exécution exige le décès du bienfaiteur initial, la reconnaissance personnelle des deux chefs actuels et les fonds correspondant au montant convenu."
 rw_dynastic_pledge.paid:0 "[rw_dp_paid_payer.GetTitledFirstName] a volontairement versé la contribution convenue à [rw_dp_paid_payee.GetTitledFirstName]. Le reçu nomme les personnes qui ont réellement payé et reçu cette somme."
 rw_dynastic_pledge.renounced:0 "Un représentant désigné a explicitement renoncé à cette promesse. Le pacte ne transmet pas la faute d’un prédécesseur à son héritier et ne modifie aucune dette existante."
 rw_dynastic_pledge.released:0 "Le représentant bénéficiaire a délié l’autre maison de cette promesse. Aucune dette bancaire, aucun titre ni aucune revendication n’a été modifié."
 rw_dynastic_pledge.closed:0 "Cette proposition ou promesse est close, expirée ou ne permet plus d’agir. Son histoire ne provoque aucun paiement et ne transmet aucune culpabilité personnelle."
 rw_dynastic_pledge.unavailable:0 "La situation a changé ou ce dossier privé n’est plus accessible. Consultez-le de nouveau avant de décider."
 rw_dynastic_pledge.accept:0 "Accepter cette promesse entre nos maisons"
 rw_dynastic_pledge.decline:0 "Retirer ou refuser cette proposition"
 rw_dynastic_pledge.recognize:0 "Reconnaître personnellement la promesse de notre maison"
 rw_dynastic_pledge.pay:0 "Honorer la promesse avec 50 pièces de mon propre or"
 rw_dynastic_pledge.renounce:0 "Ne pas reprendre cet engagement"
 rw_dynastic_pledge.release:0 "Délier l’autre maison de cette promesse"
 rw_dynastic_pledge.refresh:0 "Consulter de nouveau la situation"
 rw_dynastic_pledge.leave:0 "Laisser cette affaire pour l’instant"
