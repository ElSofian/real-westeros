l_french:
 rw_charter_compensation.title:0 "Une compensation publique à la place de la charte"
 rw_charter_compensation.parties:0 "Titre : [rw_lr_title.GetName]. Couronne : [rw_lr_authority.GetName]. Maison : [rw_lr_house.GetName]. Le payeur personnel désigné est [rw_cq_payer.GetShortUIName] ; le bénéficiaire personnel désigné est [rw_cq_payee.GetShortUIName]. Cette offre publique concerne uniquement la libération de cette charte institutionnelle précise."
 rw_charter_compensation.price25:0 "Clauses actuelles : le souverain désigné verse personnellement 25 pièces d’or au chef de maison désigné, en échange de la libération de cette charte."
 rw_charter_compensation.price50:0 "Clauses actuelles : le souverain désigné verse personnellement 50 pièces d’or au chef de maison désigné, en échange de la libération de cette charte."
 rw_charter_compensation.offered:0 "Seul l’autre représentant actuel peut accepter ces dernières clauses exactes ou les renégocier. Le délai initial de sept jours et l’échéance initiale de la charte s’appliquent tous deux. Ni une contre-offre ni une consultation ne les prolongent. Aucun or n’est encore réservé ou versé ; les sorties gratuites de la charte restent disponibles."
 rw_charter_compensation.paid:0 "Cet accord public précis conserve ensemble le paiement personnel convenu et la libération de la charte. Aucun domaine, droit foncier, trésor de maison, dette héritée, pardon juridique ou autre réparation n’est créé ou effacé. La charte initiale et les faits fonciers restent archivés ; les parties financières conservées ne sont pas remplacées par leurs successeurs."
 rw_charter_compensation.closed:0 "Un représentant actuel a fermé ces pourparlers non payés. Fermer l’offre n’a entraîné ni versement ni libération de la charte. La charte conserve son propre état et son échéance."
 rw_charter_compensation.inactive:0 "Cette offre ne permet plus de paiement : délai, version de la charte, état actif ou représentants désignés ont changé. Cela ne vaut ni consentement hérité, dette ou accord. Les représentants actuels peuvent proposer explicitement de nouvelles clauses après un vrai changement de fonction ou de version ; les anciennes fenêtres restent inactives."
 rw_charter_compensation.unfunded:0 "Le souverain désigné ne possède actuellement pas l’or personnel convenu. Aucun solde négatif de substitution, emprunt ou versement d’une banque de maison n’est autorisé. Rien n’est prélevé et la charte n’est pas libérée."
 rw_charter_compensation.limits:0 "Ces clauses financières sont publiques selon les lecteurs déjà autorisés du registre. L’or personnel n’est transféré qu’après accord des deux représentants actuels désignés ; aucune banque native AGOT, revendication, titre, guerre, sanction de maison ou autre promesse n’est modifié. Expiration ou refus n’accorde ni paiement ni devoir hérité. Conservation du registre et échéances initiales de la charte ne sont jamais prolongées."
 rw_charter_compensation.unavailable:0 "Aucune clause financière publique exacte et actuelle n’est accessible pour cette charte et ce lecteur. Des données absentes ou anciennes ne créent ni consentement ni versement."
 rw_charter_compensation.offer25:0 "Proposer publiquement 25 pièces d’or personnelles contre la libération de cette charte précise ; demander l’accord du chef actuel."
 rw_charter_compensation.request50:0 "Proposer publiquement la libération de cette charte précise contre 50 pièces d’or personnelles du souverain actuel."
 rw_charter_compensation.accept:0 "Accepter ces clauses exactes : verser l’or personnel convenu et libérer cette charte une seule fois."
 rw_charter_compensation.counter50:0 "Proposer 50 pièces d’or contre la libération ; ne rien payer ni libérer encore."
 rw_charter_compensation.counter25:0 "Proposer 25 pièces d’or contre la libération ; ne rien payer ni libérer encore."
 rw_charter_compensation.close:0 "Fermer ces pourparlers sans paiement ni libération de la charte."
 rw_charter_compensation.leave:0 "Laisser ces clauses inchangées pour l’instant."
 rw_charter_compensation.review:0 "Consulter les clauses publiques de compensation de cette charte."
 rw_charter_compensation.charter_released:0 "Cette charte a été libérée par un accord public de compensation entre ses représentants alors en fonction. Consulter cet accord pour le montant exact et les parties financières désignées. Ce n’est ni une concession de titre, un pardon ou une dette personnelle héritée."
