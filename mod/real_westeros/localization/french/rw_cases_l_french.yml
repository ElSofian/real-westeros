l_french:
 rw_cases.refer:0 "Informer notre suzerain commun du manquement et le laisser décider."
 rw_cases.0001.t:0 "Une promesse portée devant moi"
 rw_cases.0001.refusal_desc:0 "[rw_service_client.GetTitledFirstName] rapporte que [rw_service_provider.GetTitledFirstName] a expressément refusé un soutien convenu. L’accord et le refus enregistrés étayent ce fait précis ; aucun paiement n’a été prélevé. Cela ne suffit pas à établir un crime. Leur suzerain commun peut laisser ce différend de côté, réprimander le prestataire ou proposer des excuses volontaires."
 rw_cases.0001.deadline_desc:0 "[rw_service_client.GetTitledFirstName] rapporte que [rw_service_provider.GetTitledFirstName] a laissé passer l’échéance d’un soutien convenu alors que les parties étaient éligibles et le paiement possible. Aucun paiement n’a été prélevé. Ce constat porte sur l’inexécution, pas sur l’intention ou un crime. Je peux laisser ce différend de côté, réprimander le prestataire ou proposer des excuses volontaires."
 rw_cases.decline:0 "Je n’interviendrai pas dans ce différend."
 rw_cases.admonish:0 "Réprimander le prestataire : mon opinion baisse de 10 pendant deux ans."
 rw_cases.invite_repair:0 "Proposer un geste d’apaisement volontaire."
 rw_cases.lapsed:0 "Les conditions de cette décision ne sont plus réunies."
 rw_cases.0002.t:0 "Une proposition d’apaisement"
 rw_cases.0002.desc:0 "[rw_case_mediator.GetTitledFirstName] m’invite à présenter des excuses à [rw_service_client.GetTitledFirstName] pour ce manquement enregistré. Elles coûtent 25 points de prestige et améliorent de 5 l’opinion du médiateur pendant deux ans. Le client peut les accepter pour le même gain d’opinion ou les refuser. Elles n’accomplissent pas le service, ne déclenchent aucun paiement et n’effacent pas le manquement. Je peux décliner sans nouvelle peine automatique."
 rw_cases.apologise:0 "Faire un geste d’apaisement public pour 25 points de prestige."
 rw_cases.refuse_repair:0 "Refuser le geste d’apaisement proposé."
 rw_cases.0003.t:0 "Le différend prend fin"
 rw_cases.result_declined:0 "[rw_case_mediator.GetTitledFirstName] a choisi de ne pas intervenir dans ce différend politique. Aucune sanction ni aucun transfert n’a été imposé."
 rw_cases.result_admonished:0 "[rw_case_mediator.GetTitledFirstName] a exprimé sa désapprobation envers [rw_service_provider.GetTitledFirstName]. L’opinion personnelle du suzerain baisse de 10 pendant deux ans. Aucun crime, retrait de titre ou paiement n’est créé."
 rw_cases.result_repaired:0 "[rw_service_provider.GetTitledFirstName] a fait un geste d’apaisement volontaire au prix de 25 points de prestige. Le médiateur gagne 5 points d’opinion pendant deux ans. L’autre partie peut accepter (+5 points d’opinion pendant deux ans) ou refuser dans les 30 jours suivant ce geste. Le silence ne vaut pas accord. Les faits et déclarations restent inchangés ; aucun service n’est payé."
 rw_cases.result_repair_declined:0 "[rw_service_provider.GetTitledFirstName] a refusé le geste d’apaisement proposé. Le dossier est clos sans nouvelle peine automatique."
 rw_cases.result_expired:0 "Ce dossier a expiré, perdu ses conditions ou été remplacé. Cette notification n’impose aucune nouvelle sanction ni aucun transfert."
 rw_cases.acknowledge:0 "La décision est prise en compte."
 rw_case_admonished_opinion:0 "A désapprouvé lors d’un différend politique"
 rw_case_apology_opinion:0 "A accepté des excuses volontaires"
 rw_review_political_cases_interaction:0 "Consulter les affaires politiques connues"
 rw_review_political_cases_interaction_desc:0 "Lire les dossiers distincts liés à ce prestataire que vous connaissez déjà comme prestataire, client ou médiateur. Les dossiers clos sont conservés cinq ans tant que le prestataire vit. Consulter ne prend aucune décision et ne révèle pas les affaires étrangères à ces rôles."
 rw_cases.archive_title:0 "Une affaire politique consignée"
 rw_cases.archive_ruler:0 "Ce différend politique concerne [rw_service_provider.GetTitledFirstName] et [rw_service_client.GetTitledFirstName]. Le dossier transmis attend la décision de [rw_case_mediator.GetTitledFirstName]. Consulter n’autorise aucune sanction et ne prolonge aucune échéance."
 rw_cases.archive_repair:0 "[rw_case_mediator.GetTitledFirstName] a proposé un apaisement volontaire entre [rw_service_provider.GetTitledFirstName] et [rw_service_client.GetTitledFirstName]. Une réponse est attendue ; consulter ne peut imposer une coopération ni décider l’affaire."
