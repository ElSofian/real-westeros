l_french:
 rw_cases.refer:0 "Informer notre suzerain commun du manquement et le laisser décider."
 rw_cases.0001.t:0 "Une promesse portée devant moi"
 rw_cases.0001.refusal_desc:0 "[rw_service_client.GetTitledFirstName] rapporte que [rw_service_provider.GetTitledFirstName] a expressément refusé un soutien convenu. L’accord et le refus enregistrés étayent ce fait précis ; aucun paiement n’a été prélevé. Cela ne suffit pas à établir un crime. Leur suzerain commun peut laisser ce différend de côté, réprimander le prestataire ou proposer des excuses volontaires."
 rw_cases.0001.deadline_desc:0 "[rw_service_client.GetTitledFirstName] rapporte que [rw_service_provider.GetTitledFirstName] a laissé passer l’échéance d’un soutien convenu alors que les parties étaient éligibles et le paiement possible. Aucun paiement n’a été prélevé. Ce constat porte sur l’inexécution, pas sur l’intention ou un crime. Je peux laisser ce différend de côté, réprimander le prestataire ou proposer des excuses volontaires."
 rw_cases.decline:0 "Je n’interviendrai pas dans ce différend."
 rw_cases.admonish:0 "Réprimander le prestataire : mon opinion baisse de 10 pendant deux ans."
 rw_cases.invite_repair:0 "Proposer des excuses publiques, sans les imposer."
 rw_cases.lapsed:0 "Les conditions de cette décision ne sont plus réunies."
 rw_cases.0002.t:0 "Une invitation à réparer le tort"
 rw_cases.0002.desc:0 "[rw_case_mediator.GetTitledFirstName] m’invite à présenter des excuses à [rw_service_client.GetTitledFirstName] pour ce manquement enregistré. Des excuses publiques coûtent 25 points de prestige et améliorent de 5 leur opinion de moi pendant deux ans. Elles n’accomplissent pas le service initial, ne déclenchent aucun paiement et n’effacent pas le manquement. Je peux refuser ; aucune nouvelle peine ne suit automatiquement."
 rw_cases.apologise:0 "Présenter des excuses publiques pour 25 points de prestige."
 rw_cases.refuse_repair:0 "Refuser ces excuses proposées."
 rw_cases.0003.t:0 "Le différend prend fin"
 rw_cases.result_declined:0 "[rw_case_mediator.GetTitledFirstName] a choisi de ne pas intervenir dans le différend relatif au soutien promis. Aucune sanction ni aucun transfert n’a été imposé."
 rw_cases.result_admonished:0 "[rw_case_mediator.GetTitledFirstName] a réprimandé [rw_service_provider.GetTitledFirstName]. L’opinion personnelle du suzerain envers le prestataire baisse de 10 pendant deux ans. Aucun crime, retrait de titre ou paiement n’est créé."
 rw_cases.result_repaired:0 "[rw_service_provider.GetTitledFirstName] a accepté de présenter des excuses, au prix de 25 points de prestige. Le client et le médiateur gagnent 5 points d’opinion envers cette personne pendant deux ans. Le manquement initial reste enregistré ; le soutien n’est pas facturé."
 rw_cases.result_repair_declined:0 "[rw_service_provider.GetTitledFirstName] a refusé les excuses proposées. Le dossier est clos sans nouvelle peine automatique."
 rw_cases.result_expired:0 "Ce dossier a expiré, perdu ses conditions ou été remplacé. Cette notification n’impose aucune nouvelle sanction ni aucun transfert."
 rw_cases.acknowledge:0 "La décision est prise en compte."
 rw_case_admonished_opinion:0 "Désapprouve une promesse rompue"
 rw_case_apology_opinion:0 "A accepté des excuses volontaires"
 rw_review_political_cases_interaction:0 "Consulter les affaires politiques connues"
 rw_review_political_cases_interaction_desc:0 "Lire les dossiers distincts liés à ce prestataire que vous connaissez déjà comme prestataire, client ou médiateur. Les dossiers clos sont conservés cinq ans tant que le prestataire vit. Consulter ne prend aucune décision et ne révèle pas les affaires étrangères à ces rôles."
 rw_cases.archive_title:0 "Une affaire politique consignée"
 rw_cases.archive_ruler:0 "Ce dossier concerne [rw_service_provider.GetTitledFirstName] et [rw_service_client.GetTitledFirstName]. Le différend relatif au soutien promis attend la décision de [rw_case_mediator.GetTitledFirstName]. Cette consultation n’autorise aucune sanction et ne prolonge pas l’échéance."
 rw_cases.archive_repair:0 "Ce dossier concerne [rw_service_provider.GetTitledFirstName] et [rw_service_client.GetTitledFirstName]. [rw_case_mediator.GetTitledFirstName] a proposé une réparation volontaire ; le prestataire n’a pas encore répondu. La consultation n’accomplit pas le service et n’impose pas d’excuses."
