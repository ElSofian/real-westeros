l_french:
 rw_provider_price_amendment_interaction:0 "Réviser ou relire le prix du soutien promis"
 rw_client_price_amendment_interaction:0 "Demander ou relire un avenant au prix du soutien"
 rw_amendments.interaction_desc:0 "Proposer de réduire de 50 à 25 pièces d’or le prix d’un soutien différé pouvant déjà être accompli, ou relire la demande actuelle. Seule l’autre partie peut accepter ; le délai initial continue et aucun paiement n’a lieu maintenant."
 rw_amendments.title:0 "Réviser ensemble une promesse"
 rw_amendments.terms:0 "[rw_amend_proposer.GetTitledFirstName] propose à [rw_amend_responder.GetTitledFirstName] que [rw_service_provider.GetTitledFirstName] reçoive 25 pièces d’or au lieu de 50 de [rw_service_client.GetTitledFirstName] si le soutien promis est accompli. L’autre partie doit accepter explicitement sous sept jours et avant le délai de livraison initial. Jusque-là, le prix convenu reste de 50 et l’accomplissement, la rupture ou l’expiration restent possibles. Accepter ne change que le prix : aucun or, prestige, prolongement, nouveau service ou pardon. La clause de délai ci-dessous reste inchangée. Refuser, retirer ou ignorer la demande n’ajoute aucune peine."
 rw_amendments.opportunity:0 "Mon soutien différé peut maintenant être accompli. Si son prix convenu est de 50 pièces d’or, je peux demander au prestataire de le réduire à 25. Il peut refuser ou ignorer la demande. Rien n’est payé maintenant et le délai initial continue."
 rw_amendments.propose:0 "Proposer de réduire le prix de 50 à 25 pièces d’or."
 rw_amendments.accept:0 "Accepter 25 pièces d’or, au même délai initial."
 rw_amendments.refuse:0 "Refuser cet avenant et conserver le prix convenu."
 rw_amendments.withdraw:0 "Retirer ma proposition d’avenant."
 rw_amendments.leave:0 "Laisser la situation inchangée."
 rw_amendments.accepted:0 "Les deux parties ont convenu de 25 pièces d’or lors de l’accomplissement futur. Cet avenant n’a ni payé ni accompli le service et n’a pas relancé le délai de livraison initial. Le prestataire peut accomplir, attendre ou rompre la promesse selon les conditions actuelles."
 rw_amendments.unavailable:0 "Les parties, la demande, les conditions ou le délai ont changé. Aucun avenant, paiement ou prolongement n’est appliqué."
