 rw_public_support_received_opinion:0 "Soutien public reçu"
 rw_public_support.reward_rule:0 "Le soutien délivré apporte 10 de prestige pour un comte ou baron, 20 pour un duc, 35 pour un roi et 50 pour un empereur. Le bénéficiaire obtient +5 d'opinion envers ce prestataire pendant un an. Cette paire retrouve son bonus après un an, tous contrats de soutien confondus."
