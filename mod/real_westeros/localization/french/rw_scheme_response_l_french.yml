l_french:
 rw_scheme_response.open:0 "Examiner ma réponse politique"
 rw_scheme_response.read:0 "Lire la réponse politique consignée"
 rw_scheme_response.owner_title:0 "Un participant démasqué : ma réponse"
 rw_scheme_response.owner_desc:0 "[rw_scheme_participant.GetTitledFirstName] a été identifié dans un complot de meurtre contre moi. Je peux laisser cette affaire politique de côté ou, si cette personne est mon vassal direct ou membre de ma cour et qu’aucun de nous n’est emprisonné, demander une contribution volontaire de 25 pièces d’or. Cette demande lui révèle que je connais sa participation. Elle peut payer, refuser, contester ou garder le silence. Le paiement clôt uniquement cette demande : aucune immunité pénale n’est promise et les conséquences juridiques existantes demeurent. Mon délai de réponse prend fin 30 jours après l’observation. En échange, j’accorde +5 points d’opinion pendant deux ans si ce même bonus n’est pas déjà actif ; les autres paiements ne le cumulent pas et ne le renouvellent pas."
 rw_scheme_response.forego:0 "Renoncer à cette demande politique, sans paiement ni grâce juridique."
 rw_scheme_response.request:0 "Demander en privé une contribution volontaire de 25 pièces d’or."
 rw_scheme_response.later:0 "Y réfléchir plus tard, sans repousser l’échéance."
 rw_scheme_response.participant_title:0 "Une demande privée de réparation"
 rw_scheme_response.participant_desc:0 "[rw_scheme_observer.GetTitledFirstName] évoque ma participation démasquée à un complot de meurtre contre sa personne et demande 25 pièces d’or. Le paiement est volontaire et clôt uniquement cette demande politique ; il n’achète aucune immunité pénale, n’annule aucune sanction existante et ne constitue pas un aveu. Je peux refuser, contester ou garder le silence sans nouvelle peine automatique. L’échéance reste fixée à 30 jours après l’observation initiale, pas après cette demande. Le demandeur accorde +5 points d’opinion pendant deux ans si ce même bonus n’est pas déjà actif ; un bonus existant n’est ni cumulé ni renouvelé."
 rw_scheme_response.pay:0 "Accepter : payer 25 pièces d’or pour clore cette demande, sans aveu ni immunité."
 rw_scheme_response.refuse:0 "Refuser cette contribution."
 rw_scheme_response.contest:0 "Contester la demande et conserver mon démenti à côté de l’observation."
 rw_scheme_response.ignore:0 "Ne pas répondre : le silence ne vaut ni accord ni aveu."
 rw_scheme_response.acknowledge:0 "C’est noté."
 rw_scheme_response.unavailable:0 "Les conditions de cette réponse ne sont plus réunies. Aucun nouveau paiement, châtiment ou accord n’en découle."
 rw_scheme_response.history_title:0 "Une réponse politique consignée"
 rw_scheme_response.paid:0 "Le participant démasqué a accepté une contribution de 25 pièces d’or, transférée une seule fois au seigneur visé. La demande politique est close sans aveu, grâce pénale ni modification du constat de découverte. Les conséquences juridiques existantes restent distinctes. La bonne volonté convenue vaut +5 points d’opinion pendant deux ans si ce même bonus n’est pas déjà actif ; un bonus existant n’est ni cumulé ni renouvelé."
 rw_scheme_response.foregone:0 "Le seigneur visé a choisi de ne pas poursuivre cette demande de contribution politique. Aucun paiement, aucune nouvelle peine ni grâce juridique n’a été accordé ; l’observation initiale reste consignée."
 rw_scheme_response.refused:0 "Le participant démasqué a refusé cette contribution. Aucun paiement, aucune dette, aucun nouveau crime ni aucune peine automatique n’a suivi. L’observation initiale reste inchangée."
 rw_scheme_response.contested:0 "Le participant démasqué a contesté la demande. Ce démenti est conservé à côté de l’observation initiale ; il ne l’efface pas et n’établit aucun nouveau crime. Aucun paiement ni aucune nouvelle peine n’a suivi."
 rw_scheme_response.expired:0 "Aucun accord n’a été conclu avant l’échéance de réponse initiale. Le silence ou l’expiration ne vaut ni accord, ni refus, ni aveu ; aucune dette ni nouvelle peine n’est créée. Les faits consignés restent inchangés."
 rw_scheme_response.offered:0 "Une demande privée de contribution volontaire de 25 pièces d’or attend la réponse du participant dans le délai initial. Consulter ne décide rien, ne paie rien et ne prolonge pas l’échéance."
 rw_scheme_response.open_state:0 "Le seigneur visé n’a pas encore choisi de réponse politique. Consulter n’envoie aucune demande, ne suppose aucun accord et ne prolonge pas l’échéance initiale."
 rw_scheme_response.notice_title:0 "Une réponse à ma demande politique"
 rw_scheme_response.notice_desc:0 "Un participant démasqué a répondu à votre demande privée. Consultez votre propre journal pour lire sa réponse consignée. Aucun nouveau jugement juridique n’a été rendu."
 rw_review_received_scheme_request_interaction:0 "Revoir les contributions politiques qui me sont demandées"
 rw_review_received_scheme_request_interaction_desc:0 "Reprendre les demandes encore valides que ce seigneur vous a expressément adressées au sujet de votre participation démasquée. Cela ne donne aucun accès à son journal privé ni aux dossiers des autres participants. Les conditions et l’échéance initiale sont à nouveau vérifiées."
 rw_scheme_response.withdraw:0 "Retirer la demande non payée, sans prendre d’or."
 rw_scheme_response.withdraw_desc:0 "Ma demande de contribution volontaire de 25 pièces d’or attend encore une réponse. Je peux la retirer avant paiement, même si mon autorité a changé. Ce retrait ne crée ni paiement, ni dette, ni aveu, ni immunité et ne change pas le constat de découverte."
 rw_scheme_response.withdrawn:0 "Le seigneur visé a retiré sa demande avant tout paiement. Aucun or, aucune dette, aucune nouvelle peine ni grâce juridique n’a suivi ; la découverte initiale reste consignée."
 rw_scheme_response.withdraw_notice_title:0 "Une demande politique retirée"
 rw_scheme_response.withdraw_notice_desc:0 "La contribution privée qui vous était demandée a été retirée. Aucun paiement n’est dû au titre de cette demande ; les affaires juridiques existantes restent distinctes."
 rw_scheme_reparation_opinion:0 "A reçu une réparation volontaire"
