l_french:
 rw_restraint_resented_opinion:0 "Rancœur après une guerre pendant un engagement de retenue"
 rw_restraint_response.not_requested:0 "Le bénéficiaire n’a pas demandé d’explication. Les rôles principaux observés n’établissent pas à eux seuls une rupture volontaire."
 rw_restraint_response.unanswered:0 "Le bénéficiaire a demandé une explication ; aucune réponse n’est conservée. Le silence ne vaut ni reconnaissance d’une rupture délibérée ni culpabilité."
 rw_restraint_response.acknowledged:0 "L’auteur initial a explicitement déclaré assumer la rupture de son engagement. C’est sa déclaration, pas une constatation indépendante de son intention ni un verdict juridique natif."
 rw_restraint_response.contested:0 "L’auteur initial a explicitement contesté que les rôles observés dans la guerre constituent une rupture volontaire de son engagement. Cette déclaration n’efface pas l’observation et ne prouve pas son innocence."
 rw_restraint_response.pending:0 "Pendant trente jours depuis cette nouvelle observation des rôles, le bénéficiaire initial peut demander une seule explication et choisir une réaction personnelle, avec ou sans réponse. Ni la demande ni la réponse ne prolonge ce délai. Aucune pénalité d’opinion n’est automatique."
 rw_restraint_response.expired:0 "Le délai initial de réaction est échu sans réaction personnelle conservée. Le silence ne crée ni rancune, consentement, pardon ou aveu. Consulter ne peut pas rouvrir ce délai."
 rw_restraint_response.resented:0 "Le bénéficiaire a explicitement choisi la rancune : −15 d’opinion personnelle pendant deux ans seulement si cette rancœur était absente entre eux. Une rancœur existante n’est ni cumulée ni prolongée. Le fait observé et la déclaration restent distincts ; aucun crime ou effet de guerre ne suit."
 rw_restraint_response.noted:0 "Le bénéficiaire en a pris acte sans ajouter de rancune. Les autres opinions, différends et faits juridiques restent inchangés. L’observation et la réponse éventuelle sont conservées ; ce n’est pas un pardon natif."
 rw_restraint_response.request:0 "Demander une explication à l’auteur initial, sans présumer son intention ni prolonger le délai."
 rw_restraint_response.acknowledge:0 "Déclarer que j’assume avoir rompu mon engagement."
 rw_restraint_response.contest:0 "Contester que ces rôles dans la guerre signifient une rupture volontaire de mon engagement."
 rw_restraint_response.resent:0 "Garder personnellement rancune : −15 d’opinion pendant deux ans seulement si cette rancœur est absente."
 rw_restraint_response.note:0 "En prendre acte sans ajouter de rancune ni effacer les autres différends."
