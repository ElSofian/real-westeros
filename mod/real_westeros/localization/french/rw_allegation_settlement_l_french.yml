l_french:
 rw_allegation_settlement.title:0 "Un accord privé sur l’allégation"
 rw_allegation_settlement.introduction:0 "Je peux proposer de retirer cette allégation précise d’affront à ma maison contre 50 pièces d’or versées par le mis en cause. Il peut refuser ou proposer 25 pièces. Ni la proposition ni le paiement n’établissent la vérité de l’allégation. Je reste libre de retirer gratuitement l’affaire ou de saisir le suzerain avant la conclusion d’un accord."
 rw_allegation_settlement.parties:0 "Mis en cause et payeur : [scope:rw_service_provider.GetShortUIName]. Demandeur et bénéficiaire : [scope:rw_service_client.GetShortUIName]. Ces clauses portent uniquement sur le retrait de cette allégation précise."
 rw_allegation_settlement.price50:0 "Proposition actuelle : 50 pièces d’or du mis en cause au demandeur, en échange du retrait immédiat de cette allégation."
 rw_allegation_settlement.price25:0 "Proposition actuelle : 25 pièces d’or du mis en cause au demandeur, en échange du retrait immédiat de cette allégation."
 rw_allegation_settlement.offered:0 "Seule l’autre partie peut accepter les dernières clauses ou les renégocier. Le délai initial de sept jours et l’échéance initiale de l’affaire s’appliquent tous deux ; négocier ne les prolonge jamais. Avant le paiement, le demandeur reste libre de saisir le suzerain ou de retirer gratuitement l’affaire."
 rw_allegation_settlement.paid:0 "Les deux parties ont accepté les clauses conservées ; l’allégation a été retirée et le montant convenu versé une seule fois. Les déclarations conservées restent inchangées. Le paiement ne prouve ni un affront réel ni une accusation inventée, et ne protège d’aucune justice native ou autre affaire."
 rw_allegation_settlement.closed:0 "Une partie a mis fin à ces pourparlers. Ce refus n’entraîne ni paiement, ni retrait, ni nouvelle rancune. L’allégation conserve son propre état et son échéance."
 rw_allegation_settlement.inactive:0 "Ces pourparlers ne permettent plus un accord : délai initial de l’offre ou de l’affaire, état, divulgation, juridiction ou situation des participants ne le permettent plus. Cela ne vaut ni accord, ni paiement, ni retrait, ni aveu."
 rw_allegation_settlement.unfunded:0 "Le mis en cause initial ne possède actuellement pas l’or convenu. Rien n’est prélevé et l’allégation n’est pas retirée. Il peut renégocier ou refuser ; attendre ne prolonge aucune échéance."
 rw_allegation_settlement.boundaries:0 "Cet accord privé ne modifie que la clôture de cette allégation et le versement convenu. Il ne crée ni aveu, pardon, secret natif, hook, sanction juridique ou obligation héritée. Les autres faits et différends restent intacts. Le médiateur envisagé n’apprend pas ces clauses financières."
 rw_allegation_settlement.unavailable:0 "Aucune clause privée actuelle n’est accessible pour cette allégation précise et ce lecteur. Des clauses absentes ou anciennes ne créent aucun consentement."
 rw_allegation_settlement.propose:0 "Proposer le retrait de cette allégation contre 50 pièces d’or du mis en cause."
 rw_allegation_settlement.accept:0 "Accepter ces clauses exactes : le mis en cause paie l’or convenu ; retirer cette allégation maintenant."
 rw_allegation_settlement.counter25:0 "Proposer 25 pièces d’or contre le retrait ; ne rien payer ni retirer encore."
 rw_allegation_settlement.counter50:0 "Maintenir 50 pièces d’or contre le retrait ; demander un nouvel accord au mis en cause."
 rw_allegation_settlement.close:0 "Arrêter les pourparlers sans paiement ni retrait."
 rw_allegation_settlement.leave:0 "Laisser ces clauses inchangées pour l’instant."
 rw_allegation_settlement.review:0 "Consulter les clauses privées d’accord pour cette allégation."
