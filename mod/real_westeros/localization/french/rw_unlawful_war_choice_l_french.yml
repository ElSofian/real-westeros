l_french:
 rw_uw_defy_option:0 "Défier l’interdiction de mon suzerain"
 rw_uw_defy_warning:0 "Je choisis de passer outre l’interdiction de cette guerre par mon suzerain. Je ne peux pas invoquer en même temps un hameçon pour obtenir son autorisation. Toutes les autres conditions de déclaration restent applicables."
 rw_uw.royal_title:0 "Un vassal défie ma paix"
 rw_uw.royal_desc:0 "[rw_uw_attacker.GetTitledFirstName] a déclaré une guerre de revendication contre [rw_uw_defender.GetTitledFirstName] en choisissant explicitement de défier mon interdiction. Tous deux restent mes vassaux directs. Je peux ignorer ce défi, exprimer ma désapprobation ou exiger la fin des hostilités. Ce rapport ne constitue pas un constat de crime."
 rw_uw.ignore:0 "D’autres affaires me retiennent."
 rw_uw.censure:0 "Faire connaître ma désapprobation."
 rw_uw.demand:0 "Exiger la fin de ces hostilités."
 rw_uw.censure_effect:0 "Mon opinion de l’attaquant baisse de 10 pendant deux ans. Aucun titre, crime ou résultat de guerre ne change."
 rw_uw.demand_effect:0 "L’attaquant reçoit ma demande et peut en accuser réception ou la refuser ouvertement. Cela ne force pas la paix. L'autorité pourra ensuite réexaminer cette demande une fois, tant que la guerre et le délai initial restent valides."
 rw_uw.demand_title:0 "Mon suzerain exige la fin de la guerre"
 rw_uw.demand_desc:0 "[rw_uw_issuer.GetTitledFirstName] exige que je mette fin à ma guerre de revendication contre [rw_uw_defender.GetTitledFirstName]. La conduite ou le règlement de la guerre reste ma décision, selon les règles habituelles."
 rw_uw.acknowledge:0 "J’ai reçu la demande."
 rw_uw.refuse:0 "Je refuse cette ingérence."
 rw_uw.acknowledge_effect:0 "Accuser réception seulement. Je ne promets pas la paix, ne concède pas la guerre et n’avoue aucun crime. L'autorité pourra ensuite réexaminer cette demande une fois, tant que la guerre et le délai initial restent valides."
 rw_uw.refuse_effect:0 "L’opinion de mon suzerain envers moi baisse de 15 pendant deux ans. Aucun crime ou châtiment automatique n’est ajouté."
 rw_uw.censure_title:0 "Mon suzerain condamne mon défi"
 rw_uw.censure_notice:0 "[rw_uw_issuer.GetTitledFirstName] désapprouve expressément ma décision de défier son interdiction. La guerre continue selon ses règles habituelles."
 rw_uw.answer_title:0 "Une réponse à ma demande"
 rw_uw.acknowledged_notice:0 "[rw_uw_attacker.GetTitledFirstName] accuse réception de ma demande. Ce n’est pas une promesse de mettre fin à la guerre."
 rw_uw.refused_notice:0 "[rw_uw_attacker.GetTitledFirstName] refuse ouvertement ma demande. Aucun châtiment n’est imposé automatiquement."
 rw_uw.close:0 "Fermer"
 rw_uw_censured_opinion:0 "A défié ma paix"
 rw_uw_refused_stop_opinion:0 "A refusé ma demande de cesser les hostilités"
 rw_uw.native_intervene:0 "Chercher une fin négociée à cette guerre."
 rw_uw.native_intervene_effect:0 "Si les conditions le permettent encore, je demanderai des négociations pour arrêter cette guerre. Mon vassal pourra refuser ou demander une contrepartie. Cela ne garantit pas la paix."
 rw_uw.native_blocked_title:0 "L’intervention n’a pas pu être demandée"
 rw_uw.native_blocked_notice:0 "Les conditions d’intervention dans cette guerre précise ne sont plus réunies. Cette demande n’a imposé ni négociation, ni paiement, ni paix."
 rw_dl.permission_required:0 "Le relevé associé à cette déclaration indique qu’une autorisation était requise. Il ne prouve ni une infraction ni l’usage éventuel d’un hameçon."
 rw_dl.native_exception:0 "Le relevé associé à cette déclaration indique une exception reconnue à l’interdiction. Il n’identifie pas une infraction."
 rw_dl.no_ban:0 "Aucune interdiction applicable du suzerain n’a été relevée pour cette déclaration. Les autres restrictions de guerre peuvent encore s’appliquer."
 rw_dl.inconsistent:0 "Les éléments du relevé sont contradictoires. Ils ne permettent pas de qualifier la déclaration d’illégale."
 rw_uw.review_desc:0 "L'autorité réexamine cette demande tant que la guerre continue. Votre réponse reste enregistrée. Cette demande reçoit sa dernière décision. Elle ne peut pas être renvoyée en boucle."
