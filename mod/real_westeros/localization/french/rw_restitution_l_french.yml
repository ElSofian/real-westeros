l_french:
 rw_review_restitution_requests_interaction:0 "Consulter mes discussions de restitution"
 rw_review_restitution_requests_interaction_desc:0 "Relire uniquement les demandes dont je suis le demandeur ou le détenteur enregistré. Le personnage sélectionné ne reçoit rien."
 rw_restitution_refused_opinion:0 "A refusé d’examiner le retour de terres"
 rw_restitution.consider:0 "Envisager une demande de restitution au détenteur actuel."
 rw_restitution.title:0 "Une demande concernant d’anciennes terres"
 rw_restitution.request_terms:0 "[rw_lr_title.GetName] est actuellement détenu par [rw_rs_holder.GetShortUIName]. Je peux lui demander d’envisager de me rendre ce titre, sur la base de cette entrée foncière précise. Tant que l’ancien détenteur vit, lui seul peut utiliser cette demande ; après son décès, le chef actuel de la maison enregistrée peut la présenter. Elle ne coûte rien, reste ouverte trente jours et impose un an d’attente avant une nouvelle demande au même détenteur pour ce titre. Elle ne donne aucun droit de prendre ces terres."
 rw_restitution.send:0 "Demander l’examen de ce titre précis."
 rw_restitution.identity:0 "[rw_rs_requester.GetShortUIName] a demandé à [rw_rs_holder.GetShortUIName] d’examiner le cas de [rw_rs_title.GetName], en se référant à une entrée foncière déposée auprès de [rw_rs_authority.GetName]."
 rw_restitution.pending:0 "La demande est encore dans son délai initial de trente jours. Le détenteur enregistré peut accepter de l’examiner, refuser ou garder le silence. Accepter l’examen ne promet aucune terre."
 rw_restitution.talks:0 "Le détenteur a accepté d’examiner la demande. Le délai initial continue de courir. Une attribution native de titre reste une décision distincte, soumise à ses conditions et conséquences habituelles."
 rw_restitution.refused:0 "Le détenteur a refusé ou clos la discussion. Aucune sanction n’est automatique. Pendant sept jours, le demandeur peut prendre acte de la réponse ou lui en garder personnellement rancune ; cette réaction ne donne aucun droit légal."
 rw_restitution.withdrawn:0 "Le demandeur s’est retiré. Aucun titre, paiement ni châtiment n’en découle."
 rw_restitution.invalidated:0 "Un changement observé a rendu la demande enregistrée inapplicable. Un successeur ne peut répondre à la place du détenteur précédent ni hériter du consentement du demandeur."
 rw_restitution.unavailable_terms:0 "Le délai initial a expiré, ou les parties actuelles, la possession du titre ou l’entrée d’origine ne permettent plus cette discussion. Une archive historique ne crée aucun droit actuel d’agir."
 rw_restitution.now_held:0 "Le demandeur détient désormais ce titre. Ce constat actuel ne prouve pas que la discussion a causé cette acquisition."
 rw_restitution.boundaries:0 "Examiner les conditions natives d’attribution n’envoie rien et ne présélectionne aucun titre. Le détenteur doit choisir le titre envisagé et confirmer séparément. Le silence ne coûte rien ; un refus ne crée ni crime, ni culpabilité héritée, ni sanction de maison, ni restitution automatique."
 rw_restitution.accept_review:0 "Accepter l’examen, sans promettre de terres."
 rw_restitution.refuse:0 "Refuser ou clore cette discussion."
 rw_restitution.withdraw:0 "Retirer ma demande sans pénalité."
 rw_restitution.open_grant:0 "Examiner les conditions natives d’attribution au demandeur."
 rw_restitution.resent:0 "En garder rancune au détenteur — mon opinion −10 pendant deux ans si absente, sans cumul ni renouvellement."
 rw_restitution.accept_refusal:0 "Prendre acte de la réponse sans nouvelle peine."
 rw_restitution.leave:0 "Laisser la situation inchangée."
 rw_restitution.unavailable:0 "Cette demande privée ou mon identité comme partie d’origine n’est plus valide. Aucun transfert n’est effectué."
 rw_restitution.resented_history:0 "Le demandeur a choisi de garder rancune de cette réponse. Cette réaction personnelle appartient à l’historique ; elle n’établit aucun crime et ne renouvelle aucun ressentiment antérieur."
 rw_restitution.acknowledged_history:0 "Le demandeur a pris acte de la réponse sans ajouter de peine."
