l_french:
 rw_case_compensation.title:0 "Une compensation volontaire"
 rw_case_compensation.review:0 "Discuter ou consulter une compensation volontaire pour cette affaire."
 rw_case_compensation.introduction:0 "Ce différend de service est clos. [rw_service_provider.GetTitledFirstName] peut volontairement dédommager [rw_service_client.GetTitledFirstName]. Chacune des deux parties initiales peut proposer 25 ou 50 pièces d’or. La personne appelée à répondre doit accepter explicitement le dernier montant, et le prestataire doit encore pouvoir le payer. Ouvrir cette discussion ne verse rien. Cela ne crée ni dette, aveu, pardon, immunité ou nouveau jugement ; l’affaire initiale et la réponse personnelle aux excuses restent inchangées."
 rw_case_compensation.parties:0 "Cette compensation concerne uniquement le différend clos conservé entre [rw_service_provider.GetTitledFirstName] et [rw_service_client.GetTitledFirstName]. Le prestataire paie toujours le client, quelle que soit la personne ayant proposé le montant. Ces discussions financières restent privées entre les deux parties initiales."
 rw_case_compensation.price_25:0 "Montant de la compensation proposé ou conservé comme payé : 25 pièces d’or."
 rw_case_compensation.price_50:0 "Montant de la compensation proposé ou conservé comme payé : 50 pièces d’or."
 rw_case_compensation.offered:0 "Seule la personne appelée à répondre peut accepter le montant actuel ou proposer l’autre montant. Chaque partie initiale peut clore l’offre. La fenêtre initiale de sept jours n’est jamais renouvelée par une contre-offre ou une consultation. L’argent n’est pas réservé : au moment de l’acceptation, le prestataire doit posséder les fonds et les deux parties doivent être vivantes, adultes, libres et en paix entre elles."
 rw_case_compensation.paid:0 "La compensation convenue a été versée pour cette affaire exacte. Cette offre ne permet plus de la payer à nouveau. Le versement n’exécute pas le service initial, n’annule pas le manquement ou le jugement, n’efface pas la rancœur, n’accepte pas des excuses et n’atteste ni pardon ni immunité."
 rw_case_compensation.closed:0 "Une partie initiale a clos cette offre sans paiement. Aucune nouvelle dette ni sanction automatique n’en résulte."
 rw_case_compensation.inactive:0 "Cette offre a expiré ou les parties ne peuvent plus l’accepter dans les conditions présentes. Aucun argent n’est versé automatiquement ; le silence ne crée ni dette ni faute. Clore l’offre n’ajoute aucun malus."
 rw_case_compensation.boundaries:0 "Une nouvelle offre ne peut pas remplacer la fenêtre initiale de négociation de cette affaire. D’autres affaires de service conservées peuvent avoir leurs propres offres. Consulter ou contre-proposer ne paie rien, ne prolonge pas la conservation de l’affaire et ne change ni justice native, dettes bancaires, titres, guerres ou succession. Le médiateur ne reçoit pas ces clauses financières."
 rw_case_compensation.unavailable:0 "Cette affaire de service close et conservée, ces clauses actuelles ou mon identité de partie initiale ne sont plus valides. Aucun paiement ni décision n’en découle."
 rw_case_compensation.propose_25:0 "Proposer une compensation volontaire de 25 pièces d’or du prestataire au client."
 rw_case_compensation.propose_50:0 "Proposer une compensation volontaire de 50 pièces d’or du prestataire au client."
 rw_case_compensation.accept:0 "Accepter ce montant exact et le verser maintenant du prestataire au client."
 rw_case_compensation.counter:0 "Proposer l’autre montant : 25 pièces d’or au lieu de 50, ou 50 au lieu de 25."
 rw_case_compensation.close:0 "Clore cette offre sans paiement ni malus."
 rw_case_compensation.unfunded:0 "Le prestataire ne peut actuellement pas payer ce montant. L’offre ne peut pas être acceptée maintenant ; une contre-offre inférieure ou la clôture restent possibles si les autres conditions le permettent."
 rw_case_compensation.leave:0 "Quitter sans prendre de nouvelle décision."
