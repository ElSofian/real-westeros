l_french:
 rw_scheme_justice.open:0 "Examiner la situation judiciaire actuelle."
 rw_scheme_justice.title:0 "Observation et motifs judiciaires présents"
 rw_scheme_justice.intro:0 "Cet examen concerne uniquement le participant identifié dans mon observation privée. Il décrit la situation actuelle, pas le droit applicable au moment de la découverte.\n\n"
 rw_scheme_justice.own_custody:0 "Cette personne est actuellement mon prisonnier. Cela ne prouve ni la raison de son arrestation, ni que ce complot a déjà été sanctionné.\n\n"
 rw_scheme_justice.other_custody:0 "Cette personne est actuellement emprisonnée par quelqu’un d’autre. Mon observation n’autorise aucun transfert de sa détention.\n\n"
 rw_scheme_justice.free:0 "Cette personne n’est pas actuellement emprisonnée. Elle a pu être détenue ou sanctionnée auparavant.\n\n"
 rw_scheme_justice.unknown_custody:0 "La détention actuelle n’a pas pu être établie.\n\n"
 rw_scheme_justice.reason:0 "Je dispose actuellement d’un motif natif d’emprisonnement contre cette personne. Il peut concerner un autre acte ; cet examen ne permet ni de le rattacher au complot consigné, ni de garantir qu’une arrestation est possible.\n\n"
 rw_scheme_justice.no_reason:0 "Je ne dispose actuellement d’aucun motif natif d’emprisonnement contre cette personne. Cela ne prouve ni son innocence, ni une grâce, ni qu’un motif a déjà été consommé.\n\n"
 rw_scheme_justice.unknown_reason:0 "Les motifs actuels d’emprisonnement n’ont pas pu être établis.\n\n"
 rw_scheme_justice.limits:0 "Toute arrestation doit passer par l’interaction habituelle d’emprisonnement, avec ses conditions, ses risques et une éventuelle résistance. Cet examen n’impose ni ne répète de peine. Un paiement volontaire, un refus ou le silence ne modifie aucun de ces motifs judiciaires."
 rw_scheme_justice.not_living:0 "Cette observation reste consultable, mais aucun examen judiciaire actuel n’est proposé pour son participant décédé ou invalide. Aucun parent ni héritier ne lui est substitué."
 rw_scheme_justice.unavailable:0 "Cette observation privée n’est plus accessible. Aucun motif judiciaire n’est supposé."
 rw_scheme_justice.close:0 "Fermer cet examen."
