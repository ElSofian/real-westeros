l_french:
 rw_arm_house_forfeiture_interaction:0 "Ordonner les confiscations contre cette maison"
 rw_arm_house_forfeiture_interaction_desc:0 "Activer la campagne de confiscation sous le décret existant de la Couronne contre cette maison. Son échéance reste celle du décret ; chaque révocation conserve ses conditions, coûts et possibilités de résistance."
 rw_disarm_house_forfeiture_interaction:0 "Arrêter la campagne contre cette maison"
 rw_disarm_house_forfeiture_interaction_desc:0 "Retirer l’ordre permanent et mes ordres personnels contre cette même maison, sans effacer la disgrâce politique, rendre les titres ou annuler les actions natives déjà envoyées."
 rw_read_house_forfeiture_interaction:0 "Lire l’ordre de confiscation de ma Couronne"
 rw_read_house_forfeiture_interaction_desc:0 "Lire l’ordre public visant cette maison dans le royaume de mon souverain actuel, sans révéler les preuves privées à l’origine du décret."
 rw_institutional_forfeiture.title:0 "Une campagne de confiscation de la Couronne"
 rw_institutional_forfeiture.identity:0 "Cet ordre concerne la maison [rw_hs_house.GetName] sous l’autorité de [rw_hs_authority.GetName]."
 rw_institutional_forfeiture.armed:0 "Des confiscations sont ordonnées jusqu’à l’échéance initiale de la disgrâce politique. Le décret appartient à la Couronne et peut survivre à son auteur. Les seigneurs habilités du royaume peuvent demander la révocation des titres actuels de la maison, qu’ils proviennent d’un octroi, d’un héritage, d’une élection ou d’une conquête. Chaque acte reste une révocation distincte, susceptible de refus ou de résistance. Cela ne garantit pas que la maison ne détiendra plus de terres."
 rw_institutional_forfeiture.inactive:0 "La campagne est retirée, expirée ou actuellement inapplicable sous cette autorité. Cet état n’annule aucune confiscation passée."
 rw_institutional_forfeiture.boundaries:0 "Cela ne crée aucun crime ou motif personnel de révocation contre les proches. Guerres, successions, élections, conquêtes, institutions protégées et règles ordinaires de révocation restent applicables. Les ordres institutionnels et personnels de confiscation correspondants doivent être arrêtés avant un retour ducal par nos voies de restitution."
 rw_institutional_forfeiture.unavailable:0 "L’ordre ou mon accès actuel à cette autorité a changé."
 rw_institutional_forfeiture.close:0 "Fermer"
