l_french:
 rw_ut.title:0 "Un ultimatum"
 rw_ut.demand_desc:0 "[rw_scheme_observer.GetTitledFirstName] exige que j’exprime publiquement mes regrets pour notre rupture de confiance sous sept jours, faute de quoi mon arrestation pourra être demandée. Cela me coûte 25 points de prestige et clôt cette demande ; ce n’est ni un aveu, ni une immunité face à la justice. Je peux refuser ou garder le silence."
 rw_ut.unavailable_desc:0 "Cette demande n’est plus ouverte à une réponse."
 rw_ut.apologise:0 "Exprimer publiquement mes regrets."
 rw_ut.reject:0 "Je refuse cette exigence."
 rw_ut.silent:0 "Laisser cette demande sans réponse."
 rw_ut.review_title:0 "Le sort de mon ultimatum"
 rw_ut.complied_desc:0 "[rw_ja_target.GetTitledFirstName] a exprimé publiquement ses regrets. Mon ultimatum est clos. Cela ne tranche ni la culpabilité, ni aucune autre affaire judiciaire."
 rw_ut.withdrawn_desc:0 "J’ai retiré cet ultimatum. Aucune arrestation n’a été demandée par cette voie."
 rw_ut.requested_desc:0 "J’ai tenté de demander l’arrestation de [rw_ja_target.GetTitledFirstName]. Cela ne signifie pas qu’elle a eu lieu ; le refus et la résistance restent possibles."
 rw_ut.expired_desc:0 "Le délai pour donner suite à cet ultimatum est écoulé. Cette demande ne peut plus mener à une demande d’arrestation."
 rw_ut.rejected_desc:0 "[rw_ja_target.GetTitledFirstName] a refusé mon ultimatum. Je peux le retirer ou tenter de demander une arrestation si je dispose toujours du pouvoir et des motifs nécessaires. Ce refus ne crée aucune nouvelle infraction."
 rw_ut.timeout_desc:0 "Aucune réponse de [rw_ja_target.GetTitledFirstName] ne m’est parvenue dans le délai de sept jours. Je peux abandonner l’ultimatum ou tenter de demander une arrestation si cela reste possible. Le silence n’est pas un aveu."
 rw_ut.waiting_desc:0 "Je laisse sept jours à [rw_ja_target.GetTitledFirstName] pour répondre à ma demande. Je peux encore retirer mon ultimatum. Les autres affaires judiciaires restent distinctes."
 rw_ut.escalate:0 "Tenter de demander une arrestation."
 rw_ut.withdraw:0 "Retirer cet ultimatum."
 rw_ut.leave:0 "Laisser cette affaire pour le moment."
 rw_ut.issue:0 "Exiger des regrets publics sous sept jours, ou envisager l’arrestation."
 rw_ut.review:0 "Revoir mon ultimatum."
 rw_ut.withdrawn_title:0 "Un ultimatum retiré"
 rw_ut.withdrawn_notice:0 "[rw_scheme_observer.GetTitledFirstName] a retiré l’ultimatum qui m’était adressé. Cela ne règle aucune autre affaire judiciaire."
 rw_ut.apology_effect:0 "Exprimer publiquement mes regrets me coûte 25 points de prestige et clôt cette demande. Ce n’est ni un aveu, ni une immunité face à la justice."
 rw_ut.rejection_effect:0 "Je refuse cette exigence. Son auteur peut la retirer ou tenter de demander mon arrestation si cela lui est toujours possible."
