name: Validate submod
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/task-claims/**'
  pull_request:
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        env:
          RW_REQUIRE_POWERSHELL: "1"
        run: python -m unittest discover -s tests -v
      - name: Validate readiness assessment
        run: python tools/report_progress.py
      - name: Validate mod files
        run: python tools/validate_mod.py
      - name: Build experimental distribution
        run: python tools/build_distribution.py --output build/RealWesteros-experimental.zip
      - name: Upload experimental distribution
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RealWesteros-experimental-${{ github.sha }}
          path: |
            build/RealWesteros-experimental.zip
            build/RealWesteros-experimental.zip.sha256
          if-no-files-found: error
          retention-days: 7
  collector-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise collector with Windows PowerShell 5.1
        env:
          RW_PWSH: powershell.exe
          RW_REQUIRE_POWERSHELL: "1"
        run: python -m unittest discover -s tests -p test_scheme_collector.py -v
