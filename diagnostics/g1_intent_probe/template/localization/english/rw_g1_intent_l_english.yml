l_english:
 rw_g1p_stage_interaction:0 "PRIVATE G1 test: stage this exact opponent"
 rw_g1p_stage_interaction_desc:0 "Manual diagnostic only. Stage a one-day confirmation ticket for this feudal peer under the same direct liege’s ordinary war ban. This does not yet arm an exemption or declare war."
 rw_g1p_review_interaction:0 "PRIVATE G1 test: review my current ticket"
 rw_g1p_review_interaction_desc:0 "Read my latest owned ticket; do not renew it or reconstruct legality."
 rw_g1p_clear_interaction:0 "PRIVATE G1 test: clear my diagnostic context"
 rw_g1p_clear_interaction_desc:0 "Clear only my diagnostic offer/armed flags, even if target references or eligibility were lost. This changes no native war, law, hook or claim."
 rw_g1p.title:0 "PRIVATE diagnostic — genuine native claim war"
 rw_g1p.parties:0 "Actor: [rw_g1p_actor.GetShortUIName]. Exact opponent: [rw_g1p_target.GetShortUIName]. Captured direct liege: [rw_g1p_liege.GetShortUIName]. This ticket grants no exemption against another target or liege."
 rw_g1p.offered:0 "Only explicit confirmation arms this exact pair for one game day. Native claim selection, costs and all other restrictions remain native. This is a disposable-save test, not production gameplay."
 rw_g1p.armed:0 "The diagnostic context is armed for this exact pair for one game day. Open the normal Declare War interface manually on this opponent and inspect the genuine claim_cb, target title and costs. The test may still be blocked by other native checks."
 rw_g1p.observed:0 "A matching native war-start callback recorded claim_cb, primary roles and a currently observed common-liege war ban for this consumed ticket. This does not prove legal illegality, which UI route ran, hook use, cost parity, causal bypass or engine compatibility. Check the actual native war and logs."
 rw_g1p.inactive:0 "No live diagnostic window remains for this ticket. Its context is cleared, consumed or expired. No offense, successful war, fulfillment or guilt is inferred."
 rw_g1p.limits:0 "PRIVATE manual test only. No game run has established this helper override, UI/CB/AI access or AGOT compatibility. Cancelling the native window has no verified callback: use the self-clear action immediately, or wait one day. Do not use this probe for a campaign or enable it with another G1 probe/the base submod."
 rw_g1p.unavailable:0 "This exact ticket or its original references is no longer available. A stale confirmation cannot arm or clear a newer ticket. Use the self-clear diagnostic action if needed."
 rw_g1p.arm:0 "Confirm: arm only this exact diagnostic pair for one day; I will open native terms manually."
 rw_g1p.cancel:0 "Clear this exact current ticket without declaring anything."
 rw_g1p.leave:0 "Close this view without changing or extending the ticket."
