l_french:
 rw_g1p_stage_interaction:0 "TEST G1 PRIVÉ : préparer cet adversaire précis"
 rw_g1p_stage_interaction_desc:0 "Diagnostic manuel uniquement. Préparer une confirmation d’un jour pour ce pair féodal sous l’interdiction de guerre du même seigneur direct. Cela n’arme pas encore d’exception et ne déclare aucune guerre."
 rw_g1p_review_interaction:0 "TEST G1 PRIVÉ : consulter mon contexte actuel"
 rw_g1p_review_interaction_desc:0 "Lire mon dernier contexte personnel, sans prolongation ni reconstitution de légalité."
 rw_g1p_clear_interaction:0 "TEST G1 PRIVÉ : effacer mon contexte de diagnostic"
 rw_g1p_clear_interaction_desc:0 "Retirer uniquement mes marqueurs de proposition et d’armement du diagnostic, même si les références ou conditions sont perdues. Aucune guerre, loi, hook ou revendication natifs ne change."
 rw_g1p.title:0 "Diagnostic PRIVÉ — guerre native avec véritable revendication"
 rw_g1p.parties:0 "Acteur : [rw_g1p_actor.GetShortUIName]. Adversaire précis : [rw_g1p_target.GetShortUIName]. Seigneur direct enregistré : [rw_g1p_liege.GetShortUIName]. Ce contexte n’accorde aucune exception contre une autre cible ou sous un autre seigneur."
 rw_g1p.offered:0 "Seule une confirmation explicite arme ce couple précis pendant un jour de jeu. Sélection de revendication, coûts et autres restrictions restent natifs. Ce test utilise une sauvegarde jetable ; ce n’est pas une fonction prête pour une partie."
 rw_g1p.armed:0 "Le contexte de diagnostic est armé pour ce couple précis pendant un jour de jeu. Ouvrir manuellement l’interface normale de déclaration de guerre sur cet adversaire et vérifier le véritable claim_cb, le titre ciblé et les coûts. D’autres contrôles natifs peuvent encore bloquer le test."
 rw_g1p.observed:0 "Un callback natif correspondant a relevé claim_cb, les rôles principaux et une interdiction actuelle du seigneur commun pour ce contexte consommé. Cela ne prouve ni illégalité juridique, parcours d’interface, dépense de hook, égalité des coûts, contournement causal ou compatibilité moteur. Vérifier la guerre native et les journaux."
 rw_g1p.inactive:0 "Aucune fenêtre active de diagnostic ne subsiste pour ce contexte. Il est effacé, consommé ou échu. Aucune infraction, guerre réussie, exécution de promesse ou culpabilité n’est déduite."
 rw_g1p.limits:0 "Test manuel PRIVÉ uniquement. Aucun essai en jeu n’a établi ce remplacement ciblé du helper, l’accès UI/CB/IA ou la compatibilité AGOT. Aucun callback d’annulation de la fenêtre native n’est vérifié : effacer soi-même le contexte immédiatement, ou attendre un jour. Ne pas employer pour une partie ni activer avec un autre probe G1 ou le submod principal."
 rw_g1p.unavailable:0 "Ce contexte exact ou ses références initiales ne sont plus disponibles. Une ancienne confirmation ne peut ni armer ni effacer un contexte plus récent. Employer au besoin l’action personnelle d’effacement du diagnostic."
 rw_g1p.arm:0 "Confirmer : armer seulement ce couple précis pendant un jour ; j’ouvrirai moi-même les clauses natives."
 rw_g1p.cancel:0 "Effacer ce contexte actuel précis, sans rien déclarer."
 rw_g1p.leave:0 "Fermer cette vue sans changer ni prolonger le contexte."
